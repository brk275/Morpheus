# The pinned native WebRTC library is built with MSVC's static CRT. Build the
# Rust side with the same runtime to avoid LNK2038/LNK2005 at the app link.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
# Keep the reviewed bundled SQLite backport selected for project builds.
[env]
LIBSQLITE3_SYS_USE_PKG_CONFIG = { value = "0", force = true }
