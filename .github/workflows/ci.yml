# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: macOS menu diagnostic contracts
run-name: macOS menu stages b49121b - helper contracts only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-menu-contracts-b49121b
  cancel-in-progress: false
jobs:
  contracts:
    name: Reviewed Mac and Windows helper contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b49121b2fb98bf8c2c50c717dfb0aa43aa0d6527
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = b49121b2fb98bf8c2c50c717dfb0aa43aa0d6527
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Test closed menu diagnostics with bounded private logs
        timeout-minutes: 5
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import json, os, pathlib, re, select, signal, subprocess, tempfile, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          names = ('PATH','HOME','LANG','LC_ALL','TMPDIR','CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN',
              'PKG_CONFIG_PATH','LD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR','CARGO_BUILD_JOBS',
              'CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG','CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','ImageOS','RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment = {name:os.environ[name] for name in names if name in os.environ}
          root = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-offline-app-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          logs = root/'logs'; logs.mkdir(mode=0o700)
          log = logs/'cargo.log'
          reason = None
          code = None
          with log.open('xb') as output:
              program = "import pathlib, sys, unittest; sys.path.insert(0, str(pathlib.Path.cwd())); unittest.main(module=None, argv=['unittest', 'scripts.tests.test_macos_package_ui', 'scripts.tests.test_windows_package_ui', '-v'])"
              child = subprocess.Popen(['python3','-I','-B','-c',program],
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  env=environment, start_new_session=True)
              deadline = time.monotonic()+180
              size = 0
              try:
                  while True:
                      remaining = deadline-time.monotonic()
                      if remaining<=0:
                          reason='deadline'; break
                      ready,_,_=select.select([child.stdout],[],[],remaining)
                      if not ready:
                          reason='deadline'; break
                      block=os.read(child.stdout.fileno(),65536)
                      if not block: break
                      size+=len(block)
                      if size>8*1024*1024:
                          reason='output_limit'; break
                      output.write(block)
                  if reason is None:
                      code=child.wait(timeout=10)
              except (OSError,subprocess.SubprocessError):
                  reason='process_error'
              finally:
                  # Never signal an already-reaped PID/group. Timeout and
                  # overflow keep our child anchored until after group kill.
                  if child.returncode is None:
                      try: os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      child.wait(timeout=10)
                  child.stdout.close()
          with (root/'scan.log').open('wb') as output:
              scan=subprocess.run([os.environ['RUNNER_TEMP']+'/gitleaks/gitleaks','dir',str(logs),
                  '--redact=100','--ignore-gitleaks-allow','--no-banner','--max-target-megabytes','0',
                  '--config',os.environ['RUNNER_TEMP']+'/default.toml',
                  '--gitleaks-ignore-path',os.environ['RUNNER_TEMP']+'/empty.ignore'],
                  stdout=output,stderr=subprocess.STDOUT,timeout=60)
          if scan.returncode!=0:
              print('OFFLINE_NATIVE_LOG_WITHHELD',flush=True); raise SystemExit(1)
          output=log.read_text(errors='replace')
          needed={'test_each_native_menu_boundary_keeps_a_closed_failure_position',
              'test_completed_menu_keeps_the_final_boundary_until_the_next_check'}
          ok=set(re.findall(r'^([A-Za-z0-9_]+) \(scripts\.tests\.[A-Za-z0-9_.]+\) \.\.\. ok$',output,re.MULTILINE))
          count=re.findall(r'^Ran ([0-9]+) tests in ',output,re.MULTILINE)
          passed=reason is None and code==0 and needed<=ok and len(count)==1 and int(count[0])==174 and '\nOK\n' in output
          print(json.dumps({'check':'macos_menu_stage_contracts','status':'passed' if passed else 'failed',
              'source':'b49121b2fb98bf8c2c50c717dfb0aa43aa0d6527','failure':reason,
              'tests_run':int(count[0]) if len(count)==1 else None,
              'required_tests':{name:name in ok for name in sorted(needed)},
              'raw_logs_public':False,'native_app_executed':False},sort_keys=True),flush=True)
          if not passed: raise SystemExit(1)
          PY
      # No native build, package, account, vault, cache or artifact. NEVER MERGE.
