name: Temporary original-sender source checks
on:
  workflow_dispatch:
    inputs:
      admission_sha256:
        description: Exact source/setup input digest after independent review
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: morpheus-original-sender-source-check
  cancel-in-progress: false
jobs:
  sender:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/diagnostic-sender-renewal-20261028' &&
      github.actor == 'brk275' && github.triggering_actor == 'brk275' &&
      inputs.admission_sha256 == '640333f5128511503cb4cc73b624fd2cc149132eb2f6b0dbb17c8c9f20d6b298'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2765c919ba40ea9b19f006ef8379e71275c3edb4
          path: trusted
          persist-credentials: false
      - name: Reuse exact reviewed scanner and history gate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 -I ../trusted/scripts/scan_history.py \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest ../trusted/scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/morpheus-sender-history-scan"
      - name: Existing sender suites, typecheck and four-file lint only
        working-directory: candidate
        env:
          MORPHEUS_SETUP_INPUTS_SHA256: ${{ inputs.admission_sha256 }}
        run: >-
          python3 -I -B scripts/check_sender_proposal.py
          --inputs scripts/sender-source-inputs.json
          --patch scripts/sender-renewal.patch
          --scanner "$RUNNER_TEMP/gitleaks/gitleaks"
      # Temporary diagnostic branch only. No install/prepare/build hooks,
      # shared caches, artifacts, official-peer replacement or beta gate claim.
