# No package, installed UI, Wayland, physical device, live-account or artifact jobs.
name: Reviewed attachment focused checks
run-name: Themed inputs focused checks - 6a08c39 - ${{ inputs.platform }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select only affected native platforms
        type: choice
        required: true
        default: linux
        options: [linux]
permissions:
  contents: read
concurrency:
  group: themed-inputs-6a08c39-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Native ${{ matrix.name }}
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'non-intel' && '{"include":[{"name":"macOS ARM64","runner":"macos-15","os":"macOS","arch":"ARM64"},{"name":"Windows x64","runner":"windows-2025","os":"Windows","arch":"X64"},{"name":"Linux x64","runner":"ubuntu-24.04","os":"Linux","arch":"X64"}]}' || inputs.platform == 'macos-arm64' && '{"include":[{"name":"macOS ARM64","runner":"macos-15","os":"macOS","arch":"ARM64"}]}' || inputs.platform == 'macos-intel' && '{"include":[{"name":"macOS Intel","runner":"macos-15-intel","os":"macOS","arch":"X64"}]}' || inputs.platform == 'windows' && '{"include":[{"name":"Windows x64","runner":"windows-2025","os":"Windows","arch":"X64"}]}' || inputs.platform == 'linux' && '{"include":[{"name":"Linux x64","runner":"ubuntu-24.04","os":"Linux","arch":"X64"}]}' || '{"include":[{"name":"macOS ARM64","runner":"macos-15","os":"macOS","arch":"ARM64"},{"name":"macOS Intel","runner":"macos-15-intel","os":"macOS","arch":"X64"},{"name":"Windows x64","runner":"windows-2025","os":"Windows","arch":"X64"},{"name":"Linux x64","runner":"ubuntu-24.04","os":"Linux","arch":"X64"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MORPHEUS_EXPECTED_OS: ${{ matrix.os }}
      MORPHEUS_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
