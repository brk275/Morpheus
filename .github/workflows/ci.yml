              response = open_request(request)
              del token, request
              if response.status == 302:
                  locations = response.headers.get_all('Location', [])
                  response.close()
                  if len(locations) != 1 or len(locations[0]) > 16384 or any(c in locations[0] for c in '\r\n\0'):
                      fail('redirect-shape')
                  parsed = urllib.parse.urlsplit(locations[0])
                  if (parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com'
                          or parsed.username is not None or parsed.password is not None
                          or parsed.port not in (None, 443) or not parsed.path.startswith('/') or parsed.fragment):
                      fail('redirect-target')
                  # A NEW request intentionally contains no Authorization or API headers.
                  response = open_request(urllib.request.Request(locations[0],
                      headers={'Accept': 'application/octet-stream', 'User-Agent': 'Morpheus-pinned-scanner'}))
              if response.status != 200:
                  response.close()
                  fail('http-status')
              lengths = response.headers.get_all('Content-Length', [])
              if lengths and (len(lengths) != 1 or lengths[0] != str(EXPECTED_BYTES)):
                  response.close()
                  fail('length-header')
              encodings = response.headers.get_all('Content-Encoding', [])
              if encodings and encodings != ['identity']:
                  response.close()
                  fail('content-encoding')
              root = pathlib.Path(os.environ['RUNNER_TEMP'])
              destination = root / ARCHIVE_NAME
              digest, count = hashlib.sha256(), 0
              with response, destination.open('xb') as output:
                  while True:
                      chunk = response.read(min(65536, EXPECTED_BYTES + 1 - count))
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > EXPECTED_BYTES:
                          fail('body-size')
                      digest.update(chunk)
                      output.write(chunk)
              if count != EXPECTED_BYTES or digest.hexdigest() != EXPECTED_SHA256:
                  fail('archive-integrity')
              print('PINNED_SCANNER_ARCHIVE_VERIFIED exact_size=true exact_sha256=true')
          except BaseException as error:
              reason = str(error) if type(error) is ClosedFailure else 'transport-failure'
