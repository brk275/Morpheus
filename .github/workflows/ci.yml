# TEMPORARY read-only hosted metadata proof. NEVER MERGE.
name: Linux notice link census
run-name: Linux notice hardlink containment - read only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-notice-link-census-20261018
  cancel-in-progress: false
jobs:
  census:
    name: Read-only stock notice hardlink census
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Count aliases only in fixed public system notice trees
        shell: bash
        run: |
          timeout --kill-after=5s 45s /usr/bin/python3 -I -B - <<'PY_CENSUS'
          import os, stat, time, json
          try:
              assert os.environ.get("GITHUB_ACTIONS") == "true"
              assert os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"
              assert os.environ.get("RUNNER_OS") == "Linux"
              assert os.environ.get("ImageOS") == "ubuntu24"
              assert os.uname().machine == "x86_64" and os.getuid() != 0
              deadline = time.monotonic() + 30
              count, groups = 0, {}
              for root in ("/usr/share/doc", "/usr/share/common-licenses"):
                  info = os.lstat(root)
                  assert stat.S_ISDIR(info.st_mode) and info.st_uid == 0
                  for directory, dirs, files in os.walk(root, followlinks=False):
                      assert time.monotonic() < deadline
                      assert len(os.path.relpath(directory, root).split(os.sep)) <= 32
                      for name in dirs + files:
                          count += 1
                          assert count <= 250000 and time.monotonic() < deadline
                          info = os.lstat(os.path.join(directory, name))
                          if not stat.S_ISREG(info.st_mode) or info.st_nlink <= 1:
                              continue
                          assert info.st_uid == 0 and info.st_nlink <= 250000
                          key = (info.st_dev, info.st_ino)
                          if key not in groups:
                              groups[key] = [info.st_nlink, 0, bool(info.st_mode & 0o022)]
                          row = groups[key]
                          assert row[0] == info.st_nlink and row[2] == bool(info.st_mode & 0o022)
                          row[1] += 1
              contained = sum(links == seen for links, seen, writable in groups.values())
              print(json.dumps({"check":"stock_notice_link_census", "status":"passed",
                  "entries":count, "groups":len(groups), "fully_contained":contained,
                  "incomplete":len(groups)-contained,
                  "writable_groups":sum(writable for links, seen, writable in groups.values()),
                  "largest_link_count":max((links for links, seen, writable in groups.values()), default=0)}, sort_keys=True))
          except Exception:
              print('{"check":"stock_notice_link_census","status":"failed"}')
              raise SystemExit(1)
          PY_CENSUS
