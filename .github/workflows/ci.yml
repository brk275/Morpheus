          # package identities, never a server/build response, path or raw log line.
          import tomllib
          locked={(package['name'],package['version']) for package in
              tomllib.loads((workspace/'Cargo.lock').read_text(encoding='utf-8'))['package']}
          failure_markers={
              'custom_build_command':'failed to run custom build command',
              'cxx_bridge':'cxxbridge',
              'cc_tool_missing':'ToolNotFound',
              'cc_command_failed':'error occurred in cc-rs',
              'cmake_error':'CMake Error',
              'linker_error':'linking with',
              'gnu_link_extra_operand':'extra operand',
              'gnu_link_help':"link --help",
              'linker_not_found':'linker `link.exe` not found',
              'linker_unrecognized_option':'unrecognized command-line option',
              'linker_invalid_argument':'invalid argument',
              'linker_no_such_file':'No such file or directory',
              'linker_machine_conflict':'conflicts with target machine',
              'linker_corrupt':'invalid or corrupt file',
              'linker_undefined':'undefined reference',
              'linker_unresolved':'unresolved external symbol',
              'proc_macro_target':'does not support these crate types',
              'locked_resolution':'lock file needs to be updated',
              'tls_certificate':'certificate verify failed',
              'permission_denied':'Access is denied',
              'file_missing':'The system cannot find the file specified',
              'path_too_long':'The filename or extension is too long',
              'disk_full':'There is not enough space on the disk',
              'sdk_download_request':'Native SDK download request failed',
              'sdk_download_response':'Native SDK download response does not match the reviewed release',
              'sdk_identity':'Native SDK archive identity does not match the reviewed release',
              'sdk_missing_receipt':'Native SDK cache has no verified-download receipt',
              'sdk_invalid_receipt':'Invalid native SDK cache receipt',
              'sdk_receipt_mismatch':'Native SDK cache receipt does not match the reviewed release',
              'sdk_unsafe_cache':'Unsafe native SDK cache directory',
              'sdk_unsupported_path':'Unsupported native SDK archive path',
              'sdk_unsafe_path':'Unsafe native SDK archive path',
              'sdk_unsupported_type':'Native SDK archive contains an unsupported entry type',
              'sdk_extraction':'Cannot unpack native SDK archive entry',
              'sdk_cache_publish':'Cannot publish verified native SDK cache',
          }
          # First focused execution of reviewed Settings Studio UI/search changes.
          # No native package, unchanged Matrix/config/RTC/SDK suites or full platform matrix.
          # Only affected media, attachment and real generated-UI checks.
          needed_ui={'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'}
          needed_settings={'settings_search::tests::listed_section_keys_are_registry_keys_and_find_their_section', 'settings_search::tests::an_exact_section_key_always_leads_once_within_the_bound', 'settings_search::tests::a_typed_config_key_finds_its_field', 'settings_search::tests::typed_input_is_bounded_before_normalization_and_key_matching', 'settings_search::tests::exact_field_results_name_their_config_key_and_sections_none'}
          needed_permit={'style_profiles::tests::the_dialog_permit_admits_one_operation_at_a_time'}
          checks=[
              ('app_themed_ui',['cargo','test','--locked','-p','morpheus-app','--features','native-calls',
                  '--bin','morpheus-app','account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation',
                  '--','--exact','--test-threads=1'],4200,needed_ui,set()),
          ]
          all_passed=True
          for name,args,seconds,required,allowed_ignored in checks:
              result=bounded(args,name,seconds)
              report=private/(name+'-scan.json')
              if not scanner_intact():
                  print(json.dumps({'check':name,'status':'failed','reason':'scanner_integrity_failed',
                      'source':source,'raw_logs_public':False},sort_keys=True),flush=True)
                  raise SystemExit(1)
              scanned=bounded([str(scanner),'dir',str(result['log'].parent),
                  '--redact=100','--ignore-gitleaks-allow','--no-banner','--max-target-megabytes','0',
                  '--config',str(config),'--gitleaks-ignore-path',str(ignore),
                  '--report-format','json','--report-path',str(report)],name+'-scan',60,8*1024*1024)
              try:
                  clean=(scanned['reason'] is None and scanned['code']==0
                      and report.stat().st_size<=8*1024*1024 and json.loads(report.read_text(encoding='utf-8'))==[])
              except (OSError,ValueError): clean=False
              if not clean:
                  print(json.dumps({'check':name,'status':'failed','reason':'private_log_scan_failed',
                      'source':source,'raw_logs_public':False},sort_keys=True),flush=True)
                  raise SystemExit(1)
              output=result['log'].read_text(encoding='utf-8',errors='replace')
              passed=result['reason'] is None and result['code']==0
              record={'check':name,'status':'passed' if passed else 'failed','reason':result['reason'],
                  'source':source,'exit_code':result['code'],'log_bytes':result['bytes'],
                  'raw_logs_public':False,'real_accounts':False,'physical_devices':False,
                  'installed_app':False,'packages_uploaded':False}
              # Interleaved CLI stdout does not guarantee each name and ok share a line.
              # Account for every unique prefix and exact failure/ignore sets instead.
              if required is not None:
                  names=re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\.',output,re.MULTILINE)
                  seen=set(names)
                  failures=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$',output,re.MULTILINE))
                  ignored=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ignored',output,re.MULTILINE))
                  summaries=re.findall(r'^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;',output,re.MULTILINE)
                  complete=len(summaries)==1 and len(names)==len(seen)
                  a=b=c=None
                  if complete:
                      status,a,b,c=summaries[0]; a,b,c=map(int,(a,b,c))
                      complete=(len(seen)==a+b+c and len(failures)==b and len(ignored)==c
                          and failures<=seen and ignored<=seen and not failures&ignored)
                  okay=seen-failures-ignored if complete else set()
                  passed=(passed and complete and summaries[0][0]=='ok' and a>0 and b==0
                      and ignored==allowed_ignored and required<=okay)
                  record.update({'complete_test_accounting':complete,'tests_passed':a,'tests_failed':b,
                      'tests_ignored':c,'required_tests':{fixed:fixed in okay for fixed in sorted(required)}})
              record['error_codes']=sorted(set(re.findall(r'error\[(E[0-9]{4})\]',output)))
              if not passed:
                  crates=set(re.findall(r"failed to run custom build command for `([A-Za-z0-9_-]+) v([0-9][A-Za-z0-9.+_-]*)`",output))
                  # Only fixed tool families and package names from the reviewed lock
                  # may leave the private log. Normalize NULs for native UTF-16 output.
                  normalized=output.replace('\x00','')
                  folded_output=normalized.lower()
                  linker_failures=re.findall(r'linking with `([^`\r\n]{1,1024})` failed: exit code: ([0-9]{1,10})',normalized)
                  def tool_family(path):
                      value=path.replace('\\','/').lower()
                      name=value.rsplit('/',1)[-1]
                      if name not in ('link.exe','lld-link.exe','clang-cl.exe','cc','clang','gcc'): return 'other'
                      if '/git/usr/bin/' in value: return 'git_coreutils_link' if name=='link.exe' else 'other'
                      if '/vc/tools/msvc/' in value: return 'msvc_link' if name=='link.exe' else 'other'
                      return {'link.exe':'link','lld-link.exe':'lld_link','clang-cl.exe':'clang_cl',
                          'cc':'cc','clang':'clang','gcc':'gcc'}[name]
                  import shutil
                  resolved_link=shutil.which('link.exe',path=environment.get('PATH','')) if os.name=='nt' else None
                  locked_names={package for package,version in locked}
                  failed_packages=set(re.findall(r'could not compile `([A-Za-z0-9_-]+)`',normalized))
                  # Only reviewed public filenames and numeric compiler spans.
                  # Missing identifiers are admitted only if already in those public sources.
                  source_files=('crates/morpheus-app/src/settings_search.rs',
                      'crates/morpheus-app/src/appearance.rs',
                      'crates/morpheus-app/ui/controls.slint',
                      'crates/morpheus-app/ui/style-tokens.slint',
                      'crates/morpheus-app/ui/call-stage.slint',
                      'crates/morpheus-app/ui/message-search.slint',
                      'crates/morpheus-app/ui/poll-card.slint',
                      'crates/morpheus-app/ui/poll-dialog.slint',
                      'crates/morpheus-app/src/style_profiles.rs',
                      'crates/morpheus-app/src/attachment_workbench.rs',
                      'crates/morpheus-app/src/attachments.rs',
                      'crates/morpheus-app/src/image_previews.rs',
                      'crates/morpheus-app/src/account_access_ui_tests.rs',
                      'crates/morpheus-app/ui/attachment-workbench.slint',
                      'crates/morpheus-app/ui/media-viewer.slint',
                      'crates/morpheus-matrix/src/media.rs',
                      'crates/morpheus-app/src/main.rs',
                      'crates/morpheus-app/src/live.rs',
                      'crates/morpheus-app/src/timeline_model.rs',
                      'crates/morpheus-app/src/pinned_messages/mod.rs',
                      'crates/morpheus-app/src/pinned_messages/view.rs',
                      'crates/morpheus-app/src/message_search.rs',
                      'crates/morpheus-app/src/polls/mod.rs',
                      'crates/morpheus-app/ui/app-window.slint',
                      'crates/morpheus-app/ui/pinned-messages.slint',
                      'crates/morpheus-matrix/src/lib.rs',
                      'crates/morpheus-matrix/src/pinned_messages.rs')
                  locations=[]; public_identifiers=set()
                  for path in source_files:
                      file=workspace/path
                      if not file.is_file(): continue
                      text=file.read_text(encoding='utf-8')
                      public_identifiers.update(re.findall(r'\b[A-Za-z_][A-Za-z0-9_]{0,127}\b',text))
                      line_limit=len(text.splitlines())+1
                      spans={(int(line),int(column)) for line,column in re.findall(re.escape(path)+r':([0-9]{1,7}):([0-9]{1,5})',normalized)
                          if 0<int(line)<=line_limit and 0<int(column)<=4096}
                      locations.extend({'file':path,'line':line,'column':column} for line,column in sorted(spans)[:32])
                  missing=set(re.findall(r'cannot find (?:value|function|type|struct) `([A-Za-z_][A-Za-z0-9_]{0,127})`',normalized))
                  record['failure_diagnostics']={
                      'source_locations':locations,
                      'missing_public_identifiers':sorted(missing & public_identifiers)[:32],
                      'linker_failures':[{'tool':tool_family(tool),'exit_code':int(code)} for tool,code in linker_failures[:8]],
                      'path_link_family':tool_family(resolved_link) if resolved_link else 'not_resolved',
                      'locked_failed_packages':sorted(failed_packages & locked_names),
                      'markers':sorted(key for key,value in failure_markers.items() if value.lower() in folded_output),
                      'locked_build_script_crates':sorted(name+'@'+version for name,version in crates if (name,version) in locked),
                      'native_error_codes':sorted(set(re.findall(r'\b(?:LNK[0-9]{4}|C[0-9]{4})\b',normalized))),
                      'os_error_codes':sorted(set(int(code) for code in re.findall(r'os error ([0-9]{1,5})\b',output))),
                  }
              loops=len(re.findall(r'part of a binding loop',output))
              passed=passed and loops==0
              record.update({'status':'passed' if passed else 'failed','ui_binding_loop_warnings':loops})
              print(json.dumps(record,sort_keys=True),flush=True)
              all_passed=all_passed and passed
              # Failed compilation cannot yield meaningful unit checks. Independent test
              # suites still run after a test failure, using the same compiled graph.
              if not passed and record.get('complete_test_accounting') is not True: break
          if not all_passed: raise SystemExit(1)
