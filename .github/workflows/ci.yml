# Temporary diagnostic branch. Never merge this replacement CI into main.
# The existing registered manual workflow is selected at this reviewed ref only.
name: CI
run-name: Mac UI permission preflight (no Morpheus build)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-ui-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-ui-preflight:
    name: Mac UI permission preflight (${{ matrix.os }})
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/macos-ui-preflight'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify reviewed probe source and report Xcode version
        shell: bash
        run: |
          set -euo pipefail
          echo "17d768799838e8392b3c1d4e1a7c9aad59c5fe360b581990cafc2a88976f948b  scripts/macos_ui_permission_probe.swift" | shasum -a 256 --check --status
          /usr/bin/xcodebuild -version
      - name: Query existing permissions without requesting access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_root="$RUNNER_TEMP/morpheus-macos-ui-preflight"
          mkdir "$probe_root"
          /usr/bin/xcrun swiftc -module-cache-path "$probe_root/module-cache" \
            scripts/macos_ui_permission_probe.swift -o "$probe_root/probe"
          shasum -a 256 "$probe_root/probe"
          "$probe_root/probe"
