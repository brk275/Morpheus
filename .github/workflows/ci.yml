name: Reviewed search dependency metadata
run-name: Reviewed search metadata - 91516fe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-metadata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Search dependency metadata
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 91516fe5fc660e367f3bcff65ea6a0992bed3e59
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5b6aad377c86b9e98567fbc9181791fec900a065
          path: trusted
          persist-credentials: false
      - name: Install reviewed scanner and scan isolated candidate history
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 -I ../trusted/scripts/scan_history.py \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest ../trusted/scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/morpheus-history-scan"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - name: Resolve metadata without executing source build hooks
        id: metadata
        working-directory: candidate
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/metadata-target
        run: |
          python3 -I - <<'PY'
          import os, pathlib, subprocess, hashlib, json
          root = pathlib.Path.cwd()
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == '91516fe5fc660e367f3bcff65ea6a0992bed3e59'
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'])/'search-metadata-evidence'
          evidence.mkdir(mode=0o700)
          before = (root/'Cargo.lock').read_bytes()
          env = {k:v for k,v in os.environ.items() if k not in ('RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER','CARGO_BUILD_RUSTC_WRAPPER','CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER','RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTDOCFLAGS')}
          args = ['cargo','metadata','--locked','--format-version','1','--features','morpheus-app/native-calls']
          def resolve(command, name):
              with (evidence/(name+'.json')).open('wb') as out, (evidence/(name+'.stderr')).open('wb') as err:
                  return subprocess.run(command, stdout=out, stderr=err, env=env, timeout=300).returncode
          locked = resolve(args, 'locked-metadata')
          proposal = None
          if locked:
              reason = (evidence/'locked-metadata.stderr').read_text(errors='replace').lower()
              if 'lock file' in reason and '--locked' in reason:
                  # One resolution-only proposal, never compilation or a blind retry.
                  proposal = resolve([a for a in args if a != '--locked'], 'proposed-metadata')
          after = (root/'Cargo.lock').read_bytes()
          if locked == 0:
              assert before == after
          (evidence/'Cargo.lock.before').write_bytes(before)
          (evidence/'Cargo.lock.proposed').write_bytes(after)
          result = {'source':'91516fe5fc660e367f3bcff65ea6a0992bed3e59','check':'dependency_metadata','locked_exit':locked,'proposal_exit':proposal,'lock_changed':before!=after,'before_sha256':hashlib.sha256(before).hexdigest(),'after_sha256':hashlib.sha256(after).hexdigest(),'build_or_test_executed':False}
          (evidence/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('locked_passed='+str(locked == 0).lower()+'\n')
          PY
      - name: Scan metadata evidence before publication
        id: scan
        shell: bash
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/evidence-default.toml"
          : > "$RUNNER_TEMP/evidence-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/search-metadata-evidence" \
            --config "$RUNNER_TEMP/evidence-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/evidence-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --max-target-megabytes 0
      - name: Preserve resolution evidence for independent review
        if: steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-dependency-metadata-91516fe
          path: ${{ runner.temp }}/search-metadata-evidence
          retention-days: 3
          if-no-files-found: error
      - name: Require unchanged locked dependency graph
        if: steps.metadata.outputs.locked_passed != 'true'
        run: exit 1
