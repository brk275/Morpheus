name: Mac terminal process-group regressions (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-terminal-group-${{ github.sha }}
  cancel-in-progress: false
env:
  REVIEWED_SOURCE: 2b6f1617d8cd37d183936d2fa44e46dbb20d766c
  REVIEWED_TREE: 74d8626fcd35e3e5c80d7e85b18e64a7a6dd9feb
jobs:
  process:
    name: Mac terminal group regression (${{ matrix.os }})
    if: github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/temp-mac-terminal-group-regression-main48-20261105' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            machine: arm64
            runner_arch: ARM64
          - os: macos-15-intel
            machine: x86_64
            runner_arch: X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed source and standard host
        shell: python -I -B {0}
        run: |
          import json, os, platform, re, subprocess, sys
          from pathlib import Path
          assert sys.platform == 'darwin' and sys.version_info >= (3, 11)
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('RUNNER_OS') == 'macOS' and os.environ.get('ImageOS') == 'macos15'
          assert platform.machine() == os.environ['EXPECTED_MACHINE'] and os.environ['RUNNER_ARCH'] == os.environ['EXPECTED_RUNNER_ARCH']
          assert os.environ['GITHUB_REPOSITORY'] == 'brk275/Morpheus' and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'brk275'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/temp-mac-terminal-group-regression-main48-20261105'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          repository, sender = event['repository'], event['sender']
          assert repository['private'] is False and repository['full_name'] == 'brk275/Morpheus'
          assert repository['owner']['login'] == sender['login'] == 'brk275'
          assert type(repository['owner']['id']) is int and repository['owner']['id'] == sender['id'] and type(sender['id']) is int
          assert os.environ['GITHUB_ACTOR_ID'] == str(repository['owner']['id'])
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          environment = {k:v for k,v in os.environ.items() if not k.startswith(('GIT_', 'SSH_'))}
          environment.update(GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_NOSYSTEM='1', GIT_NO_REPLACE_OBJECTS='1', GIT_OPTIONAL_LOCKS='0')
          for selector, expected in [('HEAD^{commit}',os.environ['REVIEWED_SOURCE']), ('HEAD^{tree}',os.environ['REVIEWED_TREE'])]:
              assert re.fullmatch('[0-9a-f]{40}',expected) and expected != '0'*40
              result = subprocess.run(['/usr/bin/git','--no-pager','--no-replace-objects','-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false','rev-parse','--verify',selector],cwd=root,env=environment,capture_output=True,timeout=20)
              assert result.returncode == 0 and result.stdout == (expected+'\n').encode() and not result.stderr
          print('MORPHEUS_MAC_TERMINAL_GROUP_SOURCE '+os.environ['REVIEWED_SOURCE'],flush=True)
      - name: Run complete existing Mac UI and process unit file
        timeout-minutes: 3
        shell: python -I -B {0}
        run: |
          import contextlib, io, json, os, platform, sys, unittest
          from pathlib import Path
          assert sys.platform == 'darwin' and sys.version_info >= (3, 11)
          assert platform.machine() == os.environ['EXPECTED_MACHINE']
          assert os.environ['RUNNER_ARCH'] == os.environ['EXPECTED_RUNNER_ARCH']
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          sys.path.insert(0, str(root))
          portable = 'scripts.tests.test_macos_package_ui.CloseAndCleanupTests.test_mac_terminal_group_recovery_requires_actual_disappearance_and_never_signals_after_reap'
