name: Recovery helper diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-helper-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helper:
    name: Recovery acceptance helper checks only
    if: github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/draft-recovery-helper-probe' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history before candidate code executes
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          : > "$RUNNER_TEMP/gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty.ignore" \
            --log-opts=--all .
      - name: Test reviewed recovery acceptance helpers
        run: python3 -m unittest discover -s scripts/tests -p test_matrix_acceptance.py -v
      # No Rust, native, live Matrix, package or release check runs here.
      # Temporary diagnostic workflow: never merge this file into main.
