# TEMPORARY optimized live timeline acceptance. NEVER MERGE this workflow.
name: Real-room timeline acceptance
run-name: Real encrypted 10K timeline 9a99185 - exact enrolled devices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeline-live-linux-9a99185
  cancel-in-progress: false
jobs:
  contracts:
    name: Real-room optimized timeline acceptance
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9a991851e50dd62c7f93aee7c3ffa1ee5089585c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 9a991851e50dd62c7f93aee7c3ffa1ee5089585c
      - name: Scan source before executing reviewed native acceptance
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Install native Linux build and isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev \
            libsystemd-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xauth \
            dbus-x11 gnome-keyring libsecret-tools libgl1-mesa-dri fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Build the real optimized app with disclosed acceptance instrumentation
        timeout-minutes: 90
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          MORPHEUS_TIMELINE_ACCEPTANCE_BUILD: "1"
        run: cargo build --release --locked -p morpheus-app --features native-calls
      - name: Exercise real encrypted 10000-event room through both sync adapters
        timeout-minutes: 140
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- python3 -I -B - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, time
          sys.path.insert(0, str(pathlib.Path('scripts').resolve(strict=True)))
          import run_matrix_acceptance as fixture_host
          import run_timeline_acceptance as timeline
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          assert timeline.guard(os.environ) is None
          # Preserve the existing fixture ownership rule: prove no service,
          # volume or network with these fixed names exists before taking it.
          for command, names in (
              (['docker','container','ls','--all','--format','{{.Names}}'], fixture_host.FIXTURE_CONTAINERS),
              (['docker','volume','ls','--format','{{.Name}}'], fixture_host.FIXTURE_VOLUMES),
              (['docker','network','ls','--format','{{.Name}}'], (fixture_host.FIXTURE_NETWORK,)),
          ):
              result = subprocess.run(command, capture_output=True, timeout=30, check=True)
              assert len(result.stdout) <= 1024*1024
              assert not set(result.stdout.decode().splitlines()).intersection(names)
          root = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-timeline-hosted-', dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          host = fixture_host.Acceptance(root, os.environ['RUNNER_TEMP'] + '/gitleaks/gitleaks')
          # This selected workload includes 18 minutes of rate-limited seeding
          # and two 50-minute worst-case runs. No ordinary acceptance suite's
          # budget or planned checks are changed by this temporary workflow.
          host.deadline = time.monotonic() + 135*60
          # Previously verified 03fe524 forwards only a scanned, closed failure
          # record before raising; never echo exception strings or private logs.
          failed = False
          try:
              host.start_keyring()
              host.script('local_matrix_env', 'up')
              fixture = fixture_host.fixture_from_output(str(root/'accounts.json'), root)
              output = host.run('timeline_10k', [sys.executable, 'scripts/run_timeline_acceptance.py',
                  '--fixture', str(fixture), '--work', str(root/'timeline-work')], seconds=130*60)
              prefix = 'MORPHEUS_TIMELINE_10K_SUMMARY '
              records = [json.loads(line[len(prefix):]) for line in output.splitlines() if line.startswith(prefix)]
              assert len(records) == 1
              value = records[0]
              assert set(value) == {'check','status','seed','runs'}
              assert value['check'] == timeline.CHECK and value['status'] == 'passed'
              assert value['seed'] == {'events':10000} and set(value['runs']) == set(timeline.ADAPTERS)
              for adapter in timeline.ADAPTERS:
                  assert timeline.valid_report(value['runs'][adapter], 'measure', adapter)
              print(prefix + json.dumps(value, sort_keys=True), flush=True)
          except BaseException:
              failed = True
              print('TIMELINE_10K_ACCEPTANCE_FAILED private_logs_retained_on_ephemeral_host_only', flush=True)
          finally:
              host.finalizing = True
              try:
                  host.script('local_matrix_env', 'down')
                  host.verify_fixture_absence()
              except BaseException:
                  failed = True
                  print('TIMELINE_10K_CLEANUP_FAILED', flush=True)
          if failed:
              raise SystemExit(1)
          print('TIMELINE_10K_ACCEPTANCE_PASSED instrumented_linux_only', flush=True)
          PY
