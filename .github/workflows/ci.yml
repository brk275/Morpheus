# TEMPORARY focused tool-boundary diagnostic. NEVER MERGE this workflow.
name: Windows owned-window contracts
run-name: Windows selection 0adb8b9 - no native build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-selection-preflight-0adb8b9
  cancel-in-progress: false

jobs:
  inventory:
    name: Windows selection contracts on Linux
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0adb8b9c8643b1b5e3212be2c7c00fab2787708f
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 0adb8b9c8643b1b5e3212be2c7c00fab2787708f
      - name: Scan history using independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" \
            --log-opts=--all .
      - name: Test owned-window selection and fixed diagnostics
        shell: bash
        run: |
          timeout --kill-after=5s 120s python3 - <<'PY_INVENTORY'
          import json
          import unittest

          modules = ("scripts.tests.test_windows_package_ui", "scripts.tests.test_windows_window_probe")
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          def case_ids(node):
              if isinstance(node, unittest.TestSuite):
                  return [name for child in node for name in case_ids(child)]
              return [node.id()]
          required = {
              'scripts.tests.test_windows_package_ui.DiagnosticsAndReportTests.test_window_wait_requires_exactly_one_owned_visible_window',
              'scripts.tests.test_windows_package_ui.DiagnosticsAndReportTests.test_exact_event_target_is_ignored_in_either_enumeration_order',
              'scripts.tests.test_windows_package_ui.DiagnosticsAndReportTests.test_near_match_helpers_are_not_discarded',
              'scripts.tests.test_windows_package_ui.DiagnosticsAndReportTests.test_event_target_alone_waits_for_the_actual_window',
              'scripts.tests.test_windows_package_ui.DiagnosticsAndReportTests.test_foreign_and_reused_handles_fail_before_selection',
          }
          planned = case_ids(suite)
          if not required <= set(planned) or len(planned) != len(set(planned)):
              raise SystemExit("A required owned-window regression is missing or duplicated")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != len(planned):
              raise SystemExit("Owned-window checks failed, were skipped, or did not all run")
          print(json.dumps({"check": "owned_window_selection_contracts", "status": "passed", "tests": result.testsRun, "skipped": 0}, sort_keys=True))
          PY_INVENTORY
