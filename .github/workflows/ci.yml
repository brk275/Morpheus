# TEMPORARY DIAGNOSTIC BRANCH ONLY. Do not merge this workflow into main.
name: Draft restart diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-restart-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compile:
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.ref == 'refs/heads/codex/draft-restart-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Independent credential scan before candidate execution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          scan_status=0
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --max-target-megabytes 0 --report-format json \
            --report-path "$RUNNER_TEMP/source-scan.json" || scan_status=$?
          if [ "$scan_status" -ne 0 ] && [ "$scan_status" -ne 1 ]; then
            echo "Independent source scanner failed; private report withheld"
            exit 1
          fi
          python3 - <<'PY'
          import collections, hashlib, json, os
          from pathlib import Path
          # Root-reviewed exact upstream test fixtures. No candidate scanner allowlists.
          expected = {'vendor/livekit-api/src/test_token.txt': {'sha256': '45fb9c7ff611f830d96b61c071a3b4d6b6b034442e424acef10566fb705838d0', 'findings': [['jwt', 1, 1]]}, 'vendor/matrix-rtc-core/src/client/tests.rs': {'sha256': '491c6ab21475df2cc2edae150194199b9d94cfa06c804e14c282ae2c6dd673d4', 'findings': [['generic-api-key', 166, 166]]}, 'vendor/matrix-rtc-core/src/host/event.rs': {'sha256': 'f61742a9622ceecd1a36c38b0e454da66be7920e911b3fd267380146462dfe5a', 'findings': [['generic-api-key', 454, 454], ['generic-api-key', 514, 514]]}, 'vendor/matrix-rtc-core/src/compat/room_state.rs': {'sha256': '084b4ace74155f9d189af91a1a3cab06383fc7dc312491c899091a1c14439d63', 'findings': [['generic-api-key', 1062, 1062], ['generic-api-key', 1074, 1074]]}, 'vendor/matrix-rtc-core/src/compat/sticky_2025.rs': {'sha256': '8ec2d4339e0c850833594c088e005f365773a44683b7c142492c5128bb86759f', 'findings': [['generic-api-key', 628, 628], ['generic-api-key', 633, 633], ['generic-api-key', 644, 644], ['generic-api-key', 738, 738], ['generic-api-key', 752, 752], ['generic-api-key', 771, 771], ['generic-api-key', 772, 772], ['generic-api-key', 773, 773], ['generic-api-key', 790, 790], ['generic-api-key', 801, 801]]}}
          observed = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-scan.json").read_text())
          if not isinstance(observed, list):
              raise SystemExit("Independent source scan report invalid")
          allowed = collections.Counter()
          for name, record in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != record["sha256"]:
                  raise SystemExit("Reviewed upstream fixture changed")
              for rule, start, end in record["findings"]:
                  allowed[(name, rule, start, end)] += 1
          actual = collections.Counter()
          for row in observed:
              if not isinstance(row, dict):
                  raise SystemExit("Independent source scan report invalid")
              actual[(row.get("File"), row.get("RuleID"), row.get("StartLine"), row.get("EndLine"))] += 1
          if actual != allowed:
              raise SystemExit("Unreviewed source scan finding; private report withheld")
          print("Independent full-tree scan: exact 16 unchanged upstream test fixtures; zero unreviewed findings")
          PY
      - name: Targeted diagnostics helper tests
        run: python3 -m unittest discover -s scripts/tests -p test_matrix_acceptance.py -v
      - name: Matrix and disposable vault dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libclang-dev libdbus-1-dev dbus-x11 gnome-keyring libsecret-tools
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - name: Separate fixture compilation from live runtime diagnosis
        timeout-minutes: 40
        run: cargo test --locked -p morpheus-matrix --test live_local --test drafts_local --no-run
      - name: Probe live then draft restart with unchanged per-command deadlines
        timeout-minutes: 42
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dbus-run-session -- python3 -u - <<'PY'
          import json, os, shutil, subprocess, sys, tempfile, time
          from pathlib import Path
          if (os.environ.get("GITHUB_ACTIONS") != "true"
                  or os.environ.get("RUNNER_OS") != "Linux"
                  or os.environ.get("GITHUB_REPOSITORY") != "brk275/Morpheus"
                  or os.environ.get("GITHUB_REF") != "refs/heads/codex/draft-restart-probe"
                  or not os.environ.get("DBUS_SESSION_BUS_ADDRESS")):
              raise SystemExit("Fresh diagnostic runner guard failed")
          sys.path.insert(0, str(Path("scripts").resolve()))
          from run_matrix_acceptance import Acceptance, FIXTURE_CONTAINERS, FIXTURE_VOLUMES, FIXTURE_NETWORK, fixture_from_output
          scanner = str(Path(os.environ["RUNNER_TEMP"]) / "gitleaks/gitleaks")
          for command in ("docker", "cargo", "gnome-keyring-daemon", "secret-tool", scanner):
              if not shutil.which(command):
                  raise SystemExit("Required diagnostic command unavailable")
          for command, names in (
              (["docker", "container", "ls", "--all", "--format", "{{.Names}}"], FIXTURE_CONTAINERS),
              (["docker", "volume", "ls", "--format", "{{.Name}}"], FIXTURE_VOLUMES),
              (["docker", "network", "ls", "--format", "{{.Name}}"], (FIXTURE_NETWORK,)),
          ):
              try:
                  inventory = subprocess.run(command, capture_output=True, text=True, timeout=30)
              except (OSError, subprocess.SubprocessError, UnicodeError):
                  raise SystemExit("Diagnostic inventory unavailable") from None
              if inventory.returncode or set(inventory.stdout.splitlines()).intersection(names):
                  raise SystemExit("Diagnostic fixture ownership refused")
          root = Path(tempfile.mkdtemp(prefix="morpheus-draft-probe-", dir=os.environ["RUNNER_TEMP"]))
          acceptance = Acceptance(root, scanner)
          failed = False
          cleanup_failed = False
          try:
              acceptance.start_keyring()
              acceptance.require_containment()
              acceptance.script("local_matrix_env", "up")
              fixture = fixture_from_output(str(root / "accounts.json"), root)
              for name in ("live_local", "drafts_local"):
                  acceptance.group((name,), lambda name=name: acceptance.test(name, fixture))
              selected = {row["check"] for row in acceptance.results}
              failed = (not {"live_local", "drafts_local"}.issubset(selected)
                        or bool(acceptance.failures) or bool(acceptance.not_run))
          except BaseException:
              failed = True
              print("Draft restart probe failed; private child output withheld", flush=True)
          finally:
              acceptance.finalizing = True
              for service in ("local_matrix_rtc", "local_matrix_env"):
                  try:
                      acceptance.script(service, "down")
                  except BaseException:
                      cleanup_failed = True
              try:
                  acceptance.verify_fixture_absence()
              except BaseException:
                  cleanup_failed = True
              print(json.dumps({"diagnostic": "draft_restart", "full_acceptance": False,
                                "selected_checks": ["live_local", "drafts_local"],
                                "fixture_precompiled": True,
                                "cleanup_complete": not cleanup_failed,
                                "status": "failed" if failed or cleanup_failed else "passed"}), flush=True)
          raise SystemExit(1 if failed or cleanup_failed else 0)
          PY
