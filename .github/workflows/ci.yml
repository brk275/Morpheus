# TEMPORARY owner-only encrypted delivery. NEVER MERGE this workflow.
name: Encrypted ARM owner preview
run-name: Private ARM preview 7ec8c2a - encrypted, not a release
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build encrypted owner preview after the existing ARM package job finishes
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: private-arm-preview-7ec8c2a
  cancel-in-progress: false
jobs:
  scope:
    name: Verify source and preview boundaries
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed application source
        run: test "$(git rev-parse HEAD)" = 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
      - name: Scan reviewed source history with independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: delivery
          persist-credentials: false
      - name: Verify immutable delivery source and test synthetic bundle boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C delivery rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B - <<'PY_BOUNDARIES'
          import importlib.util, pathlib, unittest
          source = pathlib.Path("delivery/scripts/tests/test_seal_owner_preview.py").resolve(strict=True)
          spec = importlib.util.spec_from_file_location("preview_boundaries", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if not result.wasSuccessful() or result.skipped or result.testsRun != 6:
              raise SystemExit("Owner preview boundary contracts failed")
          print('{"check":"owner_preview_boundaries","status":"passed","tests":6}')
          PY_BOUNDARIES
      - name: Require the existing ARM build to have finished successfully before another build
        if: inputs.build
        shell: bash
        run: |
          python3 -I -B - <<'PY_GATE'
          import json, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(path):
              request = urllib.request.Request("https://api.github.com/repos/brk275/Morpheus/" + path,
                  headers={"Accept":"application/vnd.github+json"})
              with opener.open(request, timeout=20) as response:
                  raw = response.read(2*1024*1024+1)
              if len(raw) > 2*1024*1024:
                  raise ValueError("Bounded run metadata exceeded")
              return json.loads(raw)
          try:
              run = get("actions/runs/39151951829")
              assert run["head_sha"] == "96fa2a883f3c80e3c32bca1f293931d6fe0e56ee"
              assert run["run_attempt"] == 1 and run["event"] == "workflow_dispatch"
              assert run["path"] == ".github/workflows/package-qa.yml" and run["head_branch"] == "main"
              jobs = get("actions/runs/39151951829/jobs?per_page=100")
              assert jobs["total_count"] == len(jobs["jobs"]) == 3
              arm = [job for job in jobs["jobs"] if job["id"] == 117747281275]
              assert len(arm) == 1 and arm[0]["labels"] == ["macos-15"]
              assert arm[0]["name"] == "Package validation (macos-arm64)" and arm[0]["status"] == "completed"
              build = [step for step in arm[0]["steps"] if step["name"] == "Build unsigned QA package"]
              assert len(build) == 1 and build[0]["conclusion"] == "success"
              artifacts = get("actions/runs/39151951829/artifacts?per_page=100")
              assert artifacts["total_count"] == 0
          except Exception:
              print('{"check":"prior_arm_build","status":"refused"}')
              raise SystemExit(1) from None
          print('{"check":"prior_arm_build","status":"passed","unretained_binary":true}')
          PY_GATE

  preview:
    name: Build and seal ARM owner preview
    needs: scope
    if: inputs.build && github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: macos-15
    concurrency:
      group: native-7ec8c2acc1e8abb1117d20f53584d58bedfd75a4-macos-15
      cancel-in-progress: false
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: delivery
          persist-credentials: false
      - name: Verify both immutable checkouts and standard ARM host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
          test "$(git -C ../delivery rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          case "$ImageOS" in macos15|macos15-arm64) ;; *) exit 1 ;; esac
          test -x /opt/homebrew/opt/openssl@3/bin/openssl
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: candidate -> target
          key: package-inputs-${{ hashFiles('candidate/Cargo.toml', 'candidate/Cargo.lock') }}
          save-if: false
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build the native private preview bundle
        run: python3 scripts/package.py --formats app
      - name: Seal only the built application to the owner's public recipient
        run: >-
          python3 -I -B ../delivery/scripts/seal_owner_preview.py
          --source "$PWD"
          --certificate "$GITHUB_WORKSPACE/delivery/.preview/recipient.crt"
          --certificate-sha256 d8c2865fc684fe66112d32f4ddd8d86bb359a6302ba0715fd81af2659a0e3560
          --output "$RUNNER_TEMP/morpheus-owner-preview"
      - name: Upload encrypted bytes only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-preview-7ec8c2a-arm64-encrypted
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/morpheus-owner-preview/upload/morpheus-arm64.cms
            ${{ runner.temp }}/morpheus-owner-preview/upload/receipt.json
