          import io, tarfile, zipfile
          source='7c2d9b4968ad1291d787c057ae9f2ea3f6dc2725'
          scanner=private/('gitleaks.exe' if os.name=='nt' else 'gitleaks')
          archive_digests={
              ('Linux','X64'):'551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb',
              ('macOS','ARM64'):'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5',
              ('macOS','X64'):'dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709',
              ('Windows','X64'):'d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e',
          }
          # Revalidate the independently pinned scanner and its rules after every
          # candidate process. Candidate output cannot authorize a new scanner.
          def scanner_intact():
              try:
                  with (private/'verified-scanner-archive').open('rb') as saved:
                      data=saved.read(32*1024*1024+1)
                  if len(data)>32*1024*1024 or hashlib.sha256(data).hexdigest()!=archive_digests[(os.environ['RUNNER_OS'],os.environ['RUNNER_ARCH'])]: return False
                  if os.name=='nt':
                      with zipfile.ZipFile(io.BytesIO(data)) as packaged:
                          member=packaged.getinfo('gitleaks.exe')
                          if member.file_size>64*1024*1024: return False
                          expected=packaged.read(member)
                  else:
                      with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as packaged:
                          member=packaged.getmember('gitleaks')
                          if not member.isfile() or member.size>64*1024*1024: return False
                          expected=packaged.extractfile(member).read(64*1024*1024+1)
                  with scanner.open('rb') as binary: actual=binary.read(64*1024*1024+1)
                  with config.open('rb') as rules: fixed=rules.read(1024)
                  with ignore.open('rb') as exclusions: empty=exclusions.read(1)
                  return (len(expected)<=64*1024*1024 and hashlib.sha256(actual).digest()==hashlib.sha256(expected).digest()
                      and fixed==b'[extend]\nuseDefault = true\n' and empty==b'')
              except Exception: return False
          config=private/'default.toml'; ignore=private/'empty.ignore'
          # Failure-only closed diagnostics: emit known marker IDs and exact locked
          # package identities, never a server/build response, path or raw log line.
          import tomllib
          locked={(package['name'],package['version']) for package in
              tomllib.loads((workspace/'Cargo.lock').read_text())['package']}
          failure_markers={
              'custom_build_command':'failed to run custom build command',
              'cxx_bridge':'cxxbridge',
              'cc_tool_missing':'ToolNotFound',
              'cc_command_failed':'error occurred in cc-rs',
              'cmake_error':'CMake Error',
