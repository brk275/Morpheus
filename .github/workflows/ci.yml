                  return None
              text = body.decode(errors='replace')
              patterns = {
                  'rust-macro-recursion': r'recursion limit reached while expanding',
                  'rust-macro-syntax': r'no rules expected|unexpected end of macro invocation|local ambiguity when calling macro',
                  'rust-parser-syntax': r'(?m)^error: expected |(?m:^error: mismatched closing delimiter)|unclosed delimiter',
                  'custom-build-failure': r'failed to run custom build command for',
                  'native-sdk-response-refused': r'Native SDK download response does not match the reviewed release',
                  'network-transfer': r'failed to download|failed to get successful HTTP response|Could not resolve host|Connection timed out|connection reset',
                  'disk-space': r'No space left on device|not enough space on the disk|disk full',
                  'link-failure': r'linking with [^\r\n]{1,200} failed|linker command failed|(?m:^ld:)|(?m:^lld-link:)',
                  'toolchain-unavailable': r'toolchain [^\r\n]{1,200} is not installed|component [^\r\n]{1,200} is unavailable',
                  'compiler-process-killed': r'signal: 9|SIGKILL|Killed signal terminated program',
              }
              kinds = sorted(name for name, pattern in patterns.items() if re.search(pattern, text))
              rust_codes = sorted(set(re.findall(r'error\[(E[0-9]{4})\]', text)))[:16]
              if rust_codes:
                  kinds.append('rust-coded-error')
              statuses = sorted(set(int(value) for value in re.findall(
                  r'(?:HTTP(?:/[0-9](?:\.[0-9])?)?(?: status(?: code)?)?|status code|status[:=]|curl: \(22\) The requested URL returned error:)\s*([45][0-9]{2})\b', text)))[:16]
              if statuses:
                  kinds.append('http-failure-status')
              if not kinds:
                  kinds.append('unclassified')
              native_sdk_responses = []
              response_pattern = (r'Native SDK download response does not match the reviewed release: '
                  r'status=([1-9][0-9]{2}) content_length=(None|Some\(([0-9]{1,20})\)) '
                  r'expected_bytes=([0-9]{1,20})(?![0-9])')
              for status, length_token, length_value, expected_value in re.findall(response_pattern, text)[:4]:
                  status, expected = int(status), int(expected_value)
                  length = None if length_token == 'None' else int(length_value)
                  if (100 <= status <= 999 and expected == 265849959
                          and (length is None or 0 <= length <= 18446744073709551615)
                          and (status != 200 or length is not None and length != expected)):
                      native_sdk_responses.append({'status': status, 'content_length': length,
                                                   'expected_bytes': expected})
              # Emit only regular .rs paths authenticated against this immutable Git tree.
              # Absolute runner paths, dependency-cache paths and unknown names never leave.
              matches = sorted(set(re.findall(
                  r'((?:crates|vendor)/[A-Za-z0-9_./-]{1,180}\.rs):([1-9][0-9]{0,6}):([1-9][0-9]{0,5})\b', text)))[:8]
              locations = []
              environment = {key: value for key, value in os.environ.items()
                             if not key.startswith(('GIT_', 'SSH_'))}
              environment.update(GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_NOSYSTEM='1',
                  GIT_NO_REPLACE_OBJECTS='1', GIT_OPTIONAL_LOCKS='0', GIT_NO_LAZY_FETCH='1')
              for path, line, column in matches:
                  pure = pathlib.PurePosixPath(path)
                  if str(pure) != path or '..' in pure.parts:
                      continue
                  try:
                      result = subprocess.run(['git', '--no-pager', '--no-replace-objects',
                          '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false',
                          'ls-tree', '--full-tree', '-z', source, '--', path], cwd=root,
                          env=environment, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                          check=False, timeout=10)
                  except (OSError, subprocess.SubprocessError):
                      continue
                  expected = rb'100644 blob [a-f0-9]{40}\t' + re.escape(path.encode('ascii')) + rb'\x00'
                  if result.returncode == 0 and len(result.stdout) <= 256 and re.fullmatch(expected, result.stdout):
                      locations.append({'path': path, 'line': int(line), 'column': int(column)})
              return {'schema': 1, 'check': 'focused_ui_failed_compile', 'fixed_source': source,
                  'cargo_status': codes[0], 'capture_status': codes[1], 'observed_kinds': sorted(kinds),
                  'rust_error_codes': rust_codes, 'http_failure_statuses': statuses,
                  'native_sdk_responses': native_sdk_responses,
                  'repo_locations': locations, 'compile_log_sha256': hashlib.sha256(body).hexdigest(),
                  'original_compile_failed': True, 'case_executed': False, 'partial': True}
          if code:
              errors = sorted(set(re.findall(rb'error\[(E[0-9]{4})\]', body)))
              print('FOCUSED_UI_COMPILER_FAILED codes=' + ','.join(item.decode() for item in errors))
              fact = compiler_failure_fact(body, codes, 'f8efe63ad6c92c821bdff5f530fe7abbabaaf2ac', pathlib.Path.cwd())
              if fact is not None:
                  print('FOCUSED_UI_COMPILER_FAILURE_DIAGNOSTIC ' + json.dumps(fact, sort_keys=True, separators=(',', ':')))
          assert codes == [0, 0]
          print('FOCUSED_UI_COMPILED exact_source=true native_calls=true slint_debug_info=true')
          PY_COMPILE
      - name: Run exactly the existing generated UI regression
        id: exact
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case_name='account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'
          set +e
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app "$case_name" -- --list --exact 2>&1 | head -c 16777217 > "$RUNNER_TEMP/focused-ui-logs/list.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s %s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/focused-ui-list-status"
          "$RUNNER_TEMP/focused-ui-scanner/gitleaks" dir "$RUNNER_TEMP/focused-ui-logs" \
            --config "$RUNNER_TEMP/focused-ui-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/focused-ui-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --max-target-megabytes 0 --no-banner
          python3 -I -B - <<'PY_LIST'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          body = (root / 'focused-ui-logs/list.log').read_bytes()
          assert len(body) <= 16 * 1024 * 1024
          assert (root / 'focused-ui-list-status').read_text().split() == ['0', '0']
          expected = b'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation: test'
          assert body.splitlines().count(expected) == 1
          print('FOCUSED_UI_LISTED exact_count=1')
          PY_LIST
          set +e
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app "$case_name" -- --exact --test-threads=1 2>&1 | head -c 16777217 > "$RUNNER_TEMP/focused-ui-logs/case.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s %s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/focused-ui-case-status"
          "$RUNNER_TEMP/focused-ui-scanner/gitleaks" dir "$RUNNER_TEMP/focused-ui-logs" \
            --config "$RUNNER_TEMP/focused-ui-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/focused-ui-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --max-target-megabytes 0 --no-banner
          python3 -I -B - <<'PY_CASE'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          body = (root / 'focused-ui-logs/case.log').read_bytes()
          assert len(body) <= 16 * 1024 * 1024
          text = body.decode(errors='replace')
          case = 'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'
          codes = [int(value) for value in (root / 'focused-ui-case-status').read_text().split()]
          assert len(codes) == 2
          code = codes[0]
          passed = len(re.findall(r'^test ' + re.escape(case) + r' \.\.\. ok$', text, re.MULTILINE))
          summaries = re.findall(r'^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; ([0-9]+) filtered out; finished in [^\r\n]+$', text, re.MULTILINE)
          panic = sorted(set(re.findall(r'panicked at (crates/[A-Za-z0-9_./-]+\.rs:[0-9]+:[0-9]+)', text)))[:16]
          print(json.dumps({'fixed_source': 'f8efe63ad6c92c821bdff5f530fe7abbabaaf2ac',
              'platform': 'macos-15', 'exact_test': case, 'exit_status': code,
              'exact_success_count': passed, 'nonignored_one_pass_summary_count': len(summaries), 'case_log_sha256': hashlib.sha256(body).hexdigest(),
              'panic_locations': panic, 'partial': True}, sort_keys=True))
          def unique_fields(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate diagnostic field')
                  result[key] = value
              return result
          def reject_constant(_value):
              raise ValueError('nonfinite diagnostic constant')
          def valid_tail_fact(value):
              boolean_keys = {'latest_thread_report_is_tail', 'any_thread_report_is_tail',
                  'first_reply_mounted', 'wheel_point_in_current_viewport',
                  'viewport_inside_window', 'seek_active', 'original_assertion_failed'}
              pixel_keys = {'viewport_height_px', 'viewport_top_px', 'viewport_bottom_px',
                  'window_width_px', 'window_height_px', 'content_height_px',
                  'content_y_px', 'estimated_end_gap_px'}
              keys = boolean_keys | pixel_keys | {'schema', 'check', 'tail_mount_count_capped',
                  'thread_report_count_capped', 'anchor_index'}
              if type(value) is not dict or set(value) != keys or len(keys) != 20:
                  return False
              if type(value['schema']) is not int or value['schema'] != 1:
                  return False
              if value['check'] != 'synthetic_thread_tail_after_wheel':
                  return False
              if any(type(value[key]) is not bool for key in boolean_keys):
                  return False
              if value['original_assertion_failed'] is not True:
                  return False
              if any(value[key] is not None and (type(value[key]) is not int
                      or not -8388608 <= value[key] <= 8388608) for key in pixel_keys):
                  return False
              if (type(value['tail_mount_count_capped']) is not int
                      or not 0 <= value['tail_mount_count_capped'] <= 2
                      or type(value['thread_report_count_capped']) is not int
                      or not 0 <= value['thread_report_count_capped'] <= 2048):
                  return False
              if value['anchor_index'] is not None and (type(value['anchor_index']) is not int
                      or not -1 <= value['anchor_index'] <= 399):
                  return False
              return value['tail_mount_count_capped'] != 1 or not value['latest_thread_report_is_tail']
          # Case body was bounded and default-scanned by the preceding command.
          # Diagnostic output is failure-only; it never alters the success gate.
          prefix = b'MORPHEUS_THREAD_READ_TAIL_DIAGNOSTIC '
          records = [line[len(prefix):] for line in body.splitlines() if line.startswith(prefix)]
          if codes[0] != 0 and codes[1] == 0 and len(records) == 1 and len(records[0]) <= 4096:
              try:
                  fact = json.loads(records[0], object_pairs_hook=unique_fields,
                                    parse_constant=reject_constant)
              except (ValueError, UnicodeError, RecursionError):
                  fact = None
              if valid_tail_fact(fact):
                  print(prefix.decode('ascii') + json.dumps(fact, sort_keys=True, separators=(',', ':')))
          assert codes == [0, 0] and passed == 1 and len(summaries) == 1 and not panic
          assert 'test result: FAILED.' not in text and '... FAILED' not in text
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('case_passed=true\n')
          PY_CASE
  acceptance:
    name: Focused generated UI acceptance (partial)
    if: ${{ always() && !cancelled() }}
    needs: [security, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require real ARM execution and the exact nonignored case
        env:
          SECURITY: ${{ needs.security.result }}
          NATIVE: ${{ needs.native.result }}
          CASE_PASSED: ${{ needs.native.outputs.case_passed }}
          ACTUAL_EVENT: ${{ github.event_name }}
          WORKFLOW_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import json, os
          assert os.environ['SECURITY'] == os.environ['NATIVE'] == 'success'
          assert os.environ['CASE_PASSED'] == 'true' and os.environ['ACTUAL_EVENT'] == 'workflow_dispatch'
          print(json.dumps({'actual_event': 'workflow_dispatch', 'workflow_head': os.environ['WORKFLOW_HEAD'],
              'fixed_source': 'f8efe63ad6c92c821bdff5f530fe7abbabaaf2ac',
              'fixed_tree': '5b184989a862ca01f903918bd5a425ae61e848fa',
              'platform': 'macos-15', 'route': 'exact_generated_ui', 'exact_case_passed': True,
              'partial': True, 'full_native_matrix': False, 'beta_ready': False}, sort_keys=True))
