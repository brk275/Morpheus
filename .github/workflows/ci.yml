# TEMPORARY two-stage host proof. NEVER MERGE this workflow.
name: Linux notice host proof
run-name: Linux notice host 7ec8c2a - no native build

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-notice-host-7ec8c2a
  cancel-in-progress: false
jobs:
  contracts:
    name: Unprivileged hardener contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source before execution
        shell: bash
        run: test "$(git rev-parse HEAD)" = 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
      - name: Scan history with independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Test synthetic paths and guards without touching system permissions
        shell: bash
        run: |
          timeout --kill-after=5s 120s python3 -B - <<'PY_CONTRACTS'
          import json
          import unittest
          names = ('scripts.tests.test_harden_linux_notice_host.SyntheticTreeTests', 'scripts.tests.test_harden_linux_notice_host.GuardTests', 'scripts.tests.test_harden_linux_notice_host.MainTests', 'scripts.tests.test_harden_linux_notice_host.SourceContractTests', 'scripts.tests.test_harden_linux_notice_host.WorkflowTests')
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          def case_ids(node):
              if isinstance(node, unittest.TestSuite):
                  return [name for child in node for name in case_ids(child)]
              return [node.id()]
          prefix = "scripts.tests.test_harden_linux_notice_host.SyntheticTreeTests."
          required = {
              prefix + "test_aliases_contained_in_both_trees_are_tightened_once_after_the_census",
              prefix + "test_outside_or_uncounted_aliases_fail_the_census_with_every_alias_unchanged",
              prefix + "test_one_outside_group_prevents_changes_to_every_deferred_group",
              prefix + "test_alias_churn_after_the_first_pass_fails_with_linked_files_unchanged",
              prefix + "test_alias_added_during_the_change_is_reported",
              prefix + "test_census_and_links_passes_keep_every_bound",
          }
          planned = case_ids(suite)
          if not required <= set(planned) or len(planned) != len(set(planned)):
              raise SystemExit("Required contained-link regressions are absent or duplicated")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != len(planned):
              raise SystemExit("Unprivileged hardener contracts failed or did not all run")
          print(json.dumps({"check":"linux_notice_hardener_contracts","status":"passed","tests":result.testsRun,"skipped":0}, sort_keys=True))
          PY_CONTRACTS

  system:
    name: Fresh root provisioning and actual notice inventory
    needs: contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source before execution
        shell: bash
        run: test "$(git rev-parse HEAD)" = 7ec8c2acc1e8abb1117d20f53584d58bedfd75a4
      - name: Scan history with independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Apply the reviewed immutable workflow helper on the fresh host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$GITHUB_SHA:scripts/harden_linux_notice_host.py")" = "$(git rev-parse HEAD:scripts/harden_linux_notice_host.py)"
          git show --no-ext-diff --no-textconv "$GITHUB_SHA:scripts/harden_linux_notice_host.py" |
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS /usr/bin/python3 -I -B -
      - name: Verify the real notice trees and installed-library closure as an ordinary user
        shell: bash
        run: |
          timeout --kill-after=5s 120s python3 -B - <<'PY_SYSTEM'
          import json
          import os
          import unittest
          if os.getuid() == 0:
              raise SystemExit("Installed notice observations must run unprivileged")
          names = (
              "scripts.tests.test_harden_linux_notice_host.HostedNoticeTreeTests",
              "scripts.tests.test_appimage_notices.SystemReadelfTests",
              "scripts.tests.test_appimage_notices.SystemNoticePreflightTests",
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 3:
              raise SystemExit("Real system notice proof failed, skipped, or did not all run")
          print(json.dumps({"check":"linux_notice_real_system","status":"passed","tests":3,"skipped":0}, sort_keys=True))
          PY_SYSTEM
