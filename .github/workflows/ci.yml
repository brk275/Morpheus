                  missing=set(re.findall(r'cannot find (?:value|function|type|struct) `([A-Za-z_][A-Za-z0-9_]{0,127})`',normalized))
                  record['failure_diagnostics']={
                      'ui_timeout_phases':[int(phase) for phase in re.findall(r'morpheus-ui-timeout-phase=([0-9]{1,3})', output)[:8]],
                      'transfer_focus_state':[{'page':int(page),'panel':panel=='true','tab':int(tab),'pending':pending=='true','headings':int(headings)}
                          for page,panel,tab,pending,headings in re.findall(r'MORPHEUS_TRANSFER_FOCUS_STATE page=([0-9]{1,2}) panel=(true|false) tab=([0-9]{1,2}) pending=(true|false) headings=([0-9]{1,3})',output)[:8]],
                      'ui_settings_target_failures':[{'stage':int(stage),'index':int(index),'live':live=='true'}
                          for stage,index,live in re.findall(r'MORPHEUS_SETTINGS_TARGET_FAILURE stage=([01]) index=([0-9]{1,3}) live=(true|false)',output)[:8]],
                      'failed_test_ids':[name for name in sorted(failures) if name in known_test_ids][:16],
                      'source_locations':locations,
                      'missing_public_identifiers':sorted(missing & public_identifiers)[:32],
                      'linker_failures':[{'tool':tool_family(tool),'exit_code':int(code)} for tool,code in linker_failures[:8]],
                      'path_link_family':tool_family(resolved_link) if resolved_link else 'not_resolved',
                      'locked_failed_packages':sorted(failed_packages & locked_names),
                      'markers':sorted(key for key,value in failure_markers.items() if value.lower() in folded_output),
                      'locked_build_script_crates':sorted(name+'@'+version for name,version in crates if (name,version) in locked),
                      'native_error_codes':sorted(set(re.findall(r'\b(?:LNK[0-9]{4}|C[0-9]{4})\b',normalized))),
                      'os_error_codes':sorted(set(int(code) for code in re.findall(r'os error ([0-9]{1,5})\b',output))),
                  }
              loops=len(re.findall(r'part of a binding loop',output))
              passed=passed and loops==0
              record.update({'status':'passed' if passed else 'failed','ui_binding_loop_warnings':loops})
              print(json.dumps(record,sort_keys=True),flush=True)
              all_passed=all_passed and passed
              # Failed compilation cannot yield meaningful unit checks. Independent test
              # suites still run after a test failure, using the same compiled graph.
              if not passed: break
          if not all_passed: raise SystemExit(1)
