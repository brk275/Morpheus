          helper_program = r"""import hashlib, json, pathlib, sys, unittest
          scripts = pathlib.Path('scripts').resolve(strict=True)
          # Existing reviewed Matrix acceptance helpers; source identity is checked by the owner.
          sys.path.insert(0, str(scripts.parent))
          sys.path.insert(0, str(scripts))
          sys.path.insert(0, str(scripts / 'tests'))
          names = json.loads(sys.argv[1])
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          observed = [case.id() for group in suite for case in group]
          if suite.countTestCases() != 161 or observed != names:
              raise SystemExit(1)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failed_ids = set()
          unmapped_failure = False
          for case, _private_traceback in result.failures + result.errors:
              # unittest records a failed subtest with its actual parent TestCase.
              identifier = getattr(case, 'test_case', case).id()
              if identifier in names:
                  failed_ids.add(identifier)
              else:
                  unmapped_failure = True
          ordered_failed_ids = sorted(failed_ids)
          okay = (result.wasSuccessful() and result.testsRun == 161 and not result.skipped
                  and not result.expectedFailures and not result.unexpectedSuccesses and not unmapped_failure)
          print('MORPHEUS_MATRIX_ACCEPTANCE_HELPERS ' + json.dumps({
              'tests_run': result.testsRun, 'zero_skips_xfails': not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses,
              'required_ids_sha256': hashlib.sha256(json.dumps(observed, separators=(',', ':')).encode('utf-8')).hexdigest(),
              'complete': okay, 'failed_ids': ordered_failed_ids[:8],
              'failed_ids_count': len(ordered_failed_ids), 'failed_ids_truncated': len(ordered_failed_ids) > 8,
              'unmapped_failure': unmapped_failure,
