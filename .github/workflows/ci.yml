# TEMPORARY config-contract checks only. NEVER MERGE this workflow.
name: Reviewed customization config contracts
run-name: Customization config contracts - 0993315
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: config-contracts-0993315
  cancel-in-progress: false
jobs:
  contracts:
    name: Test reviewed customization schema and diagnostics
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0993315ed812b6567e80d4ba8f5576f3bd6576c1
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 0993315ed812b6567e80d4ba8f5576f3bd6576c1
      - name: Scan source before executing reviewed native tests
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Test config schema agreement, safe diagnostics and bounded input
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import json, os, pathlib, re, select, signal, subprocess, tempfile, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          names = ('PATH','HOME','LANG','LC_ALL','TMPDIR','CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN',
              'PKG_CONFIG_PATH','LD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR','CARGO_BUILD_JOBS',
              'CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG','CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','ImageOS','RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment = {name:os.environ[name] for name in names if name in os.environ}
          root = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-config-contracts-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          logs = root/'logs'; logs.mkdir(mode=0o700)
          log = logs/'cargo.log'
          reason = None
          code = None
          with log.open('xb') as output:
              child = subprocess.Popen(['cargo','test','--locked','-p','morpheus-config','--lib','--test','appearance_example',
                  '--','--test-threads=1'],
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  env=environment, start_new_session=True)
              deadline = time.monotonic()+12*60
              size = 0
              try:
                  while True:
                      remaining = deadline-time.monotonic()
                      if remaining<=0:
                          reason='deadline'; break
                      ready,_,_=select.select([child.stdout],[],[],remaining)
                      if not ready:
                          reason='deadline'; break
                      block=os.read(child.stdout.fileno(),65536)
                      if not block: break
                      size+=len(block)
                      if size>50*1024*1024:
                          reason='output_limit'; break
                      output.write(block)
                  if reason is None:
                      code=child.wait(timeout=10)
              except (OSError,subprocess.SubprocessError):
                  reason='process_error'
              finally:
                  # Never signal an already-reaped PID/group. Timeout and
                  # overflow keep our child anchored until after group kill.
                  if child.returncode is None:
                      try: os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      child.wait(timeout=10)
                  child.stdout.close()
          with (root/'scan.log').open('wb') as output:
              scan=subprocess.run([os.environ['RUNNER_TEMP']+'/gitleaks/gitleaks','dir',str(logs),
                  '--redact=100','--ignore-gitleaks-allow','--no-banner','--max-target-megabytes','0',
                  '--config',os.environ['RUNNER_TEMP']+'/default.toml',
                  '--gitleaks-ignore-path',os.environ['RUNNER_TEMP']+'/empty.ignore'],
                  stdout=output,stderr=subprocess.STDOUT,timeout=60)
          if scan.returncode!=0:
              print('OFFLINE_NATIVE_LOG_WITHHELD',flush=True); raise SystemExit(1)
          output=log.read_text(errors='replace')
          ok=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ok$',output,re.MULTILINE))
          needed={'tests::runtime_store_errors_never_repeat_file_content',
              'tests::the_field_reference_agrees_with_the_real_schema',
              'diagnostics::tests::unknown_keys_and_account_ids_are_never_shown',
              'diagnostics::tests::account_errors_point_at_the_failing_entry_of_the_failing_account',
              'tests::shipped_semantic_roles_and_sender_text_have_readable_contrast',
              'sparse_appearance_example_uses_supported_settings'}
          summaries=re.findall(r'^test result: ok\. ([0-9]+) passed; 0 failed; ([0-9]+) ignored;',output,re.MULTILINE)
          passed=reason is None and code==0 and needed<=ok and len(summaries)==2 and sum(int(row[0]) for row in summaries)>=len(needed) and all(int(row[1])==0 for row in summaries)
          print(json.dumps({'check':'customization_config_contracts','status':'passed' if passed else 'failed',
              'source':'0993315ed812b6567e80d4ba8f5576f3bd6576c1','failure':reason,
              'tests_passed':sum(int(row[0]) for row in summaries) if len(summaries)==2 else None,
              'ignored':sum(int(row[1]) for row in summaries) if len(summaries)==2 else None,
              'required_tests':{name:name in ok for name in sorted(needed)},
              'error_codes':sorted(set(re.findall(r'error\[(E[0-9]{4})\]',output))),
              'rust_locations':sorted(set(re.findall(r'(?:crates/[A-Za-z0-9_./-]+\.rs:[0-9]+:[0-9]+)',output))),
              'failed_tests':sorted(set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$',output,re.MULTILINE))),
              'raw_logs_public':False,'real_accounts':False,'physical_devices':False,
              'native_installed_app':False},sort_keys=True),flush=True)
          if not passed: raise SystemExit(1)
          PY
      # Core configuration only. No accounts, app execution, native packaging or artifacts.
