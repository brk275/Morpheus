              fd=msvcrt.open_osfhandle(fd,os.O_WRONLY)
          args=json.loads(sys.stdin.buffer.readline(65536))
          code=subprocess.Popen(args,stdin=subprocess.DEVNULL,close_fds=True).wait()
          os.write(fd,(str(code)+'\\n').encode('ascii')); os.close(fd)
          sys.stdin.buffer.read(1)
          """
          def windows_job():
              import ctypes
              from ctypes import wintypes as w
              api=ctypes.WinDLL('kernel32',use_last_error=True)
              class Basic(ctypes.Structure):
                  _fields_=[('process_time',ctypes.c_longlong),('job_time',ctypes.c_longlong),
                      ('flags',w.DWORD),('minimum',ctypes.c_size_t),('maximum',ctypes.c_size_t),
                      ('active',w.DWORD),('affinity',ctypes.c_size_t),('priority',w.DWORD),('scheduling',w.DWORD)]
              class Limits(ctypes.Structure):
                  _fields_=[('basic',Basic),('io',ctypes.c_ulonglong*6),('process_memory',ctypes.c_size_t),
                      ('job_memory',ctypes.c_size_t),('peak_process',ctypes.c_size_t),('peak_job',ctypes.c_size_t)]
              api.CreateJobObjectW.argtypes=[ctypes.c_void_p,w.LPCWSTR]; api.CreateJobObjectW.restype=w.HANDLE
              api.SetInformationJobObject.argtypes=[w.HANDLE,ctypes.c_int,ctypes.c_void_p,w.DWORD]
              api.SetInformationJobObject.restype=w.BOOL
              api.AssignProcessToJobObject.argtypes=[w.HANDLE,w.HANDLE]; api.AssignProcessToJobObject.restype=w.BOOL
              api.TerminateJobObject.argtypes=[w.HANDLE,w.UINT]; api.TerminateJobObject.restype=w.BOOL
              api.QueryInformationJobObject.argtypes=[w.HANDLE,ctypes.c_int,ctypes.c_void_p,w.DWORD,ctypes.c_void_p]
              api.QueryInformationJobObject.restype=w.BOOL
              api.CloseHandle.argtypes=[w.HANDLE]; api.CloseHandle.restype=w.BOOL
              handle=api.CreateJobObjectW(None,None)
              if not handle: raise OSError('job_create_failed')
              limits=Limits(); limits.basic.flags=0x2000 # JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE
              if not api.SetInformationJobObject(handle,9,ctypes.byref(limits),ctypes.sizeof(limits)):
                  api.CloseHandle(handle); raise OSError('job_limits_failed')
              return api,handle

          def regular_bytes(path,limit):
              # Do not open a FIFO, follow a symlink/reparse point, or read an unbounded file.
              before=path.lstat()
              if (not stat.S_ISREG(before.st_mode) or before.st_size>limit
                  or getattr(before,'st_file_attributes',0)&0x400): raise ValueError('unsafe_regular_file')
              flags=os.O_RDONLY|getattr(os,'O_BINARY',0)|getattr(os,'O_NOFOLLOW',0)|getattr(os,'O_NONBLOCK',0)|getattr(os,'O_CLOEXEC',0)
              descriptor=os.open(path,flags)
              with os.fdopen(descriptor,'rb') as stream:
                  opened=os.fstat(stream.fileno())
                  if (not stat.S_ISREG(opened.st_mode) or (opened.st_dev,opened.st_ino)!=(before.st_dev,before.st_ino)
                      or getattr(opened,'st_file_attributes',0)&0x400): raise ValueError('changed_regular_file')
                  data=stream.read(limit+1); after=os.fstat(stream.fileno())
                  if (len(data)>limit or len(data)!=after.st_size
                      or (opened.st_size,opened.st_mtime_ns)!=(after.st_size,after.st_mtime_ns)):
                      raise ValueError('changed_regular_file')
                  return data

          def bounded(args,name,seconds,limit=64*1024*1024,cwd=None):
              directory=logs/name; directory.mkdir(mode=0o700)
              log=directory/'output.log'
              blocks=queue.Queue(maxsize=8); status=queue.Queue(maxsize=1)
              stop=threading.Event(); errors=[]; code=None; reason=None; cleaned=False; cleanup_ok=False
              read_fd,write_fd=os.pipe(); job=None; child=None; threads=[]
