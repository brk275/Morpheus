# TEMPORARY owner-selected native diagnostic. NEVER MERGE into main.
# The unchanged system PipeWire first-frame failure remains an OPEN release gate.
# Focused selection ownership checks and desktop type check only.
# Complete native, live and installed release gates remain open.
name: Timeline feed preflight - release gates open
run-name: Timeline feed preflight 554e9ce - release gates open

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Security and change scope
    # Hosted validation is disabled while private to prevent unauthorized paid builds.
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/timeline-feed-preflight-554e9ce' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: "true"
      native_matrix: '{"os":["macos-15"]}'
      config: "false"
      # Known unchanged system-library failure is outside this diagnostic.
      # Normal CI and release gates are preserved on the integration branch.
      wayland: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed validation inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR input is read as data; classification code comes from its base.
          # Push uses reviewed main; dispatch uses its owner-selected revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Never honor candidate-provided rules or suppression files. No
          # candidate code has executed on this runner before scanning.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --log-opts=--all .

  preflight:
    name: Timeline feed ownership and desktop type check
    needs: scope
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: native-554e9cee03b5d087504f9a343bc2d0e73f95d4c2-macos-15
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 554e9cee03b5d087504f9a343bc2d0e73f95d4c2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          save-if: "false"
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Test selection-owned timeline reads
        run: cargo test --locked -p morpheus-matrix --lib history::tests
      - name: Type check desktop room and thread observers
        run: cargo check --locked -p morpheus-app
