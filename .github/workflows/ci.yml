name: Native product union (temporary reviewed selection)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-product-union-c2c52323c80496b0eb81a4faeedb4245a50f0603
  cancel-in-progress: false

env:
  REVIEWED_PRODUCT_SOURCE: c2c52323c80496b0eb81a4faeedb4245a50f0603
  MORPHEUS_PACKAGE_SOURCE_REVISION: c2c52323c80496b0eb81a4faeedb4245a50f0603
  REVIEWED_PRODUCT_TREE: f7b0a342fa25284cb214c1a2a94b8c632435c74f
  REVIEWED_TRUSTED_MAIN: ea7531714b068c66a71b985ed5a1213e34e22ec9
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Security and exact product source
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id && github.ref == 'refs/heads/codex/temp-native-product-union-c2c523-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_PRODUCT_SOURCE }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed validation inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_TRUSTED_MAIN }}
          path: trusted
          persist-credentials: false
      - name: Verify exact source and validation identities before imports
        shell: python -I -B {0}
        run: |
          import os, re, subprocess
          from pathlib import Path
          source = os.environ['REVIEWED_PRODUCT_SOURCE']
          tree = os.environ['REVIEWED_PRODUCT_TREE']
          main = os.environ['REVIEWED_TRUSTED_MAIN']
          assert all(re.fullmatch('[0-9a-f]{40}', value) and value != '0'*40 for value in (source, tree, main))
          for root, selectors in ((Path('candidate'), [('HEAD^{commit}', source), ('HEAD^{tree}', tree)]),
                                  (Path('trusted'), [('HEAD^{commit}', main)])):
              for selector, expected in selectors:
                  result = subprocess.run(['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', '--verify', selector], cwd=root, capture_output=True, timeout=20)
                  assert result.returncode == 0 and result.stdout == (expected+'\n').encode() and not result.stderr
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Scanner code and exact fixture manifest come from the reviewed base.
          # The candidate's ignore files, attributes and config are not trusted.
          python3 -I ../trusted/scripts/scan_history.py \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest ../trusted/scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/morpheus-history-scan"

  native:
    name: Native product union (${{ matrix.os }}, partial)
    needs: scope
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id && github.ref == 'refs/heads/codex/temp-native-product-union-c2c523-20261105'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: native-c2c52323c80496b0eb81a4faeedb4245a50f0603-${{ matrix.os }}
      cancel-in-progress: false
    timeout-minutes: ${{ (matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-24.04') && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_PRODUCT_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before provisioning or candidate imports
        shell: python -I -B {0}
        run: |
          import os, re, subprocess
          source, tree = os.environ['REVIEWED_PRODUCT_SOURCE'], os.environ['REVIEWED_PRODUCT_TREE']
          assert all(re.fullmatch('[0-9a-f]{40}', value) and value != '0'*40 for value in (source, tree))
          for selector, expected in [('HEAD^{commit}', source), ('HEAD^{tree}', tree)]:
              result = subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', '--verify', selector], capture_output=True, timeout=20)
              assert result.returncode == 0 and result.stdout in {(expected+'\n').encode(), (expected+'\r\n').encode()} and not result.stderr
      - name: Reproduce reviewed immutable-main Linux notice host hardening
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          hardener="$RUNNER_TEMP/morpheus-product-hardener.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.py"
          /usr/bin/git show --no-ext-diff --no-textconv 0db9a18960b88421c9c0195c7e61c0139013a5f0:scripts/harden_linux_notice_host.py > "$hardener"
          echo "a87fd63c9bd26c45a0363a35b686df3935f8af9266045a4341c26dbf0a23cf66  $hardener" | /usr/bin/sha256sum --check --status
          sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS /usr/bin/python3 -I -B - < "$hardener"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          # Use only the official Ubuntu archive for this step; the hosted
          # image's Azure mirror can stall otherwise bounded provisioning.
          [[ "${ImageOS:-}" == ubuntu24 ]]
          [[ "$(dpkg --print-architecture)" == amd64 ]]
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # APT resolves the disabled sourceparts value below to /etc/apt/-.
          test ! -d /etc/apt/-
          apt_sources="$(mktemp --tmpdir="$RUNNER_TEMP" --suffix=.sources morpheus-apt-XXXXXXXXXX)"
          trap 'rm -f -- "$apt_sources"' EXIT
          cat > "$apt_sources" <<'MORPHEUS_UBUNTU_SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MORPHEUS_UBUNTU_SOURCES
          chmod 0644 "$apt_sources"
          # Keep all three invocations noninteractive and bounded; no global
          # source files or package verification settings are changed.
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=-)
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" update < /dev/null
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr < /dev/null
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Preserve compiled dependencies when a later acceptance check fails.
          # The save guard still makes untrusted/PR executions restore-only.
          # Older SDK extractions lack the verified downloader's receipt.
          # The key separates both primary and fallback cache namespaces.
          key: verified-sdk-archives-v1
          cache-on-failure: true
          save-if: ${{ github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path vendor/cpal/Cargo.toml -- --check
      - name: Prepare the pinned owned native PipeWire client
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_linux_native.py --variant native \
            --prefix "$RUNNER_TEMP/morpheus-native-pipewire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Check native interface compilation before desktop dependencies
        run: cargo check --locked -p morpheus-ui-check
      - name: Check desktop and Matrix crates
        run: cargo check --locked -p morpheus-app -p morpheus-matrix
      - name: Build desktop with native call and device adapters
        run: cargo build --locked -p morpheus-app --features native-calls
      - name: Verify the actual Linux app uses its owned native client
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, selectors, signal, stat, subprocess, sys, tempfile, time
          root = pathlib.Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(root / 'packaging/linux'))
          sys.path.insert(0, str(root / 'scripts'))
          import appimage_client as client
          from prepare_appimage_update import validate_metadata

          def interrupted(_signal, _frame):
              raise RuntimeError('native link verification interrupted')
          signal.signal(signal.SIGTERM, interrupted)
          private = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-native-link-', dir=os.environ['RUNNER_TEMP']))
          home, temporary = private / 'home', private / 'tmp'
          home.mkdir(mode=0o700)
          temporary.mkdir(mode=0o700)
          environment = {'PATH':'/usr/bin:/bin', 'HOME':str(home), 'TMPDIR':str(temporary), 'LANG':'C', 'LC_ALL':'C'}

          def bounded(label, argv, limit=4096):
              # Only fixed reviewed commands run here. Keep all output private,
              # stop the owned group before reaping its leader, and bound bytes.
              process = subprocess.Popen(argv, cwd=private, env=environment,
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  start_new_session=True)
              output = bytearray()
              deadline = time.monotonic() + 20
              selector = selectors.DefaultSelector()
              try:
                  selector.register(process.stdout, selectors.EVENT_READ)
                  while True:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0 or not selector.select(remaining):
                          raise RuntimeError('native link command deadline')
                      block = os.read(process.stdout.fileno(), min(8192, limit + 1 - len(output)))
                      if not block:
                          break
                      output.extend(block)
                      if len(output) > limit:
                          raise RuntimeError('native link command output limit')
                  # Observe completion without reaping, so group cleanup cannot
                  # race PID reuse or turn a successful early close into SIGKILL.
                  while os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOWAIT | os.WNOHANG) is None:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise RuntimeError('native link command exit deadline')
                      time.sleep(min(0.01, remaining))
              finally:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=5)
                  selector.close()
                  process.stdout.close()
                  descriptor = os.open(private / (label + '.log'), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(descriptor, 'wb') as target:
                      target.write(output)
              return process.returncode, bytes(output)

          try:
              client.require_build_platform()
              assert os.environ.get('GITHUB_ACTIONS') == 'true'
              assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
              assert os.environ.get('MORPHEUS_PIPEWIRE_CLIENT_VARIANT') == 'native'
              receipt = pathlib.Path(os.environ['MORPHEUS_PIPEWIRE_CLIENT_RECEIPT'])
              stage = client.private_directory(receipt.parent)
              assert receipt.name == 'build-client.txt'
              assert stage.is_relative_to(pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True))
              library = stage / client.R.NATIVE_SONAME
              hidden = stage / '.native-link-absence-check'
              assert not hidden.exists() and not hidden.is_symlink()
              identity = library.lstat()
              assert stat.S_ISREG(identity.st_mode) and identity.st_uid == os.getuid()
              assert identity.st_nlink == 1 and not identity.st_mode & 0o022
              content = client.read_regular(library, client.R.MAX_LIBRARY)
              client.R.elf_identity(content, library=True, expected_soname=client.R.NATIVE_SONAME)
              original_hash = hashlib.sha256(content).hexdigest()
              binary = root / 'target/debug/morpheus-app'
              details = binary.lstat()
              assert stat.S_ISREG(details.st_mode) and not binary.is_symlink()
              assert details.st_uid == os.getuid() and details.st_mode & 0o111
              code, dynamic = bounded('readelf', [client.R.trusted_tool('readelf'), '--dynamic', str(binary)], 65536)
              assert code == 0
              needed = re.findall(rb'\(NEEDED\).*?\[([^\]\n]+)\]', dynamic)
              assert needed.count(client.R.NATIVE_SONAME.encode()) == 1
              assert client.SONAME.encode() not in needed and b'\x00' not in dynamic
              paths = re.findall(rb'\((RPATH|RUNPATH)\).*?\[([^\]\n]*)\]', dynamic)
              assert paths == [(b'RUNPATH', str(stage).encode())]
              command = [str(binary), '--morpheus-update-metadata']
              code, first = bounded('metadata-before', command)
              assert code == 0
              metadata = json.loads(first)
              validate_metadata(metadata)
              try:
                  os.rename(library, hidden)
                  code, refusal = bounded('metadata-missing-client', command)
                  expected = (str(binary).encode() + b': error while loading shared libraries: '
                      + client.R.NATIVE_SONAME.encode()
                      + b': cannot open shared object file: No such file or directory\n')
                  assert code == 127 and refusal == expected
              finally:
                  if hidden.exists() or hidden.is_symlink():
                      moved = hidden.lstat()
                      assert (moved.st_dev, moved.st_ino, moved.st_mode) == (identity.st_dev, identity.st_ino, identity.st_mode)
                      assert hashlib.sha256(client.read_regular(hidden, client.R.MAX_LIBRARY)).hexdigest() == original_hash
                      assert not library.exists() and not library.is_symlink()
                      os.rename(hidden, library)
              code, restored = bounded('metadata-restored', command)
              assert code == 0 and json.loads(restored) == metadata
              assert not list(home.iterdir()) and not list(temporary.iterdir())
              print('Native app client linkage: ' + json.dumps({'distinct_needed':True,
                  'current_runpath':True, 'missing_client_refused':True, 'same_library_restored':True,
                  'metadata_only_no_profile':True}, sort_keys=True))
          except Exception:
              print('Native app client linkage failed; bounded output remains private on the ephemeral runner.')
              raise SystemExit(1) from None
      - name: Test desktop controller and call guards
        id: desktop-tests
        # ElementHandle queries need compiler-generated element metadata even
        # when Rust debug symbols are disabled for the hosted test build.
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        # The independently built app can still exercise disposable fixtures
        # after a unit assertion fails. Keep that evidence and reject the
        # candidate at the final gate instead of rebuilding just to reach it.
        continue-on-error: true
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app
      - name: Test native device and call guards
        continue-on-error: true
        id: device-tests
        run: cargo test --locked -p morpheus-rtc --features native-devices --lib
      - name: Test affected RTC call SDK and identity guards
        id: rtc-sdk-tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # livekit/auth.rs is feature-gated; default SDK features would omit it.
          cargo test --locked -p matrix-rtc-call-sdk --features matrix-sdk --lib
      - name: Test affected LiveKit credential and sender guards
        id: rtc-livekit-tests
        continue-on-error: true
        run: cargo test --locked -p matrix-rtc-livekit --lib
      - name: Test affected RTC core encryption and key rotation
        id: rtc-core-tests
        continue-on-error: true
        run: cargo test --locked -p matrix-rtc-core --features testing --lib --test key_rotation
      - name: Test affected RTC transport generations and pool
        id: rtc-transport-tests
        continue-on-error: true
        run: cargo test --locked -p matrix-rtc-transport --lib
      - name: Check changed video example types without running it
        id: rtc-example-check
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo check --locked -p matrix-rtc-call-sdk --features matrix-sdk --example publish_video
      - name: Test retained RTC event delivery
        id: rtc-retained-tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rtc_retained_event_tests=(
            held_events::tests::buffered_events_reach_one_first_subscriber_and_later_subscribers_start_fresh
            held_events::tests::retained_receiver_preserves_original_lag_instead_of_resubscribing
            held_events::tests::separate_calls_keep_their_own_receiver_and_drop_unclaimed_history
          )
          cargo test --locked -p morpheus-app --features native-calls --test rtc_retained_events -- --list > "$RUNNER_TEMP/morpheus-rtc-retained-event-tests.txt"
          for rtc_retained_event_test in "${rtc_retained_event_tests[@]}"; do
            test "$(grep -Fxc -- "$rtc_retained_event_test: test" "$RUNNER_TEMP/morpheus-rtc-retained-event-tests.txt")" = 1
            cargo test --locked -p morpheus-app --features native-calls --test rtc_retained_events "$rtc_retained_event_test" -- --exact | tee "$RUNNER_TEMP/morpheus-rtc-retained-event-result.txt"
            test "$(grep -Fxc -- "test $rtc_retained_event_test ... ok" "$RUNNER_TEMP/morpheus-rtc-retained-event-result.txt")" = 1
            test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$' "$RUNNER_TEMP/morpheus-rtc-retained-event-result.txt")" = 1
          done
      - name: Require every selected product check
        if: ${{ !cancelled() }}
        env:
          RUNNER_PLATFORM: ${{ runner.os }}
          APP_OUTCOME: ${{ steps.desktop-tests.outcome }}
          RTC_OUTCOME: ${{ steps.device-tests.outcome }}
          SDK_OUTCOME: ${{ steps.rtc-sdk-tests.outcome }}
          LIVEKIT_OUTCOME: ${{ steps.rtc-livekit-tests.outcome }}
          CORE_OUTCOME: ${{ steps.rtc-core-tests.outcome }}
          TRANSPORT_OUTCOME: ${{ steps.rtc-transport-tests.outcome }}
          RETAINED_OUTCOME: ${{ steps.rtc-retained-tests.outcome }}
          EXAMPLE_OUTCOME: ${{ steps.rtc-example-check.outcome }}
        shell: python -I -B {0}
        run: |
          import os
          assert os.environ['RUNNER_PLATFORM'] in ('Linux', 'Windows', 'macOS')
          required = ('APP_OUTCOME', 'RTC_OUTCOME', 'SDK_OUTCOME', 'LIVEKIT_OUTCOME',
                      'CORE_OUTCOME', 'TRANSPORT_OUTCOME', 'RETAINED_OUTCOME')
          assert all(os.environ.get(name) == 'success' for name in required), 'A selected product check failed or did not run.'
          assert os.environ.get('EXAMPLE_OUTCOME') == ('success' if os.environ['RUNNER_PLATFORM'] == 'Linux' else 'skipped')

  acceptance:
    name: Product union acceptance (partial)
    needs: [scope, native]
    if: ${{ always() && !cancelled() && github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id && github.ref == 'refs/heads/codex/temp-native-product-union-c2c523-20261105' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require source security and every native platform
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        shell: python -I -B {0}
        run: |
          import os
          assert os.environ.get('SCOPE_RESULT') == 'success'
          assert os.environ.get('NATIVE_RESULT') == 'success'
