# TEMPORARY registered ci.yml override. NEVER MERGE.
# HELD for independent/root review and a fresh ARM-slot preflight; no push trigger.
name: Focused generated UI convergence
run-name: Exact generated UI regression - ARM - thread tail convergence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-26830562b4319455ed651b47447cf5df8728a0bb-macos-15
  cancel-in-progress: false
jobs:
  security:
    name: Reviewed source and history
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/temp-arm-thread-tail-ui-v2-20261108' && github.repository == 'brk275/Morpheus' && github.repository_owner == 'brk275' && github.event.repository.private == false && github.actor == 'brk275' && github.triggering_actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 26830562b4319455ed651b47447cf5df8728a0bb
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check out fixed reviewed scanner inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 049b344a28920ad2778ebfd4bcf94594345b7abd
          persist-credentials: false
          path: validation
      - name: Require exact one-test source and workflow-only child
        shell: /usr/bin/python3 -I -B {0}
        env:
          WORKFLOW_HEAD: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          import hashlib, json, os, pathlib, re, subprocess
          SOURCE = '26830562b4319455ed651b47447cf5df8728a0bb'
          TREE = '4c4e974a2930f807a2c2332af4e29837503a932e'
          BASE = '049b344a28920ad2778ebfd4bcf94594345b7abd'
          PATH = 'crates/morpheus-app/src/account_access_ui_tests.rs'
          root = pathlib.Path.cwd().resolve(strict=True)
          command = ['git', '--no-pager', '--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false']
          def git(*args, cwd=root):
              body = subprocess.run(command + list(args), cwd=cwd, check=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.DEVNULL, timeout=20).stdout
              assert len(body) <= 2 * 1024 * 1024
              return body
          head = os.environ['WORKFLOW_HEAD']
          assert re.fullmatch('[a-f0-9]{40}', head) and head == os.environ['GITHUB_SHA'] and head != SOURCE
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/temp-arm-thread-tail-ui-v2-20261108'
          assert os.environ['WORKFLOW_REF'] == 'brk275/Morpheus/.github/workflows/ci.yml@refs/heads/codex/temp-arm-thread-tail-ui-v2-20261108'
          assert git('rev-parse', 'HEAD').decode().strip() == SOURCE
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == TREE
          assert git('rev-list', '--parents', '-n', '1', SOURCE).decode().split() == [SOURCE, BASE]
          assert git('rev-list', '--parents', '-n', '1', head).decode().split() == [head, SOURCE]
          def leaves(revision):
              result = {}
              for entry in git('ls-tree', '--full-tree', '-r', '-z', revision).split(b'\0'):
                  if not entry:
                      continue
                  fields, name = entry.split(b'\t', 1)
                  result[name.decode()] = fields.decode()
              return result
          before, source, workflow = leaves(BASE), leaves(SOURCE), leaves(head)
          assert len(before) == len(source) == len(workflow) == 2459
          assert {name for name in source if source[name] != before[name]} == {PATH}
          assert source[PATH] == '100644 blob 3450b0902bc9413f7fd26731c3587434bb9a8ef6'
          assert {name for name in workflow if workflow[name] != source[name]} == {'.github/workflows/ci.yml'}
          assert workflow['.github/workflows/ci.yml'].startswith('100644 blob ')
          assert hashlib.sha256((root / PATH).read_bytes()).hexdigest() == '326c6bb0a6cd96cbf622b649bbef85e4db2ccece37f6e699021ec959f0793752'
          validation = root.parent / 'validation'
          assert git('rev-parse', 'HEAD', cwd=validation).decode().strip() == BASE
          print(json.dumps({'fixed_source': SOURCE, 'fixed_tree': TREE, 'workflow_head': head,
                            'one_regular_test_leaf_only': True, 'only_TEMP_workflow_child': True}, sort_keys=True))
      - name: Scan reviewed source history
        shell: bash
        env:
          SCANNER_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          python3 -I -B - <<'PY_SCANNER'
          API_URL = 'https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058'
          EXPECTED_BYTES = 8230402
          EXPECTED_SHA256 = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          ARCHIVE_NAME = 'gitleaks.tar.gz'
          import hashlib, os, pathlib, re, signal, ssl, sys, time, urllib.error, urllib.parse, urllib.request
          class ClosedFailure(Exception):
              pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def fail(reason):
              raise ClosedFailure(reason)
          def deadline(signum, frame):
              fail('deadline')
          signal.signal(signal.SIGALRM, deadline)
          signal.setitimer(signal.ITIMER_REAL, 120)
          started = time.monotonic()
          status = None
          try:
              token = os.environ.pop('SCANNER_API_TOKEN')
              if not 1 <= len(token) <= 1024 or not token.isascii() or any(c in token for c in '\r\n\0'):
                  fail('token-shape')
              run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch('[0-9]{1,20}', run) or not re.fullmatch('[0-9]{1,6}', attempt):
                  fail('run-shape')
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
                                                  urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              def open_request(request):
                  global status
                  try:
                      response = opener.open(request, timeout=min(30, max(0.1, 120 - (time.monotonic() - started))))
                  except urllib.error.HTTPError as response:
                      status = response.code
                      if response.code != 302:
                          response.close()
                          fail('http-status')
                      return response
                  status = response.status
                  return response
              request = urllib.request.Request(API_URL + '?nonce=' + run + '-' + attempt,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream',
                           'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control': 'no-cache',
                           'User-Agent': 'Morpheus-pinned-scanner'})
              response = open_request(request)
              del token, request
              if response.status == 302:
                  locations = response.headers.get_all('Location', [])
                  response.close()
                  if len(locations) != 1 or len(locations[0]) > 16384 or any(c in locations[0] for c in '\r\n\0'):
                      fail('redirect-shape')
                  parsed = urllib.parse.urlsplit(locations[0])
                  if (parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com'
                          or parsed.username is not None or parsed.password is not None
                          or parsed.port not in (None, 443) or not parsed.path.startswith('/') or parsed.fragment):
                      fail('redirect-target')
                  # A NEW request intentionally contains no Authorization or API headers.
                  response = open_request(urllib.request.Request(locations[0],
                      headers={'Accept': 'application/octet-stream', 'User-Agent': 'Morpheus-pinned-scanner'}))
              if response.status != 200:
                  response.close()
                  fail('http-status')
              lengths = response.headers.get_all('Content-Length', [])
              if lengths and (len(lengths) != 1 or lengths[0] != str(EXPECTED_BYTES)):
                  response.close()
                  fail('length-header')
              encodings = response.headers.get_all('Content-Encoding', [])
              if encodings and encodings != ['identity']:
                  response.close()
                  fail('content-encoding')
              root = pathlib.Path(os.environ['RUNNER_TEMP'])
              destination = root / ARCHIVE_NAME
              digest, count = hashlib.sha256(), 0
              with response, destination.open('xb') as output:
                  while True:
                      chunk = response.read(min(65536, EXPECTED_BYTES + 1 - count))
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > EXPECTED_BYTES:
                          fail('body-size')
                      digest.update(chunk)
                      output.write(chunk)
              if count != EXPECTED_BYTES or digest.hexdigest() != EXPECTED_SHA256:
                  fail('archive-integrity')
              print('PINNED_SCANNER_ARCHIVE_VERIFIED exact_size=true exact_sha256=true')
          except BaseException as error:
              reason = str(error) if type(error) is ClosedFailure else 'transport-failure'
              print('PINNED_SCANNER_DOWNLOAD_FAILED reason=' + reason + ' status=' +
                    (str(status) if type(status) is int and 100 <= status <= 599 else 'none'), file=sys.stderr)
              sys.exit(1)
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          PY_SCANNER
          unset SCANNER_API_TOKEN
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "dcd5d9a2dfafaf50adb63f294eba982778b67dade562def4e0e32bf38941285c  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "f4fb315687debe13e9e44dd4321196406592637b199f7d129a35b62586b052c3  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" --candidate "$PWD" \
            --scanner "$RUNNER_TEMP/gitleaks/gitleaks" --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/focused-ui-source-scan"
  native:
    name: Exact generated UI (macos-15, partial)
    needs: security
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: candidate
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SLINT_EMIT_DEBUG_INFO: "1"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
    outputs:
      case_passed: ${{ steps.exact.outputs.case_passed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 26830562b4319455ed651b47447cf5df8728a0bb
          persist-credentials: false
          path: candidate
      - name: Require exact source and Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$RUNNER_OS" = macOS
          test "$(git rev-parse HEAD)" = 26830562b4319455ed651b47447cf5df8728a0bb
          test "$(git rev-parse 'HEAD^{tree}')" = 4c4e974a2930f807a2c2332af4e29837503a932e
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
          workspaces: candidate
      - name: Install the existing independently pinned ARM default scanner
        shell: bash
        env:
          SCANNER_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/gitleaks-arm.tar.gz"
          python3 -I -B - <<'PY_SCANNER'
          API_URL = 'https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332059'
          EXPECTED_BYTES = 7897593
          EXPECTED_SHA256 = 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'
          ARCHIVE_NAME = 'gitleaks-arm.tar.gz'
          import hashlib, os, pathlib, re, signal, ssl, sys, time, urllib.error, urllib.parse, urllib.request
          class ClosedFailure(Exception):
              pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def fail(reason):
              raise ClosedFailure(reason)
          def deadline(signum, frame):
              fail('deadline')
          signal.signal(signal.SIGALRM, deadline)
          signal.setitimer(signal.ITIMER_REAL, 120)
          started = time.monotonic()
          status = None
          try:
              token = os.environ.pop('SCANNER_API_TOKEN')
              if not 1 <= len(token) <= 1024 or not token.isascii() or any(c in token for c in '\r\n\0'):
                  fail('token-shape')
              run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch('[0-9]{1,20}', run) or not re.fullmatch('[0-9]{1,6}', attempt):
                  fail('run-shape')
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
                                                  urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              def open_request(request):
                  global status
                  try:
                      response = opener.open(request, timeout=min(30, max(0.1, 120 - (time.monotonic() - started))))
                  except urllib.error.HTTPError as response:
                      status = response.code
                      if response.code != 302:
                          response.close()
                          fail('http-status')
                      return response
                  status = response.status
                  return response
              request = urllib.request.Request(API_URL + '?nonce=' + run + '-' + attempt,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream',
                           'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control': 'no-cache',
                           'User-Agent': 'Morpheus-pinned-scanner'})
              response = open_request(request)
              del token, request
              if response.status == 302:
                  locations = response.headers.get_all('Location', [])
                  response.close()
                  if len(locations) != 1 or len(locations[0]) > 16384 or any(c in locations[0] for c in '\r\n\0'):
                      fail('redirect-shape')
                  parsed = urllib.parse.urlsplit(locations[0])
                  if (parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com'
                          or parsed.username is not None or parsed.password is not None
                          or parsed.port not in (None, 443) or not parsed.path.startswith('/') or parsed.fragment):
                      fail('redirect-target')
                  # A NEW request intentionally contains no Authorization or API headers.
                  response = open_request(urllib.request.Request(locations[0],
                      headers={'Accept': 'application/octet-stream', 'User-Agent': 'Morpheus-pinned-scanner'}))
              if response.status != 200:
                  response.close()
                  fail('http-status')
              lengths = response.headers.get_all('Content-Length', [])
              if lengths and (len(lengths) != 1 or lengths[0] != str(EXPECTED_BYTES)):
                  response.close()
                  fail('length-header')
              encodings = response.headers.get_all('Content-Encoding', [])
              if encodings and encodings != ['identity']:
                  response.close()
                  fail('content-encoding')
              root = pathlib.Path(os.environ['RUNNER_TEMP'])
              destination = root / ARCHIVE_NAME
              digest, count = hashlib.sha256(), 0
              with response, destination.open('xb') as output:
                  while True:
                      chunk = response.read(min(65536, EXPECTED_BYTES + 1 - count))
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > EXPECTED_BYTES:
                          fail('body-size')
                      digest.update(chunk)
                      output.write(chunk)
              if count != EXPECTED_BYTES or digest.hexdigest() != EXPECTED_SHA256:
                  fail('archive-integrity')
              print('PINNED_SCANNER_ARCHIVE_VERIFIED exact_size=true exact_sha256=true')
          except BaseException as error:
              reason = str(error) if type(error) is ClosedFailure else 'transport-failure'
              print('PINNED_SCANNER_DOWNLOAD_FAILED reason=' + reason + ' status=' +
                    (str(status) if type(status) is int and 100 <= status <= 599 else 'none'), file=sys.stderr)
              sys.exit(1)
          finally:
              signal.setitimer(signal.ITIMER_REAL, 0)
          PY_SCANNER
          unset SCANNER_API_TOKEN
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  $archive" | shasum -a 256 --check --status
          mkdir "$RUNNER_TEMP/focused-ui-scanner" "$RUNNER_TEMP/focused-ui-logs"
          tar -xzf "$archive" -C "$RUNNER_TEMP/focused-ui-scanner" gitleaks
          echo "ba52fb1bfabbcde42f032afad3d6e0b19dff8ed105229a16e7caa338bbc0e84f  $RUNNER_TEMP/focused-ui-scanner/gitleaks" | shasum -a 256 --check --status
          chmod 700 "$RUNNER_TEMP/focused-ui-scanner/gitleaks"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/focused-ui-default.toml"
          : > "$RUNNER_TEMP/focused-ui-empty.ignore"
      - name: Compile the actual app test target before the selected case
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app --no-run 2>&1 | head -c 16777217 > "$RUNNER_TEMP/focused-ui-logs/compile.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s %s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/focused-ui-compile-status"
          "$RUNNER_TEMP/focused-ui-scanner/gitleaks" dir "$RUNNER_TEMP/focused-ui-logs" \
            --config "$RUNNER_TEMP/focused-ui-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/focused-ui-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --max-target-megabytes 0 --no-banner
          python3 -I -B - <<'PY_COMPILE'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          body = (root / 'focused-ui-logs/compile.log').read_bytes()
          assert len(body) <= 16 * 1024 * 1024
          codes = [int(value) for value in (root / 'focused-ui-compile-status').read_text().split()]
          assert len(codes) == 2
          code = codes[0]
          if code:
              errors = sorted(set(re.findall(rb'error\[(E[0-9]{4})\]', body)))
              print('FOCUSED_UI_COMPILER_FAILED codes=' + ','.join(item.decode() for item in errors))
          assert codes == [0, 0]
          print('FOCUSED_UI_COMPILED exact_source=true native_calls=true slint_debug_info=true')
          PY_COMPILE
      - name: Run exactly the existing generated UI regression
        id: exact
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case_name='account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'
          set +e
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app "$case_name" -- --list --exact 2>&1 | head -c 16777217 > "$RUNNER_TEMP/focused-ui-logs/list.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s %s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/focused-ui-list-status"
          "$RUNNER_TEMP/focused-ui-scanner/gitleaks" dir "$RUNNER_TEMP/focused-ui-logs" \
            --config "$RUNNER_TEMP/focused-ui-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/focused-ui-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --max-target-megabytes 0 --no-banner
          python3 -I -B - <<'PY_LIST'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          body = (root / 'focused-ui-logs/list.log').read_bytes()
          assert len(body) <= 16 * 1024 * 1024
          assert (root / 'focused-ui-list-status').read_text().split() == ['0', '0']
          expected = b'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation: test'
          assert body.splitlines().count(expected) == 1
          print('FOCUSED_UI_LISTED exact_count=1')
          PY_LIST
          set +e
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app "$case_name" -- --exact --test-threads=1 2>&1 | head -c 16777217 > "$RUNNER_TEMP/focused-ui-logs/case.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s %s\n' "${statuses[0]}" "${statuses[1]}" > "$RUNNER_TEMP/focused-ui-case-status"
          "$RUNNER_TEMP/focused-ui-scanner/gitleaks" dir "$RUNNER_TEMP/focused-ui-logs" \
            --config "$RUNNER_TEMP/focused-ui-default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/focused-ui-empty.ignore" \
            --ignore-gitleaks-allow --redact=100 --max-target-megabytes 0 --no-banner
          python3 -I -B - <<'PY_CASE'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          body = (root / 'focused-ui-logs/case.log').read_bytes()
          assert len(body) <= 16 * 1024 * 1024
          text = body.decode(errors='replace')
          case = 'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'
          codes = [int(value) for value in (root / 'focused-ui-case-status').read_text().split()]
          assert len(codes) == 2
          code = codes[0]
          passed = len(re.findall(r'^test ' + re.escape(case) + r' \.\.\. ok$', text, re.MULTILINE))
          summaries = re.findall(r'^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; ([0-9]+) filtered out; finished in [^\r\n]+$', text, re.MULTILINE)
          panic = sorted(set(re.findall(r'panicked at (crates/[A-Za-z0-9_./-]+\.rs:[0-9]+:[0-9]+)', text)))[:16]
          print(json.dumps({'fixed_source': '26830562b4319455ed651b47447cf5df8728a0bb',
              'platform': 'macos-15', 'exact_test': case, 'exit_status': code,
              'exact_success_count': passed, 'nonignored_one_pass_summary_count': len(summaries), 'case_log_sha256': hashlib.sha256(body).hexdigest(),
              'panic_locations': panic, 'partial': True}, sort_keys=True))
          assert codes == [0, 0] and passed == 1 and len(summaries) == 1 and not panic
          assert 'test result: FAILED.' not in text and '... FAILED' not in text
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('case_passed=true\n')
          PY_CASE
  acceptance:
    name: Focused generated UI acceptance (partial)
    if: ${{ always() && !cancelled() }}
    needs: [security, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require real ARM execution and the exact nonignored case
        env:
          SECURITY: ${{ needs.security.result }}
          NATIVE: ${{ needs.native.result }}
          CASE_PASSED: ${{ needs.native.outputs.case_passed }}
          ACTUAL_EVENT: ${{ github.event_name }}
          WORKFLOW_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import json, os
          assert os.environ['SECURITY'] == os.environ['NATIVE'] == 'success'
