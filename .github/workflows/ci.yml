# TEMPORARY focused stock Element acceptance only. NEVER MERGE this workflow.
# No full/beta acceptance, broad native suites, packages, installed UI, physical devices or artifacts.
name: Owner exacte868 stock Element reverse audio
run-name: Exacte868 focused stock Element reverse audio
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select only affected native platforms
        type: choice
        required: true
        default: linux
        options: [linux]
      checks:
        description: Only three changed helper methods and one existing stock Element lifecycle
        type: choice
        required: true
        default: element-fixture-linux
        options: [element-fixture-linux]
permissions:
  contents: read
concurrency:
  group: beta-element-fixture-e86857c-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    name: Reviewed candidate history
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: e86857c6517980b5f8e421f2464d8954e898c4a8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f9efc8ea119468dd4e464dc65959d1ae5ce8192f
          path: trusted
          persist-credentials: false
      - name: Scan reviewed source with fixed independent rules and fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = e86857c6517980b5f8e421f2464d8954e898c4a8
          archive="$RUNNER_TEMP/gitleaks-linux.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-filesize 33554432 --max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/history-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/history-scanner" gitleaks
          python3 -I trusted/scripts/scan_history.py --candidate candidate \
            --scanner "$RUNNER_TEMP/history-scanner/gitleaks" \
            --manifest trusted/scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/reviewed-candidate-history"
  native:
    needs: security
    name: Native ${{ matrix.name }}
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && inputs.platform == 'linux' && inputs.checks == 'element-fixture-linux'
    strategy:
      fail-fast: false
      matrix: {include: [{name: 'Linux x64', runner: ubuntu-24.04, os: Linux, arch: X64}]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MORPHEUS_EXPECTED_OS: ${{ matrix.os }}
      MORPHEUS_EXPECTED_ARCH: ${{ matrix.arch }}
      MORPHEUS_CHECK_SCOPE: ${{ inputs.checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: e86857c6517980b5f8e421f2464d8954e898c4a8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and prepare independent private-log scanner
        timeout-minutes: 10
        shell: python -I {0}
        run: |
          import hashlib, json, os, pathlib, queue, re, signal, subprocess, tempfile, threading, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert (os.environ.get('RUNNER_OS'),os.environ.get('RUNNER_ARCH')) == (
              os.environ['MORPHEUS_EXPECTED_OS'],os.environ['MORPHEUS_EXPECTED_ARCH'])
          os.umask(0o077)
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()/'candidate'
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/'morpheus-native-private'
          private.mkdir(mode=0o700,exist_ok=True)
          logs=private/'logs'; logs.mkdir(mode=0o700,exist_ok=True)
          # Only compilation/runtime essentials. No GITHUB_TOKEN, ACTIONS tokens, inherited
          # credentials, personal accounts, signing identities, or release environment.
          names=('PATH','HOME','USERPROFILE','HOMEDRIVE','HOMEPATH','SYSTEMROOT','SystemRoot',
              'WINDIR','COMSPEC','PATHEXT','TEMP','TMP','TMPDIR','LANG','LC_ALL',
              'ProgramFiles','ProgramFiles(x86)','ProgramW6432','ALLUSERSPROFILE',
              'LOCALAPPDATA','APPDATA','VCToolsInstallDir','VCINSTALLDIR','VSINSTALLDIR',
              'WindowsSdkDir','WindowsSDKVersion','INCLUDE','LIB','LIBPATH','LIBCLANG_PATH',
              'CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN','PKG_CONFIG_PATH',
              'LD_LIBRARY_PATH','DYLD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR',
              'SDKROOT','DEVELOPER_DIR','MACOSX_DEPLOYMENT_TARGET',
              'CARGO_BUILD_JOBS','CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG',
              'CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR','SLINT_EMIT_DEBUG_INFO',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH','ImageOS',
              'RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment={name:os.environ[name] for name in names if name in os.environ}
          environment['GIT_CONFIG_GLOBAL']=os.devnull
          environment['GIT_CONFIG_NOSYSTEM']='1'
          environment['GIT_TERMINAL_PROMPT']='0'
          environment['RUST_LOG']='off'
          import stat, sys
          # The supervisor owns the process group until cleanup, including successful exit.
          # A private pipe carries only the direct command's numeric exit status; descendants
          # never inherit it. Windows starts the command only after Job assignment.
          SUPERVISOR = """import json, os, subprocess, sys
          fd=int(sys.argv[1])
          if os.name=='nt':
              import msvcrt
              fd=msvcrt.open_osfhandle(fd,os.O_WRONLY)
          args=json.loads(sys.stdin.buffer.readline(65536))
          code=subprocess.Popen(args,stdin=subprocess.DEVNULL,close_fds=True).wait()
          os.write(fd,(str(code)+'\\n').encode('ascii')); os.close(fd)
          sys.stdin.buffer.read(1)
          """
          def windows_job():
              import ctypes
              from ctypes import wintypes as w
              api=ctypes.WinDLL('kernel32',use_last_error=True)
              class Basic(ctypes.Structure):
                  _fields_=[('process_time',ctypes.c_longlong),('job_time',ctypes.c_longlong),
                      ('flags',w.DWORD),('minimum',ctypes.c_size_t),('maximum',ctypes.c_size_t),
                      ('active',w.DWORD),('affinity',ctypes.c_size_t),('priority',w.DWORD),('scheduling',w.DWORD)]
              class Limits(ctypes.Structure):
                  _fields_=[('basic',Basic),('io',ctypes.c_ulonglong*6),('process_memory',ctypes.c_size_t),
                      ('job_memory',ctypes.c_size_t),('peak_process',ctypes.c_size_t),('peak_job',ctypes.c_size_t)]
              api.CreateJobObjectW.argtypes=[ctypes.c_void_p,w.LPCWSTR]; api.CreateJobObjectW.restype=w.HANDLE
              api.SetInformationJobObject.argtypes=[w.HANDLE,ctypes.c_int,ctypes.c_void_p,w.DWORD]
              api.SetInformationJobObject.restype=w.BOOL
              api.AssignProcessToJobObject.argtypes=[w.HANDLE,w.HANDLE]; api.AssignProcessToJobObject.restype=w.BOOL
              api.TerminateJobObject.argtypes=[w.HANDLE,w.UINT]; api.TerminateJobObject.restype=w.BOOL
              api.QueryInformationJobObject.argtypes=[w.HANDLE,ctypes.c_int,ctypes.c_void_p,w.DWORD,ctypes.c_void_p]
              api.QueryInformationJobObject.restype=w.BOOL
              api.CloseHandle.argtypes=[w.HANDLE]; api.CloseHandle.restype=w.BOOL
              handle=api.CreateJobObjectW(None,None)
              if not handle: raise OSError('job_create_failed')
              limits=Limits(); limits.basic.flags=0x2000 # JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE
              if not api.SetInformationJobObject(handle,9,ctypes.byref(limits),ctypes.sizeof(limits)):
                  api.CloseHandle(handle); raise OSError('job_limits_failed')
              return api,handle

          def regular_bytes(path,limit):
              # Do not open a FIFO, follow a symlink/reparse point, or read an unbounded file.
              before=path.lstat()
              if (not stat.S_ISREG(before.st_mode) or before.st_size>limit
                  or getattr(before,'st_file_attributes',0)&0x400): raise ValueError('unsafe_regular_file')
              flags=os.O_RDONLY|getattr(os,'O_BINARY',0)|getattr(os,'O_NOFOLLOW',0)|getattr(os,'O_NONBLOCK',0)|getattr(os,'O_CLOEXEC',0)
              descriptor=os.open(path,flags)
              with os.fdopen(descriptor,'rb') as stream:
                  opened=os.fstat(stream.fileno())
                  if (not stat.S_ISREG(opened.st_mode) or (opened.st_dev,opened.st_ino)!=(before.st_dev,before.st_ino)
                      or getattr(opened,'st_file_attributes',0)&0x400): raise ValueError('changed_regular_file')
                  data=stream.read(limit+1); after=os.fstat(stream.fileno())
                  if (len(data)>limit or len(data)!=after.st_size
                      or (opened.st_size,opened.st_mtime_ns)!=(after.st_size,after.st_mtime_ns)):
                      raise ValueError('changed_regular_file')
                  return data

          def bounded(args,name,seconds,limit=64*1024*1024,cwd=None):
              directory=logs/name; directory.mkdir(mode=0o700)
              log=directory/'output.log'
              blocks=queue.Queue(maxsize=8); status=queue.Queue(maxsize=1)
              stop=threading.Event(); errors=[]; code=None; reason=None; cleaned=False; cleanup_ok=False
              read_fd,write_fd=os.pipe(); job=None; child=None; threads=[]
              kwargs={'start_new_session':True,'pass_fds':(write_fd,)}
              status_arg=write_fd
              if os.name=='nt':
                  import msvcrt
                  job=windows_job(); status_arg=msvcrt.get_osfhandle(write_fd)
                  os.set_handle_inheritable(status_arg,True)
                  startup=subprocess.STARTUPINFO(); startup.lpAttributeList={'handle_list':[status_arg]}
                  kwargs={'startupinfo':startup,'close_fds':True}
              def cleanup():
                  nonlocal cleaned,cleanup_ok
                  if cleaned: return
                  cleaned=True
                  if job:
                      import ctypes
                      class Accounting(ctypes.Structure):
                          _fields_=[('times',ctypes.c_longlong*4),('faults',ctypes.c_uint32),
                              ('total',ctypes.c_uint32),('active',ctypes.c_uint32),('terminated',ctypes.c_uint32)]
                      try:
                          if not job[0].TerminateJobObject(job[1],1): raise OSError('job_terminate_failed')
                          until=time.monotonic()+10
                          while True:
                              accounting=Accounting()
                              if not job[0].QueryInformationJobObject(job[1],1,ctypes.byref(accounting),ctypes.sizeof(accounting),None):
                                  raise OSError('job_query_failed')
                              if accounting.active==0: break
                              if time.monotonic()>=until: raise OSError('job_cleanup_deadline')
                              time.sleep(0.05)
                      finally:
                          if not job[0].CloseHandle(job[1]): raise OSError('job_close_failed')
                  elif child is not None:
                      # No poll()/wait() before this signal: the supervisor still reserves
                      # its group identity even if it exited unexpectedly.
                      try: os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                  cleanup_ok=True
              try:
                  with log.open('x+b') as output:
                      try:
                          child=subprocess.Popen([sys.executable,'-I','-c',SUPERVISOR,str(status_arg)],
                              cwd=cwd or workspace,stdin=subprocess.PIPE,stdout=subprocess.PIPE,
                              stderr=subprocess.STDOUT,env=environment,**kwargs)
                          if job and not job[0].AssignProcessToJobObject(job[1],int(child._handle)):
                              # The supervisor is waiting for input; no command was started.
                              child.kill(); raise OSError('job_assignment_failed')
                          if os.name=='nt': os.set_handle_inheritable(status_arg,False)
                          os.close(write_fd); write_fd=None
                          def reader():
                              try:
                                  while not stop.is_set():
                                      block=os.read(child.stdout.fileno(),65536)
                                      while not stop.is_set():
                                          try: blocks.put(block,timeout=0.2); break
                                          except queue.Full: pass
                                      if not block: return
                              except OSError:
                                  if not stop.is_set(): errors.append(True)
                          def read_status():
                              try:
                                  data=b''
                                  while len(data)<=32 and not data.endswith(b'\n'):
                                      block=os.read(read_fd,33-len(data))
                                      if not block: break
                                      data+=block
                                  status.put(int(data) if re.fullmatch(rb'-?[0-9]{1,10}\n',data) else None)
                              except (OSError,ValueError): status.put(None)
                          threads=[threading.Thread(target=reader,daemon=True),threading.Thread(target=read_status,daemon=True)]
                          for thread in threads: thread.start()
                          payload=(json.dumps(args,separators=(',',':'))+'\n').encode('utf-8')
                          if len(payload)>65535: raise ValueError('command_too_large')
                          child.stdin.write(payload); child.stdin.flush()
                          deadline=time.monotonic()+seconds
                          while True:
                              if not cleaned:
                                  try: returned=status.get_nowait()
                                  except queue.Empty: pass
                                  else:
                                      if returned is None: reason='process_error'; break
                                      code=returned; cleanup()
                                      # Drain buffered output after killing remaining descendants.
                                      deadline=min(deadline,time.monotonic()+10)
                              remaining=deadline-time.monotonic()
                              if remaining<=0: reason='deadline'; break
                              try: block=blocks.get(timeout=min(0.2,remaining))
                              except queue.Empty: continue
                              if not block:
                                  if code is None: reason='process_error'
                                  break
                              if output.tell()+len(block)>limit: reason='output_limit'; break
                              output.write(block)
                      except (OSError,ValueError,subprocess.SubprocessError): reason='process_error'
                      finally:
                          try: cleanup()
                          except OSError: reason='cleanup_failed'
                          if not cleanup_ok: reason='cleanup_failed'
                          if child is not None:
                              try: child.wait(timeout=10)
                              except subprocess.SubprocessError: reason='cleanup_failed'
                              child.stdin.close()
                          stop.set()
                          if write_fd is not None: os.close(write_fd); write_fd=None
                          for thread in threads: thread.join(timeout=2)
                          if any(thread.is_alive() for thread in threads): reason='cleanup_failed'
                          if child is not None: child.stdout.close()
                          os.close(read_fd)
                      output.flush(); output.seek(0); captured=output.read(limit+1)
                      if not stat.S_ISREG(os.fstat(output.fileno()).st_mode) or len(captured)>limit:
                          reason='output_limit'; captured=b''
              finally:
                  if write_fd is not None: os.close(write_fd)
              if errors: reason=reason or 'process_error'
              # Parsing and scanning consume these same captured bytes, never a reopened path.
              return {'code':code,'reason':reason,'bytes':len(captured),'log':log,'captured':captured}

          # Verify the owner runner wrapper on generated processes before candidate code.
          # The orphan redirects its output, reproducing the normal-exit cleanup bug.
          probe_root=private/'lifecycle-probe'; probe_root.mkdir(mode=0o700)
          ready=probe_root/'ready'; late=probe_root/'late'
          orphan_code="import pathlib,sys,time; pathlib.Path(sys.argv[1]).write_text('ready'); time.sleep(2); pathlib.Path(sys.argv[2]).write_text('escaped'); time.sleep(30)"
          parent_code="""import pathlib,subprocess,sys,time
          child=subprocess.Popen([sys.executable,'-I','-c',sys.argv[1],sys.argv[2],sys.argv[3]],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,close_fds=True)
          until=time.monotonic()+5
          while not pathlib.Path(sys.argv[2]).exists():
              if time.monotonic()>=until: raise SystemExit(8)
              time.sleep(0.01)
          sys.stdout.buffer.write(b'ready\\n'); sys.stdout.buffer.flush()
          """
          normal=bounded([sys.executable,'-I','-c',parent_code,orphan_code,str(ready),str(late)],'owner-orphan-probe',15,1024)
          time.sleep(2.2)
          nonzero=bounded([sys.executable,'-I','-c','raise SystemExit(7)'],'owner-exit-probe',10,1024)
          deadline=bounded([sys.executable,'-I','-c','import time; time.sleep(30)'],'owner-deadline-probe',0.2,1024)
          overflow=bounded([sys.executable,'-I','-c',"print('x'*4096,flush=True)"],'owner-output-probe',10,1024)
          probe_ok=(normal['reason'] is None and normal['code']==0 and normal['captured']==b'ready\n'
              and ready.is_file() and not late.exists() and nonzero['reason'] is None and nonzero['code']==7
              and deadline['reason']=='deadline' and overflow['reason']=='output_limit')
          print(json.dumps({'check':'owner_process_lifecycle','status':'passed' if probe_ok else 'failed',
              'candidate_executed':False,'raw_logs_public':False},sort_keys=True),flush=True)
          if not probe_ok: raise SystemExit(1)

          import io, tarfile, urllib.request, zipfile
          source='e86857c6517980b5f8e421f2464d8954e898c4a8'
          identity=bounded(['git','rev-parse','HEAD'],'source-identity',15,4096)
          if identity['reason'] or identity['code']!=0 or identity['captured'].decode('ascii').strip()!=source:
              print(json.dumps({'check':'reviewed_source','status':'failed'})); raise SystemExit(1)
          archives={
              ('Linux','X64'):('linux_x64.tar.gz','551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'),
              ('macOS','ARM64'):('darwin_arm64.tar.gz','b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'),
              ('macOS','X64'):('darwin_x64.tar.gz','dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709'),
              ('Windows','X64'):('windows_x64.zip','d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'),
          }
          archive,digest=archives[(os.environ['RUNNER_OS'],os.environ['RUNNER_ARCH'])]
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_'+archive
          try:
              data=bytearray(); deadline=time.monotonic()+180
              with urllib.request.urlopen(url,timeout=30) as response:
                  while True:
                      chunk=response.read(65536)
                      if not chunk: break
                      data.extend(chunk)
                      if len(data)>32*1024*1024 or time.monotonic()>deadline: raise ValueError()
              if hashlib.sha256(data).hexdigest()!=digest: raise ValueError()
              with (private/'verified-scanner-archive').open('xb') as saved: saved.write(data)
              executable='gitleaks.exe' if os.name=='nt' else 'gitleaks'
              if archive.endswith('.zip'):
                  with zipfile.ZipFile(io.BytesIO(data)) as packaged:
                      member=packaged.getinfo(executable)
                      if member.file_size>64*1024*1024: raise ValueError()
                      binary=packaged.read(member)
              else:
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as packaged:
                      member=packaged.getmember(executable)
                      if not member.isfile() or member.size>64*1024*1024: raise ValueError()
                      binary=packaged.extractfile(member).read(64*1024*1024+1)
              if not binary or len(binary)>64*1024*1024: raise ValueError()
              scanner=private/executable
              with scanner.open('xb') as output: output.write(binary)
              scanner.chmod(0o700)
          except Exception:
              print(json.dumps({'check':'verified_scanner_bootstrap','status':'failed'})); raise SystemExit(1)
          config=private/'default.toml'; config.write_bytes(b'[extend]\nuseDefault = true\n')
          ignore=private/'empty.ignore'; ignore.write_bytes(b'')
          print(json.dumps({'check':'reviewed_source_and_private_scanner','status':'passed',
              'source':source,'raw_logs_public':False},sort_keys=True))
      - name: Install reviewed Linux native compilation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev \
            libsystemd-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xauth \
            dbus-x11 gnome-keyring libsecret-tools libgl1-mesa-dri fonts-noto-color-emoji
          # Ubuntu 24.04 Chromium dependencies from pinned Playwright 1.62.1.
          # Install before the peer drops privileges inside its PID namespace.
          sudo apt-get install -y \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # reviewed action pin
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          workspaces: candidate -> target
          save-if: false
      - name: Verify only changed Element evidence helpers and stock RC lifecycle
        timeout-minutes: 160
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TERM_COLOR: never
          SLINT_EMIT_DEBUG_INFO: "1"
        shell: python -I {0}
        run: |
          import hashlib, json, os, pathlib, queue, re, signal, subprocess, tempfile, threading, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert (os.environ.get('RUNNER_OS'),os.environ.get('RUNNER_ARCH')) == (
              os.environ['MORPHEUS_EXPECTED_OS'],os.environ['MORPHEUS_EXPECTED_ARCH'])
          os.umask(0o077)
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()/'candidate'
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/'morpheus-native-private'
          private.mkdir(mode=0o700,exist_ok=True)
          logs=private/'logs'; logs.mkdir(mode=0o700,exist_ok=True)
          # Only compilation/runtime essentials. No GITHUB_TOKEN, ACTIONS tokens, inherited
