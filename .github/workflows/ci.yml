# TEMPORARY owner-selected native diagnostic. NEVER MERGE into main.
# The unchanged system PipeWire first-frame failure remains an OPEN release gate.
# Helper contracts only; no native build, package, account vault or live service.
# Complete native, integration and release gates remain open.
name: Timeline selector contracts - no native builds
run-name: Timeline selector contracts e0d50ed - no native builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Security and change scope
    # Hosted validation is disabled while private to prevent unauthorized paid builds.
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/timeline-selector-preflight-e0d50ed' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: "true"
      native_matrix: '{"os":["macos-15-intel"]}'
      config: "false"
      # Known unchanged system-library failure is outside this diagnostic.
      # Normal CI and release gates are preserved on the integration branch.
      wayland: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed validation inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR input is read as data; classification code comes from its base.
          # Push uses reviewed main; dispatch uses its owner-selected revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Never honor candidate-provided rules or suppression files. No
          # candidate code has executed on this runner before scanning.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --log-opts=--all .

  helpers:
    name: Timeline selector and helper contracts
    needs: scope
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e0d50ed5ceb7a189d6d08e662872164955c5e9c2
          persist-credentials: false
      - name: Check scope and packaging helpers
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          node --check scripts/element_call_peer.mjs
          node --check scripts/element_call_stock_peer.mjs
          python3 scripts/package.py --check
