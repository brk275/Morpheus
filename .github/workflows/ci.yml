name: Inline audio layout diagnostic
run-name: Inline audio layout bounds on Apple Silicon
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inline-audio-bounds-7bf-macos
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  source:
    name: Scan exact diagnostic source
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ad9325eea2c879b400785a498ab4692314206d33
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5078f4951c4f6ff6e65ddb560312f655e933e4e2
          persist-credentials: false
          path: validation
      - name: Verify and scan source before execution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ad9325eea2c879b400785a498ab4692314206d33
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "4acde7ed74259339d9494b5e2d52aff42e1317bbdf23400cc67bf7bf3085caef  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "446f0686722972d33a6a411b83dfc4ab30f14b9022772028491b2bd5e55fa892  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/inline-audio-history-scan"
  audio:
    name: Reproduce inline audio geometry (Apple Silicon)
    needs: source
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ad9325eea2c879b400785a498ab4692314206d33
          persist-credentials: false
          path: candidate
      - name: Verify exact diagnostic source
        run: test "$(git rev-parse HEAD)" = ad9325eea2c879b400785a498ab4692314206d33
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
          workspaces: candidate
      - name: Run the existing desktop controller and call guards with failure-only geometry
        timeout-minutes: 70
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        # Keep the original command and default test concurrency. Other app
        # tests may share process state; filtering would change the reproducer.
        # No packaging, provider fixture, native media device or owner vault.
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app
      # No artifacts, profiles, binaries, installers or releases are uploaded.
