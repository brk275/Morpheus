              'tests_required': 161, 'required_ids_sha256': required_ids_sha256,
              'complete': complete, 'helper_only': True, 'raw_logs_public': False,
              'helper_record_valid': evidence is not None,
              'failed_ids': evidence['failed_ids'] if evidence is not None else [],
              'failed_ids_count': evidence['failed_ids_count'] if evidence is not None else None,
              'failed_ids_truncated': evidence['failed_ids_truncated'] if evidence is not None else False,
              'unmapped_failure': evidence['unmapped_failure'] if evidence is not None else False,
