name: Held modified sender index experiment

# TEMPORARY DIAGNOSTIC BRANCH ONLY. NEVER MERGE.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact independently reviewed temporary branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modified-sender-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compile:
    name: MODIFIED_PEER compiler and existing Linux call case (partial)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.ref == 'refs/heads/codex/diagnostic-native-index-rotation-20261028' && inputs.candidate_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: native-${{ github.sha }}-ubuntu-24.04
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact reviewed source and materialize trusted history scanner
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha }}
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, stat, subprocess
          root = pathlib.Path.cwd()
          assert os.environ['GITHUB_REPOSITORY'] == 'brk275/Morpheus'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'brk275'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/diagnostic-native-index-rotation-20261028'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted' and os.environ['RUNNER_OS'] == 'Linux'
          revision = os.environ['EXPECTED_CANDIDATE']
          assert re.fullmatch('[0-9a-f]{40}', revision) and revision == os.environ['GITHUB_SHA']
          env = {k: v for k, v in os.environ.items() if not k.startswith(('GIT_', 'SSH_'))}
          env.update(GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_NOSYSTEM='1', GIT_NO_REPLACE_OBJECTS='1',
                     GIT_ATTR_NOSYSTEM='1', GIT_OPTIONAL_LOCKS='0', GIT_NO_LAZY_FETCH='1')
          def git(*args):
              return subprocess.run(['/usr/bin/git', '--no-pager', '-c', 'core.hooksPath=/dev/null',
                  '-c', 'core.fsmonitor=false', '-c', 'core.attributesFile=/dev/null', *args],
                  env=env, check=True, capture_output=True, timeout=90).stdout
          assert git('rev-parse', 'HEAD').decode().strip() == revision
          control = {'.github/workflows/ci.yml', 'scripts/modified-sender-experiment-source.json'}
          path = root / 'scripts/modified-sender-experiment-source.json'
          info = path.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 1024 * 1024
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '63c00b91fb53c445afe341233233d4e97fcf5189e645e7b6208dbd1d19eef668'
          manifest = json.loads(raw)
          assert manifest['excluded_control_paths'] == sorted(control)
          expected = manifest['tree_entries']
          actual = {}
          for row in git('ls-tree', '-r', '-z', 'HEAD').split(b'\0'):
              if row:
                  header, name = row.split(b'\t', 1)
                  mode, kind, blob = header.decode().split()
                  name = name.decode('utf-8')
                  assert kind == 'blob' and mode in ('100644', '100755', '120000')
                  actual[name] = {'mode': mode, 'type': kind, 'blob': blob}
          assert set(actual) == set(expected) | control
          assert all(actual[name]['mode'] == '100644' for name in control)
          for name, item in expected.items():
              assert actual[name] == {key: item[key] for key in ('mode', 'type', 'blob')}
              leaf = root / name
              assert leaf.parent.resolve().is_relative_to(root.resolve())
              info = leaf.lstat()
              assert info.st_uid == os.geteuid()
              if item['mode'] == '120000':
                  assert stat.S_ISLNK(info.st_mode)
                  data = os.fsencode(os.readlink(leaf))
              else:
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1
                  assert bool(info.st_mode & 0o111) == (item['mode'] == '100755')
                  assert info.st_size == item['bytes']
                  data = leaf.read_bytes()
              assert len(data) == item['bytes']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == item['blob']
          for directory, dirs, files in os.walk(root, followlinks=False):
              if pathlib.Path(directory) == root:
                  dirs.remove('.git')
              for name in files + [name for name in dirs if (pathlib.Path(directory) / name).is_symlink()]:
                  assert str((pathlib.Path(directory) / name).relative_to(root)) in actual
          trusted = pathlib.Path(os.environ['RUNNER_TEMP']) / 'morpheus-modified-trusted-control'
          trusted.mkdir(mode=0o700)
          for name, digest in (
              ('scan_history.py', 'dcd5d9a2dfafaf50adb63f294eba982778b67dade562def4e0e32bf38941285c'),
              ('public-fixtures.json', '8c2f7aff4fee83b3ba9102f3d8dc918e4dd5878db87b53f662a1d3a73d3eec00')):
              data = git('show', '2765c919ba40ea9b19f006ef8379e71275c3edb4:scripts/' + name)
              assert hashlib.sha256(data).hexdigest() == digest
              with (trusted / name).open('xb') as out:
                  os.fchmod(out.fileno(), 0o600)
                  out.write(data)
          print('MODIFIED_PEER_SOURCE_BOUND stock_acceptance=false beta_ready=false')
      - name: Install exact scanner and scan full committed history
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 30 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $RUNNER_TEMP/gitleaks/gitleaks" | sha256sum --check --status
          python3 -I -B "$RUNNER_TEMP/morpheus-modified-trusted-control/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$RUNNER_TEMP/morpheus-modified-trusted-control/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/morpheus-modified-history-scan"
      - name: Existing asset security cases and finite native failure parser regression
        timeout-minutes: 5
        run: python3 -I -B scripts/tests/test_element_acceptance.py -v ModifiedPeerAssetsTests EvidenceTests.test_native_failure_discriminator_is_fixed_and_source_bound
      - name: Build the corrected modified browser peer with reviewed compilers
        id: peer
        timeout-minutes: 65
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, sys, tempfile, types
          root = pathlib.Path.cwd()
          source = (root / 'scripts/sender_proposal_tools.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'aabdfa3841461570fe545528b03b79de99da6094c2bd79090c4be71e84872490'
          tools = types.ModuleType('reviewed_sender_tools')
          exec(compile(source, 'reviewed_sender_tools', 'exec'), tools.__dict__)
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          logs = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-modified-compiler-logs-', dir=temp))
          tools.write(logs / 'scanner.toml', b'[extend]\nuseDefault = true\n')
          tools.write(logs / 'scanner.ignore', b'')
          peer = temp / ('morpheus-modified-sender-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          assert not peer.exists()
          keys = ('PATH', 'RUNNER_TEMP', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'ImageOS',
                  'GITHUB_ACTIONS', 'GITHUB_REPOSITORY', 'GITHUB_ACTOR', 'GITHUB_TRIGGERING_ACTOR')
          env = {key: os.environ[key] for key in keys if key in os.environ}
          env.update(CI='true', TZ='UTC', LANG='C.UTF-8')
          tools.checked_command('modified_peer_producer', [sys.executable, '-I', '-B',
              str(root / 'scripts/build_modified_sender_peer.py'), '--root', str(peer),
              '--scanner', str(temp / 'gitleaks/gitleaks')], root, env, logs, temp / 'gitleaks/gitleaks', 3600)
          # The bounded producer log was independently default-scanned above.
          lines = (logs / 'modified_peer_producer/job.log').read_text().splitlines()
          result = json.loads(lines[-1])
          assert set(result) == {'classification', 'manifest_sha256', 'official_stock_acceptance', 'beta_ready'}
          assert result['classification'] == 'MODIFIED_PEER'
          assert result['official_stock_acceptance'] is False and result['beta_ready'] is False
          digest = result['manifest_sha256']
          assert re.fullmatch('[0-9a-f]{64}', digest)
          receipt = peer / 'element-interop/modified-peer/build-receipt.json'
          assert hashlib.sha256(tools.regular(receipt, 2 * 1024 * 1024)).hexdigest() == digest
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
              output.write('root=' + str(peer) + '\nmanifest=' + digest + '\n')
          print('MODIFIED_PEER_COMPILER_PASSED stock_acceptance=false beta_ready=false')
      - name: Linux native dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          # Use only the official Ubuntu archive for this step; the hosted
          # image's Azure mirror can stall otherwise bounded provisioning.
          [[ "${ImageOS:-}" == ubuntu24 ]]
          [[ "$(dpkg --print-architecture)" == amd64 ]]
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # APT resolves the disabled sourceparts value below to /etc/apt/-.
          test ! -d /etc/apt/-
          apt_sources="$(mktemp --tmpdir="$RUNNER_TEMP" --suffix=.sources morpheus-apt-XXXXXXXXXX)"
          trap 'rm -f -- "$apt_sources"' EXIT
          cat > "$apt_sources" <<'MORPHEUS_UBUNTU_SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MORPHEUS_UBUNTU_SOURCES
          chmod 0644 "$apt_sources"
          # Keep all three invocations noninteractive and bounded; no global
          # source files or package verification settings are changed.
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=-)
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" update < /dev/null
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr < /dev/null
          # Ubuntu 24.04 Chromium dependencies from pinned Playwright 1.62.1.
          # Install before the peer drops privileges inside its PID namespace.
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf < /dev/null
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          cache-on-failure: true
          save-if: false
      - name: Prepare the pinned owned native PipeWire client
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_linux_native.py --variant native \
            --prefix "$RUNNER_TEMP/morpheus-native-pipewire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Two existing-module native sender index regressions
        timeout-minutes: 25
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, tempfile, types
          root = pathlib.Path.cwd()
          source = (root / 'scripts/sender_proposal_tools.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'aabdfa3841461570fe545528b03b79de99da6094c2bd79090c4be71e84872490'
          tools = types.ModuleType('reviewed_sender_tools')
          exec(compile(source, 'reviewed_sender_tools', 'exec'), tools.__dict__)
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          logs = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-native-index-unit-logs-', dir=temp))
          tools.write(logs / 'scanner.toml', b'[extend]\nuseDefault = true\n')
          tools.write(logs / 'scanner.ignore', b'')
          tools.checked_command('native_index_regressions', ['cargo', 'test', '--locked', '-p',
              'matrix-rtc-livekit', '--lib', 'encoding_tests::local_key_index_', '--', '--show-output',
              '--color', 'never'], root, dict(os.environ), logs, temp / 'gitleaks/gitleaks', 1200)
          # Inspect only this bounded, independently default-scanned log.
          text = (logs / 'native_index_regressions/job.log').read_text()
          names = (
              'transport_impl::encoding_tests::local_key_index_publish_reassertion_cannot_overwrite_a_concurrent_key_activation',
              'transport_impl::encoding_tests::local_key_index_without_an_activated_key_is_not_reasserted',
          )
          for name in names:
              assert len(re.findall('^test ' + re.escape(name) + r' \.\.\. ok$', text, re.MULTILINE)) == 1
          assert len(re.findall(r'^test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured;', text, re.MULTILINE)) == 1
          print('NATIVE_SENDER_INDEX_REGRESSIONS passed=2 failed=0 ignored=0 stock_acceptance=false beta_ready=false')
      - name: Existing unchanged call method against MODIFIED_PEER
        timeout-minutes: 55
        env:
          MODIFIED_ROOT: ${{ steps.peer.outputs.root }}
          MODIFIED_MANIFEST: ${{ steps.peer.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py \
            --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --suite element-interop \
            --modified-sender-root "$MODIFIED_ROOT" \
            --modified-sender-manifest-sha256 "$MODIFIED_MANIFEST"
