# TEMPORARY focused native offline app checks. NEVER MERGE this workflow.
name: Reviewed SDKUI lock metadata
run-name: SDKUI reviewed macro lock resolution - c0906f2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdkui-reviewed-macro-lock-c0906f2
  cancel-in-progress: false
jobs:
  contracts:
    name: Resolve reviewed SDKUI dependency edges only
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c0906f2240ac9c983dbdd3c37f8fecd57b31fa76
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = c0906f2240ac9c983dbdd3c37f8fecd57b31fa76
      - name: Scan source before executing reviewed native tests
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Resolve dependency edges without compiling or executing project code
        timeout-minutes: 5
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, re, select, signal, subprocess, tempfile, time, tomllib
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          names = ('PATH','HOME','LANG','LC_ALL','TMPDIR','CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN',
              'PKG_CONFIG_PATH','LD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR','CARGO_BUILD_JOBS',
              'CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG','CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','ImageOS','RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment = {name:os.environ[name] for name in names if name in os.environ}
          root = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-offline-app-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          logs = root/'logs'; logs.mkdir(mode=0o700)
          log = logs/'cargo.log'
          reason = None
          code = None
          before=pathlib.Path('Cargo.lock').read_bytes()
          with log.open('xb') as output:
              child = subprocess.Popen(['cargo','update','--workspace'],
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  env=environment, start_new_session=True)
              deadline = time.monotonic()+180
              size = 0
              try:
                  while True:
                      remaining = deadline-time.monotonic()
                      if remaining<=0:
                          reason='deadline'; break
                      ready,_,_=select.select([child.stdout],[],[],remaining)
                      if not ready:
                          reason='deadline'; break
                      block=os.read(child.stdout.fileno(),65536)
                      if not block: break
                      size+=len(block)
                      if size>8*1024*1024:
                          reason='output_limit'; break
                      output.write(block)
                  if reason is None:
                      code=child.wait(timeout=10)
              except (OSError,subprocess.SubprocessError):
                  reason='process_error'
              finally:
                  # Never signal an already-reaped PID/group. Timeout and
                  # overflow keep our child anchored until after group kill.
                  if child.returncode is None:
                      try: os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      child.wait(timeout=10)
                  child.stdout.close()
          with (root/'scan.log').open('wb') as output:
              scan=subprocess.run([os.environ['RUNNER_TEMP']+'/gitleaks/gitleaks','dir',str(logs),
                  '--redact=100','--ignore-gitleaks-allow','--no-banner','--max-target-megabytes','0',
                  '--config',os.environ['RUNNER_TEMP']+'/default.toml',
                  '--gitleaks-ignore-path',os.environ['RUNNER_TEMP']+'/empty.ignore'],
                  stdout=output,stderr=subprocess.STDOUT,timeout=60)
          if scan.returncode!=0:
              print('OFFLINE_NATIVE_LOG_WITHHELD',flush=True); raise SystemExit(1)
          output=log.read_text(errors='replace')
          report={'check':'sdkui_lock_metadata','source':'c0906f2240ac9c983dbdd3c37f8fecd57b31fa76',
              'status':'failed','failure':reason or 'metadata_command_failed',
              'project_code_executed':False,'raw_logs_public':False,'artifacts_uploaded':False}
          families={
              'lock_update': ('lock file' in output or 'lockfile' in output) and '--locked' in output,
              'workspace_inheritance': 'inherit' in output and 'workspace' in output,
              'manifest': 'manifest' in output and ('parse' in output or 'failed to load' in output),
              'offline_cache': '--offline' in output or 'offline mode' in output,
              'dependency_resolution': 'failed to select a version' in output or 'no matching package' in output,
              'git_fetch': 'failed to fetch' in output or 'failed to clone' in output,
              'network': 'network failure' in output or 'Could not resolve host' in output or 'failed to get successful HTTP response' in output,
          }
          report['error_families']=sorted(name for name,value in families.items() if value)
          if reason is None and code==0:
              stage='size'
              try:
                  after=pathlib.Path('Cargo.lock').read_bytes()
                  assert len(before)<=4*1024*1024 and len(after)<=4*1024*1024
                  old=tomllib.loads(before.decode()); new=tomllib.loads(after.decode())
                  stage='top_level'
                  report['changed_top_level_keys']=sorted(key for key in ('version','metadata','patch') if old.get(key)!=new.get(key))
                  assert {k:v for k,v in old.items() if k!='package'}=={k:v for k,v in new.items() if k!='package'}
                  def identity(package):
                      return tuple(package.get(key,'') for key in ('name','version','source','checksum'))
                  previous={identity(package):package for package in old['package']}
                  current={identity(package):package for package in new['package']}
                  assert len(previous)==len(old['package']) and len(current)==len(new['package'])
                  stage='identities'
                  added=sorted(set(current)-set(previous)); removed=sorted(set(previous)-set(current))
                  report.update(previous_packages=len(previous),current_packages=len(current))
                  assert len(added)<=64 and len(removed)<=64
                  known_sources={key[2] for key in previous}
                  def public_identity(key):
                      name,version,source,checksum=key
                      assert type(name) is str and re.fullmatch(r'[A-Za-z0-9_-]{1,100}',name)
                      assert type(version) is str and re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.+_-]{1,80})?',version)
                      assert checksum=='' or re.fullmatch(r'[a-f0-9]{64}',checksum)
                      return {'name':name,'version':version,'source':source if source in known_sources else None,
                          'source_known':source in known_sources,'checksum':checksum}
                  report['identity_changes']={'added':[public_identity(key) for key in added],
                      'removed':[public_identity(key) for key in removed]}
                  assert set(previous)==set(current)
                  allowed={edge for package in old['package'] for edge in package.get('dependencies',[])}
                  for package in old['package']:
                      allowed.add(package['name'])
                      allowed.add(package['name']+' '+package['version'])
                      if 'source' in package:
                          allowed.add(package['name']+' '+package['version']+' ('+package['source']+')')
                  changes=[]
                  for key in sorted(previous):
                      first,last=previous[key],current[key]
                      stage='package_fields'
                      assert {k:v for k,v in first.items() if k!='dependencies'}=={k:v for k,v in last.items() if k!='dependencies'}
                      stage='edge_references'
                      left,right=first.get('dependencies',[]),last.get('dependencies',[])
                      assert type(left) is list and type(right) is list and len(right)<=256
                      assert all(type(edge) is str and edge in allowed for edge in right)
                      if left!=right:
                          changes.append({'package':key[0]+'@'+key[1],'before':left,'after':right})
                  stage='change_bound'
                  assert len(changes)<=64
                  report.update(status='passed',failure=None,error_families=[],
                      package_identities_unchanged=True,changes=changes,
                      base_lock_sha256=hashlib.sha256(before).hexdigest(),
                      generated_lock_sha256=hashlib.sha256(after).hexdigest())
              except (AssertionError,ValueError,KeyError,TypeError,UnicodeError):
                  report['failure']='unexpected_dependency_graph'
                  report['graph_stage']=stage
          print(json.dumps(report,sort_keys=True),flush=True)
          if report['status']!='passed': raise SystemExit(1)
          PY
      # Metadata only; generated lock is represented by validated existing-package edges and SHA256.
