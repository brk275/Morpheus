# TEMPORARY ADMISSION ONLY. NEVER MERGE THIS WORKFLOW OR GUARD FILES.
name: Reviewed Windows production implementation selection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-owned-selection-probe-20261028
  cancel-in-progress: false
jobs:
  fixture:
    if: >-
      github.repository == 'brk275/Morpheus' && github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/windows-owned-selection-probe-20261028' &&
      github.actor == 'brk275' && github.triggering_actor == 'brk275'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Get only the reviewed temporary admission files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          path: guard
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /compiler-fixture-admission.ps1
            /compiler-host-inputs.json
            /selection-probe.ps1
      - name: Get exact reviewed main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: 5d2642dbaa73b50fbe001c6727e5c4b35c2d00ef
          path: candidate
          persist-credentials: false
      - name: Hold authenticated compiler inputs through selection only
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'guard/compiler-fixture-admission.ps1') `
            -ExpectedManifest (Join-Path $env:GITHUB_WORKSPACE 'guard/compiler-host-inputs.json') `
            -CandidateRoot (Join-Path $env:GITHUB_WORKSPACE 'candidate')
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # No native build, SDK invocation, cache, artifact, secret or publication.
