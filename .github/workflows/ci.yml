          ring_stages = frozenset(('fixture', 'login', 'sticky_sync', 'own_crypto', 'peer_trust', 'targets', 'join', 'membership', 'observer_open', 'observer_roster', 'actor_setup', 'observer_leave', 'send', 'receive', 'fetch', 'validate', 'admission', 'revalidate', 'redact', 'redaction', 'receipt_redaction', 'withdraw', 'cleanup'))
          actor_stages = frozenset(('worker_start', 'first_discovery', 'key_rejection', 'worker_withdrawal', 'fresh_offer', 'answer_reservation', 'transition_lock', 'accepted_join', 'exact_joined_identity', 'receive_only_state', 'established_withdrawal', 'accepted_leave', 'actor_cleanup', 'account_fresh_offer', 'account_answer', 'account_alternate_login', 'account_cancellation', 'account_restore', 'account_old_key', 'account_old_join', 'account_roster'))
          actor_errors = frozenset(('unavailable', 'capacity', 'stale', 'expired', 'busy', 'revoked', 'admission_account', 'admission_sync', 'admission_receipt', 'admission_replay', 'admission_expired', 'admission_membership', 'admission_trust', 'admission_policy', 'admission_quiet', 'admission_transport', 'admission_unavailable', 'admission_timed_out', 'admission_revoked', 'wrong_call', 'cancelled', 'account_changed', 'incoming_offer_unavailable', 'room_not_loaded', 'encryption_state', 'room_state', 'matrix', 'rtc', 'media', 'worker_stopped', 'timed_out', 'cleanup', 'update', 'connection_lost', 'assertion', 'invitation_account_mismatch', 'invitation_call_unavailable', 'invitation_clock', 'invitation_membership_unconfirmed', 'invitation_no_targets', 'invitation_not_encrypted', 'invitation_room_mention_forbidden', 'invitation_suppressed_cancelled', 'invitation_suppressed_legacy', 'invitation_suppressed_occupied', 'invitation_suppressed_voice_space', 'invitation_target_check', 'invitation_timed_out', 'invitation_too_many_targets', 'invitation_unconfirmed', 'invitation_unsupported_server', 'invitation_voice_space_check', 'observer_closed', 'observer_invalid_membership', 'observer_invalid_room', 'observer_not_encrypted', 'observer_not_joined', 'observer_roster_not_current', 'observer_slot_unavailable', 'observer_timed_out', 'observer_too_many_participants', 'observer_unavailable', 'observer_unsupported_dialect', 'observer_unsupported_server'))
          actor_numbers = frozenset(('worker_scope_unavailable', 'worker_scope_setup_failed', 'worker_gate_invalidation', 'worker_gate_shutdown', 'worker_publication', 'worker_publication_rejected', 'worker_candidate_queued', 'worker_candidate_stale_epoch', 'worker_candidate_interrupted', 'worker_candidate_invalidated', 'worker_admission_started', 'worker_admission_succeeded', 'worker_controller_unavailable', 'worker_controller_capacity', 'worker_controller_stale', 'worker_controller_expired', 'worker_controller_busy', 'worker_controller_revoked', 'worker_controller_wrong_call', 'worker_admission_account', 'worker_admission_sync', 'worker_admission_receipt', 'worker_admission_replay', 'worker_admission_expired', 'worker_admission_membership', 'worker_admission_trust', 'worker_admission_policy', 'worker_admission_quiet', 'worker_admission_transport', 'worker_admission_unavailable', 'worker_admission_timed_out', 'worker_admission_revoked', 'worker_cache_invalidated', 'worker_receipt_capacity', 'worker_missing_identity', 'worker_receipt_oversized', 'worker_receipt_unverified', 'worker_receipt_malformed', 'worker_receipt_identity', 'worker_no_verified_receipts', 'worker_member_capacity', 'worker_member_oversized', 'worker_member_malformed', 'worker_member_unverified', 'worker_member_mismatch', 'worker_caller_membership_missing', 'worker_cache_changed', 'worker_gate_unavailable', 'worker_candidate_queue_full', 'worker_seen_retained', 'fresh_before_idle', 'fresh_before_selected', 'fresh_before_sync', 'fresh_before_caller_only', 'fresh_after_receipt_retained', 'fresh_after_receipt_cache_current'))
          observer_results = frozenset(('unsupported_dialect', 'invalid_room', 'not_joined', 'unsupported_server', 'not_encrypted', 'slot_unavailable', 'unavailable', 'timed_out', 'closed', 'invalid_membership', 'too_many_participants', 'roster_not_current', 'not_sampled', 'empty_roster', 'unexpected_roster', 'current_event_mismatch', 'membership_still_present', 'membership_expired', 'leave_unavailable'))
          admission_results = frozenset(('account', 'sync', 'receipt', 'replay', 'expired', 'membership', 'trust', 'policy', 'quiet', 'transport', 'unavailable', 'timed_out', 'revoked'))

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError('duplicate_field')
                  result[key] = value
              return result

          def report_record(output, prefix):
              # One closed record only, after independent default scan.
              if len(output) > 4 * 1024 * 1024: return None
              rows = []
              for line in output.splitlines():
                  if not line.startswith(prefix): continue
                  if len(line) > 16384: return None
                  try: rows.append(json.loads(line[len(prefix):], object_pairs_hook=unique_object))
                  except (ValueError, TypeError, RecursionError): return None
              return rows[0] if len(rows) == 1 and type(rows[0]) is dict else None

          def exact_true_map(value, names):
              return type(value) is dict and set(value) == names and all(item is True for item in value.values())

          def current_dm_evidence(output):
              row = report_record(output, 'MORPHEUS_CURRENT_DM_FOCUSED_RESULT ')
              return (row is not None and set(row) == {
                      'complete', 'initial_absence_proved', 'body_failed', 'ordered_steps', 'shared_cleanup_complete',
                      'ring_checks', 'incoming_checks', 'exact_native_test', 'exact_native_test_required', 'case', 'full_acceptance'}
                  and row.get('complete') is True and row.get('initial_absence_proved') is True
                  and row.get('body_failed') is False and row.get('shared_cleanup_complete') is True
                  and row.get('full_acceptance') is False and row.get('case') == 'current-dm'
                  and row.get('exact_native_test_required') is True
                  and row.get('exact_native_test') == 'outgoing_ring::live_tests::actual_outgoing_invitation_encrypted_receipt_and_redaction'
                  and exact_true_map(row.get('ordered_steps'), step_ids)
                  and exact_true_map(row.get('ring_checks'), ring_keys)
                  and exact_true_map(row.get('incoming_checks'), actor_keys))

          def native_compile_evidence(output):
              # Same App test binary used by the exact fixture. This is not a unit/UI suite run.
              if len(output) > 64 * 1024 * 1024: return False
              artifacts = []
              finished = []
              for line in output.splitlines():
                  if not line.startswith('{'): continue
                  if len(line) > 1024 * 1024: return False
                  try: row = json.loads(line, object_pairs_hook=unique_object)
                  except (ValueError, TypeError, RecursionError): return False
                  if type(row) is not dict: continue
                  if row.get('reason') == 'build-finished': finished.append(row.get('success') is True)
                  target = row.get('target'); profile = row.get('profile')
                  if (row.get('reason') != 'compiler-artifact' or type(target) is not dict
                      or target.get('name') != 'morpheus-app' or type(profile) is not dict
                      or profile.get('test') is not True): continue
                  if target.get('kind') != ['bin'] or type(row.get('executable')) is not str: return False
                  try:
                      candidate = pathlib.Path(row['executable'])
                      target_root = workspace / 'target'
                      if not candidate.is_absolute() or not candidate.is_relative_to(target_root): return False
                      if any(part in ('.', '..') for part in candidate.relative_to(target_root).parts): return False
                      parent = workspace
                      for component in candidate.relative_to(workspace).parts[:-1]:
                          parent = parent / component
                          if not stat.S_ISDIR(parent.lstat().st_mode): return False
                      info = candidate.lstat()
                      if not stat.S_ISREG(info.st_mode) or not info.st_mode & stat.S_IXUSR: return False
                      artifacts.append(candidate)
                  except (OSError, ValueError, TypeError): return False
              return len(artifacts) == 1 and finished == [True]

          native_prefix = private / 'native-pipewire'
          native_receipt = native_prefix / 'stage' / 'build-client.txt'

          def native_preparation_evidence():
              # Cargo's existing hook does the full library/receipt validation before linking.
              # This owner-side check only proves the exact required preparation result exists.
              try:
                  data = json.loads(regular_bytes(native_prefix / 'prepared.json', 4096), object_pairs_hook=unique_object)
                  return (type(data) is dict and set(data) == {'schema', 'variant', 'receipt', 'source_client_sha256', 'build_id', 'soname'}
                      and type(data['schema']) is int and data['schema'] == 1 and data['variant'] == 'native'
                      and data['receipt'] == str(native_receipt) and data['soname'] == 'libmorpheus-pipewire-0.3.so.0'
                      and type(data['source_client_sha256']) is str and re.fullmatch('[0-9a-f]{64}', data['source_client_sha256']) is not None
                      and type(data['build_id']) is str and re.fullmatch('[0-9a-f]{16,128}', data['build_id']) is not None
                      and 0 < len(regular_bytes(native_receipt, 4096)) <= 4096)
              except (OSError, ValueError, TypeError, RecursionError): return False

          def current_dm_diagnostics(output):
              # AFTER independent default scan; only the existing current-DM closed diagnostic vocabulary.
              # No raw marker, exception body, path, account, URL, event ID, secret or arbitrary string escapes.
              result = {}
              if len(output) > 4 * 1024 * 1024: return {'input_limit_exceeded': True}
              started = []
              completed = []
              for line in output.splitlines():
                  if len(line) > 16384: continue
                  if line.startswith('Starting '):
                      value = line[len('Starting '):]
                      if value in step_ids and len(started) < 32: started.append(value)
                  if not line.startswith('{'): continue
                  try: row = json.loads(line, object_pairs_hook=unique_object)
                  except (ValueError, TypeError, RecursionError): continue
                  if type(row) is not dict or type(row.get('check')) is not str or row['check'] not in step_ids: continue
                  if row.get('status') == 'passed' and len(completed) < 32: completed.append(row['check'])
                  if row.get('check') != 'outgoing-ring-current-dm': continue
                  value = row.get('reason')
                  if value in ('deadline', 'test_failed', 'evidence_incomplete'): result['reason'] = value
                  diagnostics = row.get('ring_diagnostics')
                  if type(diagnostics) is not dict: continue
                  facts = diagnostics.get('checks')
                  if type(facts) is dict:
                      result['ring_checks'] = {key: value for key, value in facts.items() if key in ring_keys and type(value) is bool}
                  for key, allowed in (('stage', ring_stages), ('failure', ring_stages | {'deadline'}),
                                       ('observer_result', observer_results), ('admission_result', admission_results)):
                      value = diagnostics.get(key)
                      if type(value) is str and value in allowed: result[key] = value
                  if type(diagnostics.get('passed')) is bool: result['passed'] = diagnostics['passed']
                  actor = diagnostics.get('incoming')
                  if type(actor) is not dict: continue
                  inner = {}
                  facts = actor.get('checks')
                  if type(facts) is dict:
                      inner['checks'] = {key: value for key, value in facts.items() if key in actor_keys and type(value) is bool}
                  for key, allowed in (('stage', actor_stages), ('failure', actor_stages), ('error', actor_errors)):
                      value = actor.get(key)
                      if type(value) is str and value in allowed: inner[key] = value
                  if actor.get('malformed') is True: inner['malformed'] = True
                  counts = actor.get('discovery')
                  if type(counts) is dict:
                      inner['discovery'] = {key: value for key, value in counts.items()
                          if key in actor_numbers and type(value) is int and 0 <= value <= 65535}
                  result['incoming'] = inner
              if started: result['started'] = started
              if completed: result['completed'] = completed
              return result

          checks = [
              ('owned_native_client_prepare', [sys.executable, '-I', '-B', 'scripts/build_linux_native.py',
                  '--variant', 'native', '--prefix', str(native_prefix)], 20 * 60),
              ('current_dm_native_target_compile', ['cargo', 'test', '--locked', '-p', 'morpheus-app',
                  '--features', 'native-calls', '--bin', 'morpheus-app', '--no-run', '--message-format=json'], 40 * 60),
              ('outgoing_ring_current_dm_diagnostic', ['dbus-run-session', '--', sys.executable, '-I', '-B', '-c',
                  focused_program, str(scanner)], 56 * 60),
          ]
          all_passed = True
          for name, args, seconds in checks:
              if not all_passed:
                  print(json.dumps({'check': name, 'status': 'not_run', 'reason': 'dependency_failed',
                      'source': source, 'focused_current_dm_only': True, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  continue
              if not tracked_intact() or not scanner_intact():
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              result = bounded(args, name, seconds)
              if result['reason'] == 'cleanup_failed':
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'cleanup_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              if not tracked_intact() or not scanner_intact():
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              if not scan_captured(result, name):
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'private_log_scan_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              output = result['captured'].decode('utf-8', errors='replace')
              command_ok = result['reason'] is None and result['code'] == 0
              if name == 'owned_native_client_prepare': complete = native_preparation_evidence()
              elif name == 'current_dm_native_target_compile': complete = native_compile_evidence(output)
              else: complete = current_dm_evidence(output)
              passed = command_ok and complete
              record = {'check': name, 'status': 'passed' if passed else 'failed', 'source': source,
                  'reason': result['reason'], 'exit_code': result['code'], 'log_bytes': result['bytes'],
                  'complete': complete, 'focused_current_dm_only': True, 'full_acceptance': False,
                  'raw_logs_public': False, 'real_accounts': False, 'physical_devices': False,
                  'installed_app': False, 'packages_uploaded': False}
              if name == 'owned_native_client_prepare':
                  record['variant'] = 'native'
                  if passed:
                      # No GITHUB_ENV or arbitrary loader override is exposed to candidate code.
                      environment['MORPHEUS_PIPEWIRE_CLIENT_VARIANT'] = 'native'
                      environment['MORPHEUS_PIPEWIRE_CLIENT_RECEIPT'] = str(native_receipt)
              elif name == 'current_dm_native_target_compile':
                  record.update(test_target='morpheus-app', features='native-calls', compile_only=True,
                                one_test_artifact=complete)
              else:
                  record['exact_native_test_required'] = 'outgoing_ring::live_tests::actual_outgoing_invitation_encrypted_receipt_and_redaction'
                  record['ring_checks'] = {key: passed for key in sorted(ring_keys)}
                  record['incoming_checks'] = {key: passed for key in sorted(actor_keys)}
                  record['bootstrap_and_cleanup'] = {key: passed for key in sorted(step_ids)}
                  if not passed: record['ring_diagnostics'] = current_dm_diagnostics(output)
              print(json.dumps(record, sort_keys=True), flush=True)
              all_passed = all_passed and passed
          if not all_passed: raise SystemExit(1)
