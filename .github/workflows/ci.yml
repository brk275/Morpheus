name: Linux sealed package provider feasibility (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-seal-provider-${{ github.sha }}
  cancel-in-progress: false
env:
  REVIEWED_SEAL_SOURCE: 726e80cda971afe546d9cf9ccb4b0a95b3afaff2
  REVIEWED_SEAL_TREE: f0dc6548e75a73a41e05f0f9a40b741b65ee3644
jobs:
  provider:
    name: Real Linux sealed package provider feasibility
    if: github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/temp-linux-seal-provider-regression-20261105' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_SEAL_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source identity without candidate imports
        shell: python -I -B {0}
        run: |
          import os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          for selector, expected in [('HEAD^{commit}', os.environ['REVIEWED_SEAL_SOURCE']), ('HEAD^{tree}', os.environ['REVIEWED_SEAL_TREE'])]:
              assert re.fullmatch('[0-9a-f]{40}', expected) and expected != '0'*40
              result = subprocess.run(['/usr/bin/git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', 'rev-parse', '--verify', selector], cwd=root, capture_output=True, timeout=20)
              assert result.returncode == 0 and result.stdout == (expected+'\n').encode() and not result.stderr
      - name: Reproduce reviewed immutable-main notice host hardening
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set -o noclobber
          hardener="$RUNNER_TEMP/morpheus-seal-hardener.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.py"
          /usr/bin/git show --no-ext-diff --no-textconv 0db9a18960b88421c9c0195c7e61c0139013a5f0:scripts/harden_linux_notice_host.py > "$hardener"
          echo "a87fd63c9bd26c45a0363a35b686df3935f8af9266045a4341c26dbf0a23cf66  $hardener" | /usr/bin/sha256sum --check --status
          sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS /usr/bin/python3 -I -B - < "$hardener"
      - name: Prepare existing pinned default scanner
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          scanner_root="$RUNNER_TEMP/morpheus-seal-scanner.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          mkdir "$scanner_root"
          archive="$scanner_root/gitleaks.tar.gz"
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --noproxy '*' --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | /usr/bin/sha256sum --check --status
          /usr/bin/tar -xzf "$archive" -C "$scanner_root" --no-same-owner --no-same-permissions gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $scanner_root/gitleaks" | /usr/bin/sha256sum --check --status
          chmod 500 "$scanner_root/gitleaks"
          printf 'MORPHEUS_SEAL_PROVIDER_SCANNER=%s\n' "$scanner_root/gitleaks" >> "$GITHUB_ENV"
      - name: Run only existing real-provider opt-in test
        timeout-minutes: 4
        env:
          MORPHEUS_PACKAGE_SOURCE_REVISION: ${{ env.REVIEWED_SEAL_SOURCE }}
          MORPHEUS_LINUX_SEAL_REAL_PROVIDER: '1'
        shell: python -I -B {0}
        run: |
          import io, json, os, sys, unittest
          from pathlib import Path
          assert sys.platform == 'linux' and os.environ.get('ImageOS') == 'ubuntu24'
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          sys.path.insert(0, str(root))
          name = 'scripts.tests.test_appimage_process.ProcessTests.test_temporary_inner_package_seal_owns_one_child_scans_all_output_and_refuses_failed_gates'
          suite = unittest.defaultTestLoader.loadTestsFromName(name)
          assert suite.countTestCases() == 1
          # Test output has only fixed booleans. Keep unexpected unittest exception
          # strings/frames in memory instead of reflecting them into public logs.
          result = unittest.TextTestRunner(stream=io.StringIO(), verbosity=2).run(suite)
          passed = result.testsRun == 1 and result.wasSuccessful() and not any((result.failures, result.errors, result.skipped, result.expectedFailures, result.unexpectedSuccesses))
          print('MORPHEUS_LINUX_SEAL_PROVIDER_RESULT ' + json.dumps({'schema':1,'check':'linux_seal_provider_single_test','source_revision':os.environ['REVIEWED_SEAL_SOURCE'],'source_tree':os.environ['REVIEWED_SEAL_TREE'],'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'passed':passed},sort_keys=True), flush=True)
          raise SystemExit(0 if passed else 1)
