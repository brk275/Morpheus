name: Focused Windows notice reader regressions
# TEMPORARY DIAGNOSTIC BRANCH ONLY. NEVER MERGE.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed source revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-notice-reader-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reader:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.ref == 'refs/heads/codex/diagnostic-windows-notice-birthtime-20261029' && inputs.candidate_sha == github.sha
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing file identity and actual Windows ACL regressions
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha }}
        shell: python -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, subprocess, sys, unittest
          root = pathlib.Path.cwd().resolve(strict=True)
          assert os.name == 'nt' and sys.platform == 'win32' and sys.version_info >= (3, 12)
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted' and os.environ['RUNNER_OS'] == 'Windows'
          assert os.environ['GITHUB_REPOSITORY'] == 'brk275/Morpheus'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'brk275'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/diagnostic-windows-notice-birthtime-20261029'
          revision = os.environ['EXPECTED_CANDIDATE']
          assert re.fullmatch('[0-9a-f]{40}', revision) and revision == os.environ['GITHUB_SHA']
          actual = subprocess.run(['git', '-c', 'core.hooksPath=NUL', '-c', 'core.fsmonitor=false',
              'rev-parse', 'HEAD'], check=True, capture_output=True, timeout=30).stdout.decode().strip()
          assert actual == revision
          files = {
            'scripts/native_notices.py': '2120751417996efaa7017ba6d98acb8fb87b84f64a1c9cd48321e4721099bb2f',
            'scripts/tests/test_package.py': 'd139d82b2071db65cf656f9f5aaf0cf86160bfde95201cb940bcdd67adb75145',
          }
          for name, digest in files.items():
              path = root / name
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          sys.path.insert(0, str(root))
          names = (
              'scripts.tests.test_package.NativeNoticeEvidenceTests.test_notice_reader_keeps_windows_birth_identity_and_each_api_change_time',
              'scripts.tests.test_package.NativeNoticeWindowsOwnershipTests.test_private_inherited_root_and_opened_handle_reject_hardlinks_and_live_writers',
              'scripts.tests.test_package.NativeNoticeWindowsOwnershipTests.test_acl_rejects_unknown_ace_and_foreign_writer_but_not_read_only_trustee',
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun == 3 and not result.skipped
          print('MORPHEUS_WINDOWS_NOTICE_READER ' + json.dumps({'passed': True,
              'tests': 3, 'skipped': 0, 'actual_windows_acl': True,
              'source': revision, 'beta_ready': False}, sort_keys=True))
