name: Held controlled SDK44 source-build pair

# TEMPORARY DIAGNOSTIC BRANCH ONLY. NEVER MERGE.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact independently reviewed temporary branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-element44-pair-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compile:
    name: CONTROLLED SDK44 baseline and renewal (not stock acceptance)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.ref == 'refs/heads/codex/diagnostic-controlled44-sender-pair-20261029' && inputs.candidate_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: native-${{ github.sha }}-ubuntu-24.04
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact reviewed source and materialize trusted history scanner
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_sha }}
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, stat, subprocess
          root = pathlib.Path.cwd()
          assert os.environ['GITHUB_REPOSITORY'] == 'brk275/Morpheus'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'brk275'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/diagnostic-controlled44-sender-pair-20261029'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted' and os.environ['RUNNER_OS'] == 'Linux'
          revision = os.environ['EXPECTED_CANDIDATE']
          assert re.fullmatch('[0-9a-f]{40}', revision) and revision == os.environ['GITHUB_SHA']
          env = {k: v for k, v in os.environ.items() if not k.startswith(('GIT_', 'SSH_'))}
          env.update(GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_NOSYSTEM='1', GIT_NO_REPLACE_OBJECTS='1',
                     GIT_ATTR_NOSYSTEM='1', GIT_OPTIONAL_LOCKS='0', GIT_NO_LAZY_FETCH='1')
          def git(*args):
              return subprocess.run(['/usr/bin/git', '--no-pager', '-c', 'core.hooksPath=/dev/null',
                  '-c', 'core.fsmonitor=false', '-c', 'core.attributesFile=/dev/null', *args],
                  env=env, check=True, capture_output=True, timeout=90).stdout
          assert git('rev-parse', 'HEAD').decode().strip() == revision
          control = {'.github/workflows/ci.yml', 'scripts/controlled44-source.json'}
          path = root / 'scripts/controlled44-source.json'
          info = path.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 1024 * 1024
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '87f8af84deae6333243565e7328c23ba8bd23d3be91485b03afcfcb070a26466'
          manifest = json.loads(raw)
          assert manifest['excluded_control_paths'] == sorted(control)
          expected = manifest['tree_entries']
          actual = {}
          for row in git('ls-tree', '-r', '-z', 'HEAD').split(b'\0'):
              if row:
                  header, name = row.split(b'\t', 1)
                  mode, kind, blob = header.decode().split()
                  name = name.decode('utf-8')
                  assert kind == 'blob' and mode in ('100644', '100755', '120000')
                  actual[name] = {'mode': mode, 'type': kind, 'blob': blob}
          assert set(actual) == set(expected) | control
          assert all(actual[name]['mode'] == '100644' for name in control)
          for name, item in expected.items():
              assert actual[name] == {key: item[key] for key in ('mode', 'type', 'blob')}
              leaf = root / name
              assert leaf.parent.resolve().is_relative_to(root.resolve())
              info = leaf.lstat()
              assert info.st_uid == os.geteuid()
              if item['mode'] == '120000':
                  assert stat.S_ISLNK(info.st_mode)
                  data = os.fsencode(os.readlink(leaf))
              else:
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1
                  assert bool(info.st_mode & 0o111) == (item['mode'] == '100755')
                  assert info.st_size == item['bytes']
                  data = leaf.read_bytes()
              assert len(data) == item['bytes']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == item['blob']
          for directory, dirs, files in os.walk(root, followlinks=False):
              if pathlib.Path(directory) == root:
                  dirs.remove('.git')
              for name in files + [name for name in dirs if (pathlib.Path(directory) / name).is_symlink()]:
                  assert str((pathlib.Path(directory) / name).relative_to(root)) in actual
          trusted = pathlib.Path(os.environ['RUNNER_TEMP']) / 'morpheus-controlled44-trusted-control'
          trusted.mkdir(mode=0o700)
          for name, digest in (
              ('scan_history.py', 'dcd5d9a2dfafaf50adb63f294eba982778b67dade562def4e0e32bf38941285c'),
              ('public-fixtures.json', '8c2f7aff4fee83b3ba9102f3d8dc918e4dd5878db87b53f662a1d3a73d3eec00')):
              data = git('show', 'c3aa6553acc396f7baac74039d6907fde21aabb6:scripts/' + name)
              assert hashlib.sha256(data).hexdigest() == digest
              with (trusted / name).open('xb') as out:
                  os.fchmod(out.fileno(), 0o600)
                  out.write(data)
          print('CONTROLLED44_SOURCE_BOUND beta_ready=false')
      - name: Install exact scanner and scan full committed history
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 30 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $RUNNER_TEMP/gitleaks/gitleaks" | sha256sum --check --status
          python3 -I -B "$RUNNER_TEMP/morpheus-controlled44-trusted-control/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$RUNNER_TEMP/morpheus-controlled44-trusted-control/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/morpheus-controlled44-history-scan"
      - name: Existing controlled receipt and fixed predicate contracts
        timeout-minutes: 5
        run: |
          python3 -I -B scripts/tests/test_element_acceptance.py -v ModifiedPeerAssetsTests EvidenceTests.test_requires_every_fixed_assertion_and_preserves_failure EvidenceTests.test_group_roster_failure_receipt_is_fixed_bounded_and_keeps_failure
      - name: Linux native dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          # Use only the official Ubuntu archive for this step; the hosted
          # image's Azure mirror can stall otherwise bounded provisioning.
          [[ "${ImageOS:-}" == ubuntu24 ]]
          [[ "$(dpkg --print-architecture)" == amd64 ]]
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # APT resolves the disabled sourceparts value below to /etc/apt/-.
          test ! -d /etc/apt/-
          apt_sources="$(mktemp --tmpdir="$RUNNER_TEMP" --suffix=.sources morpheus-apt-XXXXXXXXXX)"
          trap 'rm -f -- "$apt_sources"' EXIT
          cat > "$apt_sources" <<'MORPHEUS_UBUNTU_SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MORPHEUS_UBUNTU_SOURCES
          chmod 0644 "$apt_sources"
          # Keep all three invocations noninteractive and bounded; no global
          # source files or package verification settings are changed.
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=-)
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" update < /dev/null
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr < /dev/null
          # Ubuntu 24.04 Chromium dependencies from pinned Playwright 1.62.1.
          # Install before the peer drops privileges inside its PID namespace.
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf < /dev/null
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check formatting before native compilation
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          cache-on-failure: true
          save-if: false
      - name: Prepare the pinned owned native PipeWire client
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_linux_native.py --variant native \
            --prefix "$RUNNER_TEMP/morpheus-native-pipewire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Sequential controlled source-built baseline and renewal with one native binary
        timeout-minutes: 300
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import hashlib, json, os, pathlib, re, stat, sys, tempfile, types
          root = pathlib.Path.cwd()
          source = (root / 'scripts/sender_proposal_tools.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '8a249395957208e2876a3c55826bf1c427257e33fdc98a0ab444731ea0f18be0'
          tools = types.ModuleType('reviewed_sender_tools')
          exec(compile(source, 'reviewed_sender_tools', 'exec'), tools.__dict__)
          sys.path.insert(0, str(root / 'scripts'))
          from run_element_acceptance import native_executable, CHECKS
          from modified_sender_peer import unique_object
          # Isolated Python excludes script-directory imports. Add only this
          # fully source-verified checkout's fixed scripts directory; keep -I.
          bootstrap = (
              "import pathlib,runpy,sys;directory=pathlib.Path(" + repr(str(root / 'scripts')) + ");"
              "assert directory.is_absolute() and directory.resolve(strict=True)==directory;"
              "entry=pathlib.Path(sys.argv[1]);"
              "assert entry.parent==directory and entry.name in ('run_matrix_acceptance.py','local_matrix_env.py');"
              "assert entry.is_file() and not entry.is_symlink();"
              "sys.path.insert(0,str(directory));sys.argv=sys.argv[1:];"
              "runpy.run_path(str(entry),run_name='__main__')"
          )
          assert len(CHECKS) == 24
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted' and os.environ['RUNNER_OS'] == 'Linux'
          assert os.environ['RUNNER_ARCH'] == 'X64'
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          scanner = temp / 'gitleaks/gitleaks'
          assert hashlib.sha256(tools.regular(scanner, 64 * 1024 * 1024)).hexdigest() == '88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509'
          logs = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-controlled44-pair-logs-', dir=temp))
          os.chmod(logs, 0o700)
          tools.write(logs / 'scanner.toml', b'[extend]\nuseDefault = true\n')
          tools.write(logs / 'scanner.ignore', b'')
          keys = ('PATH', 'HOME', 'RUNNER_TEMP', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'ImageOS',
                  'GITHUB_ACTIONS', 'GITHUB_REPOSITORY', 'GITHUB_ACTOR', 'GITHUB_TRIGGERING_ACTOR',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'CARGO_HOME', 'RUSTUP_HOME', 'RUSTUP_TOOLCHAIN',
                  'CARGO_BUILD_JOBS', 'CARGO_INCREMENTAL', 'CARGO_PROFILE_DEV_DEBUG', 'CARGO_PROFILE_TEST_DEBUG',
                  'MORPHEUS_PIPEWIRE_CLIENT_VARIANT', 'MORPHEUS_PIPEWIRE_CLIENT_RECEIPT')
          env = {key: os.environ[key] for key in keys if key in os.environ}
          env.update(CI='true', TZ='UTC', LANG='C.UTF-8', RUST_BACKTRACE='0')
          # One actual native compile. Each unchanged acceptance helper subsequently runs
          # its normal Cargo --no-run artifact query against the same warm target directory.
          # No native-binary override or bypass is added; verify identical bytes after both.
          tools.checked_command('native_binary', ['cargo', 'test', '--locked', '-p', 'morpheus-rtc',
              '--features', 'native-devices', '--test', 'element_call_peer', '--no-run', '--message-format=json'],
              root, env, logs, scanner, 1500)
          binary = native_executable((logs / 'native_binary/job.log').read_text())
          binary_sha = hashlib.sha256(tools.regular(binary, 512 * 1024 * 1024)).hexdigest()
          roots = {}
          receipts = {}
          for variant in ('baseline44', 'renewal44'):
              peer = temp / ('morpheus-modified-sender-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + variant)
              assert not peer.exists()
              tools.checked_command('build_' + variant, [sys.executable, '-I', '-B',
                  str(root / 'scripts/build_modified_sender_peer.py'), '--root', str(peer),
                  '--scanner', str(scanner), '--variant', variant], root, env, logs, scanner, 3900)
              lines = (logs / ('build_' + variant) / 'job.log').read_text().splitlines()
              result = json.loads(lines[-1], object_pairs_hook=unique_object)
              assert set(result) == {'classification', 'variant', 'manifest_sha256', 'official_stock_acceptance', 'beta_ready'}
              assert result['classification'] == 'MODIFIED_PEER' and result['variant'] == variant
              assert result['official_stock_acceptance'] is False and result['beta_ready'] is False
              digest = result['manifest_sha256']
              assert isinstance(digest, str) and re.fullmatch('[0-9a-f]{64}', digest)
              raw = tools.regular(peer / 'element-interop/modified-peer/build-receipt.json', 2 * 1024 * 1024)
              assert hashlib.sha256(raw).hexdigest() == digest
              roots[variant] = peer
              receipts[variant] = digest
              print(json.dumps({'controlled_peer_build': variant, 'receipt_sha256': digest,
                                'stock_interop': False, 'beta_ready': False}), flush=True)
          
          cleanup = ('local_matrix_rtc-down', 'local_matrix_env-down',
                     'verify-fixture-container-cleanup', 'verify-fixture-network-cleanup')
          initial = {name: True for name in ('browser_audio', 'browser_identity', 'browser_presynced',
              'browser_roster', 'browser_video', 'native_audio', 'native_presynced_baseline',
              'native_roster', 'native_video', 'official_image')}
          roster = {name: True for name in ('alice_available', 'alice_count_is_3', 'alice_exactly_one_alice',
              'alice_exactly_one_bob', 'alice_exactly_one_carol', 'carol_available', 'carol_exactly_one_alice',
              'carol_exactly_one_carol')}
          roster.update(carol_count_is_3=False, carol_exactly_one_bob=False)
          for variant in ('baseline44', 'renewal44'):
              label = 'case_' + variant
              failed = False
              try:
                  tools.checked_command(label, ['dbus-run-session', '--', sys.executable, '-I', '-B', '-c', bootstrap,
                      str(root / 'scripts/run_matrix_acceptance.py'), '--gitleaks', str(scanner),
                      '--suite', 'element-interop', '--modified-sender-root', str(roots[variant]),
                      '--modified-sender-manifest-sha256', receipts[variant], '--modified-sender-variant', variant],
                      root, env, logs, scanner, 3300)
              except RuntimeError:
                  failed = True
              # checked_command scans the complete bounded log before producing its report.
              # A deadline/setup/scanner/cleanup failure cannot satisfy these exact predicates.
              report = tools.regular(logs / (label + '-scan.json'), 1024 * 1024)
              assert json.loads(report, object_pairs_hook=unique_object) == []
              text = tools.regular(logs / label / 'job.log', 8 * 1024 * 1024).decode('utf-8', errors='replace')
              records = []
              for line in text.splitlines():
                  if line.startswith('{'):
                      item = json.loads(line, object_pairs_hook=unique_object)
                      assert type(item) is dict
                      records.append(item)
              for name in cleanup:
                  matches = [item for item in records if item.get('check') == name]
                  assert len(matches) == 1 and matches[0].get('status') == 'passed'
              matches = [item for item in records if item.get('check') == 'MODIFIED_PEER-controlled-sdk44']
              assert len(matches) == 1
              record = matches[0]
              assert record.get('classification') == 'MODIFIED_PEER'
              assert record.get('modified_sender_variant') == variant
              assert record.get('modified_sender_manifest_sha256') == receipts[variant]
              assert record.get('official_stock_acceptance') is False and record.get('beta_ready') is False
              assert 'element_checks' not in record
              if variant == 'baseline44':
                  assert failed and record.get('modified_peer_checks') == initial
                  assert record.get('element_diagnostics') == {'stage': 'browser_group_roster',
                      'failure': 'native_acceptance', 'group_roster': roster, 'native_stage': 'group_roster',
                      'native_reason': 'group_roster_convergence', 'native_exit': 'exit_nonzero'}
              else:
                  assert not failed and record.get('status') == 'passed'
                  assert record.get('modified_peer_checks') == {name: True for name in CHECKS}
              assert hashlib.sha256(tools.regular(binary, 512 * 1024 * 1024)).hexdigest() == binary_sha
              # The normal helper retains fresh synthetic volumes. Use its existing
              # destroy command for only this explicitly empty-before-start hosted case,
              # preserving diagnostic logs and avoiding account/key reuse by the next case.
              destroy_env = env | {'MORPHEUS_MATRIX_TEST_HOME': str(roots[variant])}
              tools.checked_command('destroy_' + variant, [sys.executable, '-I', '-B', '-c', bootstrap,
                  str(root / 'scripts/local_matrix_env.py'), 'destroy'], root, destroy_env, logs, scanner, 120)
              tools.checked_command('volumes_absent_' + variant,
                  ['docker', 'volume', 'ls', '--format', '{{.Name}}'], root, env, logs, scanner, 30)
              volumes = (logs / ('volumes_absent_' + variant) / 'job.log').read_text().splitlines()
              assert not set(volumes).intersection(('morpheus-synapse-a-data', 'morpheus-synapse-b-data'))
              print(json.dumps({'controlled_case': variant, 'native_binary_sha256': binary_sha,
                  'baseline_failure_reproduced': variant == 'baseline44',
                  'renewal_all24_passed': variant == 'renewal44', 'stock_interop': False, 'beta_ready': False}), flush=True)
          print('CONTROLLED_PAIR_RESULT baseline_failure_reproduced=true renewal_all24_passed=true stock_interop=false beta_ready=false', flush=True)
