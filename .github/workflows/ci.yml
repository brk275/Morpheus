name: Call rejoin source formatting
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: call-rejoin-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  formatting:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.event.repository.visibility == 'public' &&
      github.actor == 'brk275' &&
      github.ref == 'refs/heads/codex/native-call-rejoin-format-pass-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9422ae383075c4343071b1f6510c9220834781b6
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Check exact reviewed source formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9422ae383075c4343071b1f6510c9220834781b6'
          cargo fmt --all -- --check
          cargo fmt --manifest-path vendor/cpal/Cargo.toml -- --check
