# TEMPORARY focused diagnostic. NEVER MERGE this workflow.
# Compiled/tested source is pinned below; this does not close full release gates.
name: Focused draft persistence diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focused-drafts-185099b
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  helpers:
    name: Reviewed source and helper contracts
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/drafts-preflight-185099b' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 185099bf171611eb2de10bee823abdecf8fc14b4
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 185099bf171611eb2de10bee823abdecf8fc14b4
      - name: Install independently pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan source history before execution
        shell: bash
        run: |
          set -euo pipefail
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" \
            --log-opts=--all .
      - name: Check reviewed helper contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          node --check scripts/element_call_peer.mjs
          node --check scripts/element_call_stock_peer.mjs
          python3 scripts/package.py --check
  recovery:
    name: Focused Linux draft recovery
    needs: helpers
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/drafts-preflight-185099b' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 185099bf171611eb2de10bee823abdecf8fc14b4
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 185099bf171611eb2de10bee823abdecf8fc14b4
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install independently pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Run only affected integration fixtures and their prerequisite
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py \
            --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --suite drafts-only
