          def regular_bytes(path, limit):
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_size > limit or getattr(before, 'st_file_attributes', 0) & 1024:
                  raise ValueError('unsafe_regular_file')
              flags = os.O_RDONLY | getattr(os, 'O_BINARY', 0) | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_NONBLOCK', 0) | getattr(os, 'O_CLOEXEC', 0)
              descriptor = os.open(path, flags)
              with os.fdopen(descriptor, 'rb') as stream:
                  opened = os.fstat(stream.fileno())
                  if not stat.S_ISREG(opened.st_mode) or (opened.st_dev, opened.st_ino) != (before.st_dev, before.st_ino) or getattr(opened, 'st_file_attributes', 0) & 1024:
                      raise ValueError('changed_regular_file')
                  data = stream.read(limit + 1)
                  after = os.fstat(stream.fileno())
                  if len(data) > limit or len(data) != after.st_size or (opened.st_size, opened.st_mtime_ns) != (after.st_size, after.st_mtime_ns):
                      raise ValueError('changed_regular_file')
                  return data

          def bounded(args, name, seconds, limit=64 * 1024 * 1024, cwd=None):
              directory = logs / name
