# TEMPORARY helper-only validation. NEVER MERGE this workflow.
name: Reviewed package source pinning contracts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-source-preflight-r2
  cancel-in-progress: false
jobs:
  helpers:
    name: Source identity and helper contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.ref == 'refs/heads/codex/package-source-preflight-r2' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a93d9065511a67d0ecfdd89c9eb38e5278834a67
          fetch-depth: 0
          persist-credentials: false
      - name: Independently scan reviewed source history before execution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/scanner" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/scanner/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" \
            --log-opts=--all .
      - name: Verify real immutable source checkout
        env:
          MORPHEUS_PACKAGE_SOURCE_REVISION: a93d9065511a67d0ecfdd89c9eb38e5278834a67
        run: python3 scripts/package_revision.py --verify-checkout .
      - name: Exercise candidate scope against the actual workflow context
        id: pin
        env:
          PACKAGE_SOURCE_REVISION: a93d9065511a67d0ecfdd89c9eb38e5278834a67
          PACKAGE_PLATFORM: linux
          LINUX_FORMATS: appimage
          APPIMAGE_UPDATES: "false"
          APPIMAGE_CAPTURE: "false"
        run: python3 scripts/package_scope.py
      - name: Reject candidate cache writes in the real workflow context
        env:
          SELECTED_SOURCE: ${{ steps.pin.outputs.source_revision }}
          CACHE_WRITE: ${{ steps.pin.outputs.cache_write }}
          MATRIX: ${{ steps.pin.outputs.matrix }}
        shell: bash
        run: |
          python3 -I -B - <<'PY_SOURCE_PROOF'
          import json, os
          assert os.environ["SELECTED_SOURCE"] == "a93d9065511a67d0ecfdd89c9eb38e5278834a67"
          assert os.environ["CACHE_WRITE"] == "false"
          assert json.loads(os.environ["MATRIX"]) == {"include": [{"os": "ubuntu-24.04", "label": "linux-x64", "formats": "appimage"}]}
          PY_SOURCE_PROOF
      - name: Run all reviewed helper contracts without native builds
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          node --check scripts/element_call_peer.mjs
          node --check scripts/element_call_stock_peer.mjs
          python3 scripts/package.py --check
