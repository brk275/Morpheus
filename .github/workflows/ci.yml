# TEMPORARY owner-selected preflight. NEVER MERGE into main.
# No native/platform/live release gate is satisfied by this run.
name: Desktop geometry preflight - native gates remain open

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Security and change scope
    # Hosted validation is disabled while private to prevent unauthorized paid builds.
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/desktop-preflight-00a772d' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.scope.outputs.native }}
      native_matrix: ${{ steps.scope.outputs.native_matrix }}
      config: ${{ steps.scope.outputs.config }}
      wayland: ${{ steps.scope.outputs.wayland }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed validation inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR input is read as data; classification code comes from its base.
          # Push uses reviewed main; dispatch uses its owner-selected revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Never honor candidate-provided rules or suppression files. No
          # candidate code has executed on this runner before scanning.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --log-opts=--all .
      - name: Select checks from changed inputs using reviewed classifier
        id: scope
        working-directory: candidate
        # Isolated mode excludes the candidate working directory and Python
        # environment hooks from import lookup. The classifier uses stdlib only.
        run: python3 -I ../trusted/scripts/ci_scope.py --github-event

  preflight:
    name: Desktop models and generated UI (Linux only)
    needs: scope
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Restore reviewed workflow data for helper contracts
        shell: bash
        run: |
          set -euo pipefail
          git show 00a772da49beefc2073ebb4b22040f5604cce8c7:.github/workflows/ci.yml > "$RUNNER_TEMP/reviewed-ci.yml"
          echo "cb257d44f01e6d8e757e63c8abdd9f1bbb528da2f010c13316d6a8df25284c7c  $RUNNER_TEMP/reviewed-ci.yml" | sha256sum --check --status
          cp "$RUNNER_TEMP/reviewed-ci.yml" .github/workflows/ci.yml
      - name: Test affected workflow acceptance contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_acceptance.py' -v
      - name: Default desktop and Matrix native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libdbus-1-dev libfontconfig1-dev libssl-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: "false"
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Compile native interface before desktop dependencies
        run: cargo check --locked -p morpheus-ui-check
      - name: Test default desktop models and generated UI
        # No native-calls feature and no live fixture credentials. Those gates
        # require the later full platform and isolated integration run.
        run: cargo test --locked -p morpheus-app --bin morpheus-app
