# TEMPORARY focused tool-boundary diagnostic. NEVER MERGE this workflow.
name: AppImage inventory preflight
run-name: AppImage inventory 59c60a1 - no native build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-notice-preflight-59c60a1
  cancel-in-progress: false

jobs:
  inventory:
    name: Linux notice contracts and installed libraries
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 59c60a16758620d320e62140fe4a3c76d41acebc
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 59c60a16758620d320e62140fe4a3c76d41acebc
      - name: Scan history using independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" \
            --log-opts=--all .
      - name: Test inventory contracts and genuine installed notices
        shell: bash
        run: |
          timeout --kill-after=5s 120s python3 - <<'PY_INVENTORY'
          import json
          import unittest

          modules = ("scripts.tests.test_appimage_notices", "scripts.tests.test_appimage_diagnostics")
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          def case_ids(node):
              if isinstance(node, unittest.TestSuite):
                  return [name for child in node for name in case_ids(child)]
              return [node.id()]
          required = {
              "scripts.tests.test_appimage_notices.SystemReadelfTests.test_installed_readelf_wide_report_of_a_trusted_system_elf_parses",
              "scripts.tests.test_appimage_notices.SystemNoticePreflightTests.test_installed_dependency_notices_pass_the_production_inventory_steps",
          }
          planned = case_ids(suite)
          if not required <= set(planned) or len(planned) != len(set(planned)):
              raise SystemExit("The genuine tool-boundary test is missing or duplicated")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != len(planned):
              raise SystemExit("Inventory checks failed, were skipped, or did not all run")
          print(json.dumps({"check": "inventory_contracts_and_installed_notices", "status": "passed", "tests": result.testsRun, "skipped": 0}, sort_keys=True))
          PY_INVENTORY
