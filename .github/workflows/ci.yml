name: Reviewed draft recovery verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-draft-recovery-50d6e7829fa685192382cc7ea27ac78c4b72fc5c
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  history:
    name: Reviewed source history
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 50d6e7829fa685192382cc7ea27ac78c4b72fc5c
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0c829d056be7fe8bdc6ef6a0783dd22841b0036d
          path: validation
          persist-credentials: false
      - name: Verify source and reviewed scanner inputs
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50d6e7829fa685192382cc7ea27ac78c4b72fc5c"
          test "$(git rev-parse HEAD^{tree})" = "370e82038d076c8ecf19310e26a224fbefa77d57"
          echo "4acde7ed74259339d9494b5e2d52aff42e1317bbdf23400cc67bf7bf3085caef  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "446f0686722972d33a6a411b83dfc4ab30f14b9022772028491b2bd5e55fa892  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
      - name: Scan complete committed source history before execution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/reviewed-source-history"

  recovery:
    needs: history
    name: Reviewed Linux draft recovery
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 50d6e7829fa685192382cc7ea27ac78c4b72fc5c
          persist-credentials: false
      - name: Verify immutable reviewed source before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "50d6e7829fa685192382cc7ea27ac78c4b72fc5c"
          test "$(git rev-parse HEAD^{tree})" = "370e82038d076c8ecf19310e26a224fbefa77d57"
          echo "e668310df3229afbc7aa47016306863b92e96665a905fc989ef6c2e9f015298b  scripts/run_matrix_acceptance.py" | sha256sum --check --status
          echo "2c0301a7543a169424a7c386ed498746a390407052e18439827cb51230475976  scripts/tests/test_matrix_acceptance.py" | sha256sum --check --status
          echo "Reviewed draft recovery source: 50d6e7829fa685192382cc7ea27ac78c4b72fc5c tree: 370e82038d076c8ecf19310e26a224fbefa77d57"
      - name: Test the affected Matrix acceptance helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_matrix_acceptance.py' -v
      - name: Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action; pinned compiler
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Prepare the pinned owned native PipeWire client
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_linux_native.py --variant native \
            --prefix "$RUNNER_TEMP/morpheus-native-pipewire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Compile only the selected live fixtures before their runtime deadlines
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p morpheus-matrix --test drafts_local --test formatted_local --test moderation_local --no-run
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app --no-run
      - name: Test real disposable draft recovery and all twelve App recovery guards
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py \
            --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --suite draft-recovery
