# TEMPORARY patched-SDK Element diagnostic. NEVER MERGE this CI override.
# HELD: root workflow/publication/execution admission and a fresh zero-Linux-overlap check required.
name: Patched SDK real crypto diagnostic
run-name: Patched SDK sender renewal - real Element three-party crypto on fixed049
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-049b344a28920ad2778ebfd4bcf94594345b7abd-ubuntu-24.04
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Patched SDK Element real three-party crypto diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/temp-patched-sdk-element-049-v3-20261108' && github.repository == 'brk275/Morpheus' && github.repository_owner == 'brk275' && github.event.repository.private == false && github.actor == 'brk275' && github.triggering_actor == 'brk275'
    runs-on: ubuntu-24.04
    # Separate build phases precede the unchanged live acceptance clocks.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: candidate
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MORPHEUS_ELEMENT_BUILD_INPUTS_SHA256: b88bc820e2b1ce79b565a87c392eb3c52338d77018c5cf901e1fbd5499fe16df
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check out fixed reviewed scanner inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 049b344a28920ad2778ebfd4bcf94594345b7abd
          persist-credentials: false
          path: validation
      - name: Verify fixed049 and only the reviewed diagnostic overlay
        timeout-minutes: 5
        shell: /usr/bin/python3 -I -B {0}
        env:
          WORKFLOW_HEAD: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          import hashlib, json, os, pathlib, re, stat, subprocess
          SOURCE = '049b344a28920ad2778ebfd4bcf94594345b7abd'
          TREE = '8b1bdcf47712b97988c9c26bd160c6b74daff248'
          head = os.environ['WORKFLOW_HEAD']
          assert os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          assert os.environ.get('GITHUB_REF') == 'refs/heads/codex/temp-patched-sdk-element-049-v3-20261108'
          assert os.environ.get('WORKFLOW_REF') == 'brk275/Morpheus/.github/workflows/ci.yml@refs/heads/codex/temp-patched-sdk-element-049-v3-20261108'
          assert re.fullmatch('[a-f0-9]{40}', head) and head == os.environ['GITHUB_SHA'] and head != SOURCE
          assert os.getuid() == os.geteuid() != 0
          root = pathlib.Path.cwd().resolve(strict=True)
          command = ['git', '--no-pager', '--no-replace-objects', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false']
          def git(*args, cwd=root):
              value = subprocess.run(command + list(args), cwd=cwd, check=True, stdout=subprocess.PIPE,
                                     stderr=subprocess.DEVNULL, timeout=20).stdout
              assert len(value) <= 2 * 1024 * 1024
              return value
          assert git('rev-parse', 'HEAD').decode().strip() == head
          assert git('rev-list', '--parents', '-n', '1', head).decode().split() == [head, SOURCE]
          assert git('rev-parse', SOURCE + '^{tree}').decode().strip() == TREE
          assert git('rev-parse', 'HEAD', cwd=root.parent / 'validation').decode().strip() == SOURCE
          assert git('rev-parse', 'HEAD^{tree}', cwd=root.parent / 'validation').decode().strip() == TREE
          def leaves(revision):
              result = {}
              for entry in git('ls-tree', '--full-tree', '-r', '-z', revision).split(b'\0'):
                  if not entry:
                      continue
                  header, name = entry.split(b'\t', 1)
                  mode, kind, blob = header.decode().split()
                  result[name.decode()] = {'mode': mode, 'type': kind, 'sha': blob}
              return result
          expected = {'scripts/element_peer_fixture.py': {'git_blob': '458074ae23cbd0b08722a659597b7a6c6dce82a1', 'sha256': 'fd710630cd102b91acf091f7d9077175fd0d9c3408d12b6d2840949cd484e43b', 'bytes': 23802}, 'scripts/run_element_acceptance.py': {'git_blob': '3c5c85ed2a3931654f5345db27cf9da1da138abb', 'sha256': '5f10d5c271701968166bc696ac8c3a24d7c186b38154a7d41c90f15e24ddd548', 'bytes': 25430}, 'scripts/run_matrix_acceptance.py': {'git_blob': '9d1eea890984277bf9eec4e3adbd0544c3fce98d', 'sha256': '8cc62c3c677ed68031647b81062d04bbc09345bb7ebc683466ed836aefe359ee', 'bytes': 127898}, 'scripts/tests/test_element_peer_fixture.py': {'git_blob': '9bce20bd5479bd477e7446f9989d691cc2791383', 'sha256': '14aeb9d22270da748f6da661b2db737c85bfc406b69416e1abe7419a72eea391', 'bytes': 27714}, 'scripts/tests/test_element_acceptance.py': {'git_blob': '516f89091bcb64ac68b5275b8f8e6e9bb4c555b4', 'sha256': 'bc9f9d4c7729ad369404cde0c1f5ef67bddb876ceed48403d41f00c1a08f05c4', 'bytes': 24204}, 'scripts/tests/test_matrix_acceptance.py': {'git_blob': 'eb6b221b8e0553f9ca406935c40f9e3b2d0c3523', 'sha256': '9a4ded693779fcb01782098b1d0e699f5e7755abb67b6c22793c19c9b3b9cbe2', 'bytes': 251220}, 'scripts/check_sender_proposal.py': {'git_blob': '1ec4f0b8ec66a48415b947af16428e76742b1fa9', 'sha256': '8dd7bacc446a99d107b8cc841e41be7ddebc9b0f27f76e2a521bc850d368f057', 'bytes': 15362}, 'scripts/build_patched_element_peer.py': {'git_blob': '55e19ac4b7f59f2db3ecffc1ebc8dd02aeedd9a9', 'sha256': '05b708c2544ff868c70984a488cef117fb13dbb4de2aaaf78e478231241e3ca9', 'bytes': 25364}, 'scripts/patched-sdk-production.patch': {'git_blob': '63aa115c06fb21eebcd5dc5d258caf15ed5be958', 'sha256': 'ff0adceb780806c43f11a5831b69372c6342242c043a21986e0e70d34ee1c6e5', 'bytes': 23779}, 'scripts/patched-element-build-inputs.json': {'git_blob': '7cd6712177fabd58ed1c948f5b23a3c6af5aabd2', 'sha256': 'b88bc820e2b1ce79b565a87c392eb3c52338d77018c5cf901e1fbd5499fe16df', 'bytes': 532716}}
          before, after = leaves(SOURCE), leaves(head)
          assert len(before) == 2459 and len(after) == 2463
          assert {name for name in set(before) | set(after) if before.get(name) != after.get(name)} == set(expected) | {'.github/workflows/ci.yml'}
          assert after['.github/workflows/ci.yml']['mode'] == '100644' and after['.github/workflows/ci.yml']['type'] == 'blob'
          for name, fact in expected.items():
              assert after[name] == {'mode': '100644', 'type': 'blob', 'sha': fact['git_blob']}
              path = root / name
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and info.st_nlink == 1 and not info.st_mode & 0o022
              body = path.read_bytes()
              assert len(body) == fact['bytes'] and hashlib.sha256(body).hexdigest() == fact['sha256']
          inputs = json.loads((root / 'scripts/patched-element-build-inputs.json').read_bytes())
          assert inputs['source_review_clear'] is True and inputs['execution_admitted'] is True
          assert hashlib.sha256((root / 'scripts/patched-element-build-inputs.json').read_bytes()).hexdigest() == os.environ['MORPHEUS_ELEMENT_BUILD_INPUTS_SHA256']
          print(json.dumps({'actual_event': 'workflow_dispatch', 'workflow_head': head,
              'fixed_native_source': SOURCE, 'fixed_native_tree': TREE, 'reviewed_overlay_files': 10,
              'diagnostic_only': True, 'stock_interoperability': False}, sort_keys=True))
      - name: Scan source history before any diagnostic helper execution
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/octet-stream' --max-filesize 8230402 \
            --connect-timeout 30 --max-time 120 \
            https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "dcd5d9a2dfafaf50adb63f294eba982778b67dade562def4e0e32bf38941285c  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "f4fb315687debe13e9e44dd4321196406592637b199f7d129a35b62586b052c3  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/patched-sdk-history-scan"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          # Use only the official Ubuntu archive for this step; the hosted
          # image's Azure mirror can stall otherwise bounded provisioning.
          [[ "${ImageOS:-}" == ubuntu24 ]]
          [[ "$(dpkg --print-architecture)" == amd64 ]]
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # APT resolves the disabled sourceparts value below to /etc/apt/-.
          test ! -d /etc/apt/-
          apt_sources="$(mktemp --tmpdir="$RUNNER_TEMP" --suffix=.sources morpheus-apt-XXXXXXXXXX)"
          trap 'rm -f -- "$apt_sources"' EXIT
          cat > "$apt_sources" <<'MORPHEUS_UBUNTU_SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          MORPHEUS_UBUNTU_SOURCES
          chmod 0644 "$apt_sources"
          # Keep all three invocations noninteractive and bounded; no global
          # source files or package verification settings are changed.
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=-)
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" update < /dev/null
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool \
            dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin \
            sway swaybg pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr < /dev/null
          # Ubuntu 24.04 Chromium dependencies from pinned Playwright 1.62.1.
          # Install before the peer drops privileges inside its PID namespace.
          sudo -n env DEBIAN_FRONTEND=noninteractive APT_LISTCHANGES_FRONTEND=none apt-get "${apt_options[@]}" install -y \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf < /dev/null
      - name: Harden the reviewed hosted notice trees before helper imports
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          git show --no-ext-diff --no-textconv 049b344a28920ad2778ebfd4bcf94594345b7abd:scripts/harden_linux_notice_host.py | \
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS /usr/bin/python3 -I -B -
      - name: Run only the affected existing diagnostic helper contracts
        timeout-minutes: 15
        shell: /usr/bin/python3 -I -B {0}
        run: |
          import pathlib, sys, unittest
          root = pathlib.Path.cwd().resolve(strict=True)
          sys.path[:0] = [str(root), str(root / 'scripts')]
          unittest.main(module=None, argv=['unittest', '-v',
              'scripts.tests.test_element_peer_fixture',
              'scripts.tests.test_element_acceptance',
              'scripts.tests.test_matrix_acceptance'])
      - name: Build exact Element source with only the reviewed two SDK production changes
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B scripts/build_patched_element_peer.py \
            --inputs scripts/patched-element-build-inputs.json --patch scripts/patched-sdk-production.patch \
            --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --receipt-path-file "$RUNNER_TEMP/patched-sdk-asset-receipt-path.txt"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
          workspaces: candidate
      - name: Prepare fixed049 owned native PipeWire client
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_linux_native.py --variant native \
            --prefix "$RUNNER_TEMP/morpheus-patched-native-client-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Compile the unchanged native three-party target before live fixture clocks
        timeout-minutes: 90
        run: cargo test --locked -p morpheus-rtc --features native-devices --test element_call_peer --no-run --message-format=json
      - name: Exercise the existing real three-party crypto case with the explicitly patched frontend
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dbus-run-session -- python3 -I -B - <<'PY_PATCHED_CASE'
          import hashlib, json, os, pathlib, stat, sys, tempfile
          root = pathlib.Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(root / 'scripts'))
          from element_peer_fixture import patched_sdk_assets
          record = pathlib.Path(os.environ['RUNNER_TEMP']) / 'patched-sdk-asset-receipt-path.txt'
          info = record.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and info.st_nlink == 1
          assert not info.st_mode & 0o077 and info.st_size <= 4096
          lines = record.read_text().splitlines()
          assert len(lines) == 2
          receipt, receipt_sha = pathlib.Path(lines[0]), lines[1]
          assets, facts = patched_sdk_assets(receipt, receipt_sha)
          assert facts['build_inputs_sha256'] == os.environ['MORPHEUS_ELEMENT_BUILD_INPUTS_SHA256']
          private_home = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-patched-sdk-case-home-', dir=os.environ['RUNNER_TEMP']))
          private_home.chmod(0o700)
          # Keep the unchanged harness, but never pass runner API/upload/token or
          # inherited Node/Babel/plugin overrides to the browser/native fixture.
          names = ('PATH', 'LANG', 'LC_ALL', 'RUNNER_TEMP', 'CARGO_HOME', 'RUSTUP_HOME', 'RUSTUP_TOOLCHAIN',
                   'CARGO_BUILD_JOBS', 'CARGO_INCREMENTAL', 'CARGO_PROFILE_DEV_DEBUG', 'CARGO_PROFILE_TEST_DEBUG',
                   'GITHUB_ACTIONS', 'RUNNER_ENVIRONMENT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS',
                   'GITHUB_REPOSITORY', 'DBUS_SESSION_BUS_ADDRESS',
                   'MORPHEUS_PIPEWIRE_CLIENT_VARIANT', 'MORPHEUS_PIPEWIRE_CLIENT_RECEIPT')
          environment = {name: os.environ[name] for name in names if name in os.environ}
          environment.update(HOME=str(private_home), XDG_CONFIG_HOME=str(private_home / 'config'),
                             XDG_CACHE_HOME=str(private_home / 'cache'), XDG_DATA_HOME=str(private_home / 'data'))
          # Isolated Python removes the script dir, so bootstrap only this exact
          # reviewed checkout before the existing entrypoint; no user site/PYTHONPATH.
          code = 'import runpy,sys;sys.path[:0]=[' + repr(str(root / 'scripts')) + ',' + repr(str(root)) + '];runpy.run_path(' + repr(str(root / 'scripts/run_matrix_acceptance.py')) + ',run_name="__main__")'
          arguments = [sys.executable, '-I', '-B', '-c', code,
              '--gitleaks', os.environ['RUNNER_TEMP'] + '/gitleaks/gitleaks', '--suite', 'patched-sdk-element',
              '--patched-sdk-receipt', str(receipt), '--patched-sdk-receipt-sha256', receipt_sha]
          os.execve(sys.executable, arguments, environment)
          PY_PATCHED_CASE
      - name: Record the strictly limited diagnostic outcome
        shell: bash
        run: |
          printf '%s\n' 'PATCHED_SDK_ELEMENT_REAL_CRYPTO_DIAGNOSTIC_PASSED stock_interoperability=false official_application_assets=false beta_ready=false'
