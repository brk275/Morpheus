                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              if not scan_captured(result, name):
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'private_log_scan_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              output = result['captured'].decode('utf-8', errors='replace')
              passed = result['reason'] is None and result['code'] == 0
              # Existing reviewed full-unit accounting, including interleaved CLI stdout.
              names = re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\.', output, re.MULTILINE)
              seen = set(names)
              failures = set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$', output, re.MULTILINE))
              ignored = set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ignored', output, re.MULTILINE))
              summaries = re.findall(r'^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;', output, re.MULTILINE)
              complete = len(summaries) == 1 and len(names) == len(seen)
              a = b = c = None
              if complete:
                  status, a, b, c = summaries[0]; a, b, c = map(int, (a, b, c))
                  complete = (len(seen) == a + b + c and len(failures) == b and len(ignored) == c
                      and failures <= seen and ignored <= seen and not failures & ignored)
              okay = seen - failures - ignored if complete else set()
              passed = (passed and complete and summaries[0][0] == 'ok' and a > 0 and b == 0
                  and ignored == allowed_ignored and required <= okay)
              record = {'check': name, 'status': 'passed' if passed else 'failed', 'reason': result['reason'],
                  'source': source, 'exit_code': result['code'], 'log_bytes': result['bytes'],
                  'complete_test_accounting': complete, 'tests_passed': a, 'tests_failed': b, 'tests_ignored': c,
                  'required_tests': {fixed: fixed in okay for fixed in sorted(required)},
                  'known_failed_tests': sorted(failures & (required_config | {ui_test})),
                  'other_failed_test_count': len(failures - (required_config | {ui_test})),
                  'raw_logs_public': False, 'real_accounts': False, 'physical_devices': False,
                  'installed_app': False, 'packages_uploaded': False, 'diagnostic_never_merge': True}
              if name == 'app_unit_controller' and not passed:
                  record['recovery_geometry'] = recovery_geometry(output)
              print(json.dumps(record, sort_keys=True), flush=True)
              all_passed = all_passed and passed
          if not all_passed: raise SystemExit(1)
