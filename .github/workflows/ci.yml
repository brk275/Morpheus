                          os.close(write_fd)
                          write_fd = None

                          def reader():
                              try:
                                  while not stop.is_set():
                                      block = os.read(child.stdout.fileno(), 65536)
                                      while not stop.is_set():
                                          try:
                                              blocks.put(block, timeout=0.2)
                                              break
                                          except queue.Full:
                                              pass
                                      if not block:
                                          return
                              except OSError:
                                  if not stop.is_set():
                                      errors.append(True)

                          def read_status():
                              try:
                                  data = b''
                                  while len(data) <= 32 and (not data.endswith(b'\n')):
                                      block = os.read(read_fd, 33 - len(data))
                                      if not block:
                                          break
                                      data += block
                                  status.put(int(data) if re.fullmatch(b'-?[0-9]{1,10}\\n', data) else None)
                              except (OSError, ValueError):
                                  status.put(None)
                          threads = [threading.Thread(target=reader, daemon=True), threading.Thread(target=read_status, daemon=True)]
                          for thread in threads:
