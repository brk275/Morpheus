# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: Native macOS AX empty-child checks
run-name: Native AX declared-empty children - boundary and owned tree
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-ax-empty-checks
  cancel-in-progress: false
jobs:
  security:
    name: Independent probe source scan
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = ${{ github.sha }}
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
  probe:
    name: Native AX child reads (${{ matrix.os }})
    needs: security
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify native probe checkout
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Verify the exact independent native scanner
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64; expected=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            X64) arch=x64; expected=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/scanner.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_${arch}.tar.gz" --output "$archive"
          echo "$expected  $archive" | shasum -a 256 --check --status
          mkdir "$RUNNER_TEMP/scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/scanner" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
      - name: Read only the owned synthetic native tree
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          AX_PROBE_SCANNER="$RUNNER_TEMP/scanner/gitleaks" \
          AX_PROBE_CONFIG="$RUNNER_TEMP/default.toml" \
          AX_PROBE_IGNORE="$RUNNER_TEMP/empty.ignore" \
            python3 -I -B .probe/macos_ax_children.py
      # Only synthetic AppKit subject + bridge; no Morpheus/Cargo build, accounts, input, permission prompts or uploads.
