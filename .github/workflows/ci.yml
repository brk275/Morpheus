              cleaned = False
              cleanup_ok = False
              read_fd, write_fd = os.pipe()
              child = None
              threads = []
              kwargs = {'start_new_session': True, 'pass_fds': (write_fd,)}
              status_arg = write_fd

              def cleanup():
                  nonlocal cleaned, cleanup_ok
                  if cleaned:
                      return
                  cleaned = True
                  if child is not None:
                      try:
                          os.killpg(child.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                  cleanup_ok = True
