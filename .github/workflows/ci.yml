# TEMPORARY narrowly scoped shared-native verification. NEVER MERGE this workflow.
# No package, installed UI, Wayland, physical device, live-account or artifact jobs.
name: Reviewed beta four-platform native checks
run-name: Attachment affected checks - adccb7a - ${{ inputs.platform }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select only affected native platforms
        type: choice
        required: true
        default: pending-platforms
        options: [pending-platforms, macos-arm64, macos-intel, windows]
permissions:
  contents: read
concurrency:
  group: beta-native-adccb7a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Native ${{ matrix.name }}
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && contains(fromJSON('["pending-platforms","macos-arm64","macos-intel","windows"]'), inputs.platform)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'macos-arm64' && '{"include":[{"name":"macOS ARM64","runner":"macos-15","os":"macOS","arch":"ARM64"}]}' || inputs.platform == 'macos-intel' && '{"include":[{"name":"macOS Intel","runner":"macos-15-intel","os":"macOS","arch":"X64"}]}' || inputs.platform == 'windows' && '{"include":[{"name":"Windows x64","runner":"windows-2025","os":"Windows","arch":"X64"}]}' || '{"include":[{"name":"macOS ARM64","runner":"macos-15","os":"macOS","arch":"ARM64"},{"name":"macOS Intel","runner":"macos-15-intel","os":"macOS","arch":"X64"},{"name":"Windows x64","runner":"windows-2025","os":"Windows","arch":"X64"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MORPHEUS_EXPECTED_OS: ${{ matrix.os }}
      MORPHEUS_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: adccb7ac9aa9fc4a8b6e2b15c53cf1d105387f7e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and scan Git history before candidate execution
        timeout-minutes: 10
        shell: python
        run: |
          import hashlib, json, os, pathlib, queue, re, signal, subprocess, tempfile, threading, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert (os.environ.get('RUNNER_OS'),os.environ.get('RUNNER_ARCH')) == (
              os.environ['MORPHEUS_EXPECTED_OS'],os.environ['MORPHEUS_EXPECTED_ARCH'])
          os.umask(0o077)
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/'morpheus-native-private'
          private.mkdir(mode=0o700,exist_ok=True)
          logs=private/'logs'; logs.mkdir(mode=0o700,exist_ok=True)
          # Only compilation/runtime essentials. No GITHUB_TOKEN, ACTIONS tokens, inherited
          # credentials, personal accounts, signing identities, or release environment.
          names=('PATH','HOME','USERPROFILE','HOMEDRIVE','HOMEPATH','SYSTEMROOT','SystemRoot',
              'WINDIR','COMSPEC','PATHEXT','TEMP','TMP','TMPDIR','LANG','LC_ALL',
              'ProgramFiles','ProgramFiles(x86)','ProgramW6432','ALLUSERSPROFILE',
              'LOCALAPPDATA','APPDATA','VCToolsInstallDir','VCINSTALLDIR','VSINSTALLDIR',
              'WindowsSdkDir','WindowsSDKVersion','INCLUDE','LIB','LIBPATH','LIBCLANG_PATH',
              'CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN','PKG_CONFIG_PATH',
              'LD_LIBRARY_PATH','DYLD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR',
              'SDKROOT','DEVELOPER_DIR','MACOSX_DEPLOYMENT_TARGET',
              'CARGO_BUILD_JOBS','CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG',
              'CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR','SLINT_EMIT_DEBUG_INFO',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','RUNNER_ARCH','ImageOS',
              'RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment={name:os.environ[name] for name in names if name in os.environ}
          environment['GIT_CONFIG_GLOBAL']=os.devnull
          environment['GIT_CONFIG_NOSYSTEM']='1'
          environment['GIT_TERMINAL_PROMPT']='0'
          def bounded(args, name, seconds, limit=64*1024*1024):
              directory=logs/name; directory.mkdir(mode=0o700)
              log=directory/'output.log'
              # A bounded queue works with anonymous pipes on Windows as well as POSIX;
              # never use unbounded communicate() or a terminal-only size check.
              blocks=queue.Queue(maxsize=8)
              stop=threading.Event()
              error=[]
              kwargs={'start_new_session':True} if os.name!='nt' else {
                  'creationflags':subprocess.CREATE_NEW_PROCESS_GROUP}
              child=subprocess.Popen(args,cwd=workspace,stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env=environment,**kwargs)
              def reader():
                  try:
                      while not stop.is_set():
                          block=os.read(child.stdout.fileno(),65536)
                          while not stop.is_set():
                              try: blocks.put(block,timeout=0.2); break
                              except queue.Full: pass
                          if not block: return
                  except OSError:
                      error.append(True)
              thread=threading.Thread(target=reader,daemon=True); thread.start()
              deadline=time.monotonic()+seconds
              reason=None; size=0; code=None
              with log.open('xb') as output:
                  try:
                      while True:
                          remaining=deadline-time.monotonic()
                          if remaining<=0: reason='deadline'; break
                          try: block=blocks.get(timeout=min(0.2,remaining))
                          except queue.Empty:
                              if not thread.is_alive(): reason='process_error'; break
                              continue
                          if not block: break
                          size+=len(block)
                          if size>limit: reason='output_limit'; break
                          output.write(block)
                      if reason is None:
                          code=child.wait(timeout=min(10,max(0.01,deadline-time.monotonic())))
                  except (OSError,subprocess.SubprocessError):
                      reason='process_error'
                  finally:
                      stop.set()
                      # Keep the direct child unreaped until process-tree termination.
                      # Even EOF can precede exit; do not signal a recycled PID/group.
                      if child.returncode is None:
                          if os.name=='nt':
                              try:
                                  subprocess.run(['taskkill','/PID',str(child.pid),'/T','/F'],
                                      stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,
                                      stderr=subprocess.DEVNULL,env=environment,timeout=10,check=False)
                              except (OSError,subprocess.SubprocessError):
                                  reason=reason or 'process_error'
                              if child.poll() is None: child.kill()
                          else:
                              try: os.killpg(child.pid,signal.SIGKILL)
                              except ProcessLookupError: pass
                          try: child.wait(timeout=10)
                          except subprocess.SubprocessError: reason=reason or 'process_error'
                      thread.join(timeout=2)
                      if thread.is_alive(): reason=reason or 'process_error'
                      child.stdout.close()
              # Validate the persisted limit even when a very fast child has exited.
              if error: reason=reason or 'process_error'
              if log.stat().st_size>limit: reason='output_limit'
              return {'code':code,'reason':reason,'bytes':log.stat().st_size,'log':log}

          import io, tarfile, urllib.request, zipfile
          source='adccb7ac9aa9fc4a8b6e2b15c53cf1d105387f7e'
          identity=bounded(['git','rev-parse','HEAD'],'source-identity',15,4096)
          if identity['reason'] or identity['code']!=0 or identity['log'].read_text(encoding='utf-8').strip()!=source:
              print(json.dumps({'check':'reviewed_source','status':'failed'})); raise SystemExit(1)
          archives={
              ('Linux','X64'):('linux_x64.tar.gz','551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'),
              ('macOS','ARM64'):('darwin_arm64.tar.gz','b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'),
              ('macOS','X64'):('darwin_x64.tar.gz','dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709'),
              ('Windows','X64'):('windows_x64.zip','d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'),
          }
          archive,digest=archives[(os.environ['RUNNER_OS'],os.environ['RUNNER_ARCH'])]
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_'+archive
          try:
              data=bytearray(); deadline=time.monotonic()+180
              with urllib.request.urlopen(url,timeout=30) as response:
                  while True:
                      chunk=response.read(65536)
                      if not chunk: break
                      data.extend(chunk)
                      if len(data)>32*1024*1024 or time.monotonic()>deadline: raise ValueError()
              if hashlib.sha256(data).hexdigest()!=digest: raise ValueError()
              with (private/'verified-scanner-archive').open('xb') as saved: saved.write(data)
              executable='gitleaks.exe' if os.name=='nt' else 'gitleaks'
              if archive.endswith('.zip'):
                  with zipfile.ZipFile(io.BytesIO(data)) as packaged:
                      member=packaged.getinfo(executable)
                      if member.file_size>64*1024*1024: raise ValueError()
                      binary=packaged.read(member)
              else:
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as packaged:
                      member=packaged.getmember(executable)
                      if not member.isfile() or member.size>64*1024*1024: raise ValueError()
                      binary=packaged.extractfile(member).read(64*1024*1024+1)
              if not binary or len(binary)>64*1024*1024: raise ValueError()
              scanner=private/executable
              with scanner.open('xb') as output: output.write(binary)
              scanner.chmod(0o700)
          except Exception:
              print(json.dumps({'check':'verified_scanner_bootstrap','status':'failed'})); raise SystemExit(1)
          config=private/'default.toml'; config.write_bytes(b'[extend]\nuseDefault = true\n')
          ignore=private/'empty.ignore'; ignore.write_bytes(b'')
          report=private/'source-scan.json'
          scan=bounded([str(scanner),'git','--redact=100','--ignore-gitleaks-allow','--no-banner',
              '--max-target-megabytes','0','--config',str(config),'--gitleaks-ignore-path',str(ignore),
              '--log-opts=HEAD','--report-format','json','--report-path',str(report),str(workspace)],
              'source-scan',240,8*1024*1024)
          # Source reports/logs stay private. Never print findings or contributor content.
          try:
              findings=json.loads(report.read_text(encoding='utf-8')) if report.stat().st_size<=8*1024*1024 else None
              counts=re.findall(r'([0-9]+) commits scanned',scan['log'].read_text(encoding='utf-8',errors='replace'))
              passed=(scan['reason'] is None and scan['code']==0 and findings==[]
                  and len(counts)==1 and int(counts[0])>0)
          except (OSError,ValueError): passed=False; counts=[]
          print(json.dumps({'check':'default_source_git_scan','status':'passed' if passed else 'failed',
              'commits_scanned':int(counts[0]) if len(counts)==1 else None,
              'source':source,'whole_source_tree_claim':False,'raw_logs_public':False},sort_keys=True))
          if not passed: raise SystemExit(1)
      - name: Install reviewed Linux native compilation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev \
            libsystemd-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xauth \
            dbus-x11 gnome-keyring libsecret-tools libgl1-mesa-dri fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # reviewed action pin
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Select the installed Microsoft x64 compiler environment
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess
          assert os.environ['RUNNER_OS']=='Windows' and os.environ['RUNNER_ARCH']=='X64'
          # Use the runner's installed vendor tools, without a new setup action.
          # Keep tokens out of the compiler environment and print no raw output.
          allowed=('PATH','SystemRoot','SYSTEMROOT','SystemDrive','PROCESSOR_ARCHITECTURE','OS','WINDIR','COMSPEC','PATHEXT',
              'ProgramFiles','ProgramFiles(x86)','ProgramW6432','TEMP','TMP',
              'USERPROFILE','HOMEDRIVE','HOMEPATH','LOCALAPPDATA','APPDATA',
              'CARGO_HOME','RUSTUP_HOME')
          environment={key:os.environ[key] for key in allowed if key in os.environ}
          installer=pathlib.Path(os.environ['ProgramFiles(x86)'])/'Microsoft Visual Studio'/'Installer'/'vswhere.exe'
          def command(args):
              result=subprocess.run(args,env=environment,stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60,check=False)
              if result.returncode!=0 or len(result.stdout)>256*1024 or len(result.stderr)>64*1024:
                  # Fixed diagnostics only; no setup output or environment data.
                  text=(result.stdout+result.stderr).decode('utf-8',errors='ignore').lower()
                  markers={'command_not_recognized':'is not recognized as an internal or external command',
                      'invalid_syntax':'the syntax of the command is incorrect',
                      'vsdevcmd_error':'[error:', 'vcvars_error':'error in script usage'}
                  print(json.dumps({'check':'msvc_environment','status':'failed',
                      'exit_code':result.returncode,'stdout_bytes':len(result.stdout),
                      'stderr_bytes':len(result.stderr),
                      'markers':sorted(key for key,value in markers.items() if value in text)}),flush=True)
                  raise SystemExit(1)
              return result.stdout
          selected=command([str(installer),'-latest','-products','*','-requires',
              'Microsoft.VisualStudio.Component.VC.Tools.x86.x64','-property','installationPath']).decode('utf-8').strip()
          assert selected and not any(char in selected for char in '\r\n"%')
          installation=pathlib.Path(selected).resolve(strict=True)
          assert installation.is_relative_to(pathlib.Path(os.environ['ProgramFiles']).resolve())
          setup=installation/'Common7'/'Tools'/'VsDevCmd.bat'
          assert setup.is_file()
          cmd=pathlib.Path(os.environ['SystemRoot'])/'System32'/'cmd.exe'
          # cmd.exe uses its own quoting rules. Pass a raw CreateProcess
          # command line, avoiding list2cmdline's C-runtime quote escapes.
          raw=command(f'"{cmd}" /d /s /c ""{setup}" -no_logo -arch=x64 -host_arch=x64 >nul && set"')
          wanted={'PATH','INCLUDE','LIB','LIBPATH','VCTOOLSINSTALLDIR','VCINSTALLDIR',
              'VSINSTALLDIR','WINDOWSSDKDIR','WINDOWSSDKVERSION'}
          values={}
          # cmd writes OEM text to pipes; preserve all characters in tool paths.
          import ctypes
          encoding='cp'+str(ctypes.windll.kernel32.GetOEMCP())
          for line in raw.decode(encoding,errors='strict').splitlines():
              name,separator,value=line.partition('=')
              if separator and name.upper() in wanted:
                  assert name.upper() not in values and value and not any(c in value for c in '\r\n\x00')
                  values[name.upper()]=value
          assert wanted<=values.keys()
          compiler_root=pathlib.Path(values['VCTOOLSINSTALLDIR']).resolve(strict=True)
          assert compiler_root.is_relative_to(installation/'VC'/'Tools'/'MSVC')
          linker=shutil.which('link.exe',path=values['PATH'])
          assert linker and pathlib.Path(linker).resolve().is_relative_to(compiler_root/'bin'/'Hostx64'/'x64')
          # Fixed names, single-line values; no credentials or compiler stdout.
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8',newline='\n') as output:
              for name,value in values.items():
                  output.write(name+'='+value+'\n')
          print(json.dumps({'check':'msvc_environment','status':'passed','target':'x64','linker':'msvc'}))
