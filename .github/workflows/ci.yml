# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: Encrypted sticker media verification
run-name: Incoming room and thread stickers 6d8f09e - Linux development verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sticker-media-linux-6d8f09e
  cancel-in-progress: false
jobs:
  contracts:
    name: Matrix receiver and encrypted sticker integration
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6d8f09ecc412cb351919aad4f3d3505f5f549ea5
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 6d8f09ecc412cb351919aad4f3d3505f5f549ea5
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Run synthetic integration-runner contracts
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, pathlib, unittest
          suite = unittest.TestSuite()
          for name in ('test_matrix_acceptance',):
              path = pathlib.Path('scripts/tests', name + '.py').resolve(strict=True)
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 152:
              raise SystemExit('Focused synthetic contracts failed')
          print('MEDIA_HELPER_CONTRACTS_PASSED tests=' + str(result.testsRun))
          PY
      - name: Install isolated fixture and credential-vault prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev dbus-x11 gnome-keyring libsecret-tools
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Test current Matrix library including incoming sticker guards
        timeout-minutes: 80
        run: cargo test --locked -p morpheus-matrix --lib
      - name: Verify real encrypted attachments and room and thread stickers
        timeout-minutes: 55
        run: >-
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py
          --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --suite media-only
