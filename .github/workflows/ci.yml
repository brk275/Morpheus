              try:
                  clean=(scanned['reason'] is None and scanned['code']==0
                      and report.stat().st_size<=8*1024*1024 and json.loads(report.read_text())==[])
              except (OSError,ValueError): clean=False
              if not clean:
                  print(json.dumps({'check':name,'status':'failed','reason':'private_log_scan_failed',
                      'source':source,'raw_logs_public':False},sort_keys=True),flush=True)
                  raise SystemExit(1)
              output=result['log'].read_text(errors='replace')
              passed=result['reason'] is None and result['code']==0
              record={'check':name,'status':'passed' if passed else 'failed','reason':result['reason'],
                  'source':source,'exit_code':result['code'],'log_bytes':result['bytes'],
                  'raw_logs_public':False,'real_accounts':False,'physical_devices':False,
                  'installed_app':False,'packages_uploaded':False}
              # Interleaved CLI stdout does not guarantee each name and ok share a line.
              # Account for every unique prefix and exact failure/ignore sets instead.
              if required is not None:
                  names=re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\.',output,re.MULTILINE)
                  seen=set(names)
                  failures=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$',output,re.MULTILINE))
                  ignored=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ignored',output,re.MULTILINE))
                  summaries=re.findall(r'^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;',output,re.MULTILINE)
                  complete=len(summaries)==1 and len(names)==len(seen)
                  a=b=c=None
                  if complete:
                      status,a,b,c=summaries[0]; a,b,c=map(int,(a,b,c))
                      complete=(len(seen)==a+b+c and len(failures)==b and len(ignored)==c
                          and failures<=seen and ignored<=seen and not failures&ignored)
                  okay=seen-failures-ignored if complete else set()
                  passed=(passed and complete and summaries[0][0]=='ok' and a>0 and b==0
                      and ignored==allowed_ignored and required<=okay)
                  record.update({'complete_test_accounting':complete,'tests_passed':a,'tests_failed':b,
                      'tests_ignored':c,'required_tests':{fixed:fixed in okay for fixed in sorted(required)}})
              record['error_codes']=sorted(set(re.findall(r'error\[(E[0-9]{4})\]',output)))
              if not passed:
                  folded_output=output.lower()
                  crates=set(re.findall(r"failed to run custom build command for `([A-Za-z0-9_-]+) v([0-9][A-Za-z0-9.+_-]*)`",output))
                  record['failure_diagnostics']={
                      'markers':sorted(key for key,value in failure_markers.items() if value.lower() in folded_output),
                      'locked_build_script_crates':sorted(name+'@'+version for name,version in crates if (name,version) in locked),
                      'native_error_codes':sorted(set(re.findall(r'\b(?:LNK[0-9]{4}|C[0-9]{4})\b',output))),
                      'os_error_codes':sorted(set(int(code) for code in re.findall(r'os error ([0-9]{1,5})\b',output))),
                  }
              loops=len(re.findall(r'part of a binding loop',output))
              passed=passed and loops==0
              record.update({'status':'passed' if passed else 'failed','ui_binding_loop_warnings':loops})
              print(json.dumps(record,sort_keys=True),flush=True)
              all_passed=all_passed and passed
              # Failed compilation cannot yield meaningful unit checks. Independent test
              # suites still run after a test failure, using the same compiled graph.
              if name=='native_app_build' and not passed: break
          if not all_passed: raise SystemExit(1)
