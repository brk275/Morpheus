# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: Installed Appearance stage contracts
run-name: Appearance stages cf2a764 - mocked Mac and Windows contracts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: appearance-stage-contracts-cf2a764
  cancel-in-progress: false
jobs:
  contracts:
    name: Reviewed Mac and Windows helper contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cf2a7643729589c98973ea0d2ec135d33ae51d74
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = cf2a7643729589c98973ea0d2ec135d33ae51d74
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Run synthetic installed helper privacy and stage contracts
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          suite = unittest.TestSuite()
          for name in ('test_macos_package_ui', 'test_windows_package_ui'):
              path = pathlib.Path('scripts/tests', name + '.py').resolve(strict=True)
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 190:
              raise SystemExit('Focused synthetic contracts failed')
          print('APPEARANCE_STAGE_CONTRACTS_PASSED tests=' + str(result.testsRun))
          PY
