          def reduce_failures(output):
              diagnostics={}; current=None; want_header=False; unknown=0; truncated=False
              aliases={str(workspace/name):name for name in PUBLIC_FILES}
              aliases.update({name:name for name in PUBLIC_FILES})
              for raw in io.StringIO(output):
                  line=raw.rstrip('\r\n')
                  if line=='='*70:
                      want_header=True; current=None; continue
                  if want_header:
                      want_header=False
                      match=re.match(r'^(FAIL|ERROR): ([A-Za-z_][A-Za-z0-9_]*) \(([^()\r\n]{1,512})\)',line[:2048])
                      if not match: continue
                      outcome,function,identifier=match.groups()
                      if identifier not in KNOWN_CASES or identifier.rsplit('.',1)[-1]!=function:
                          unknown=min(unknown+1,65535); continue
                      current=diagnostics.setdefault(identifier,{'failed':False,'errored':False,'exception_kinds':set(),'frames':[],'truncated':False})
                      current['failed' if outcome=='FAIL' else 'errored']=True
                      continue
                  if current is None: continue
                  if len(line)>8192:
                      current['truncated']=True; truncated=True; continue
                  frame=re.match(r'^\s*File "([^"\r\n]{1,4096})", line ([0-9]{1,7})(?:, in [^\r\n]{0,256})?$',line)
                  if frame:
                      filename,number=frame.groups(); public=aliases.get(filename); number=int(number)
                      if public is not None and 0<number<=PUBLIC_FILES[public]['lines']:
                          value={'file':public,'line':number}
                          if value not in current['frames']:
                              if len(current['frames'])==8:
                                  current['frames'].pop(0); current['truncated']=True; truncated=True
                              current['frames'].append(value)
                  exception=re.match(r'^(?:builtins\.)?([A-Za-z_][A-Za-z0-9_]{0,63})(?::|$)',line)
                  if exception and exception[1] in BUILTIN_EXCEPTIONS:
                      if len(current['exception_kinds'])<8:current['exception_kinds'].add(exception[1])
                      else:current['truncated']=True; truncated=True
              cases=[]
              for identifier in sorted(diagnostics):
                  row=diagnostics[identifier]
                  cases.append({'case_id':identifier,'failed':row['failed'],'errored':row['errored'],
                      'exception_kinds':sorted(row['exception_kinds']),'frames':row['frames'],'truncated':row['truncated']})
              ran=[int(value) for value in re.findall(r'^Ran ([0-9]{1,5}) tests? in ',output,re.MULTILINE)]
              return {'cases':cases,'known_failed_or_error_cases':len(cases),'unmapped_failure_headers':unknown,
                  'diagnostic_truncated':truncated,'exact69_summary':ran==[69]}


