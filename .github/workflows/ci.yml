          raise SystemExit(0 if okay else 1)
          """
          required_ids_sha256 = '7296db484a5e5130daceae1c1b155411ba18c5355da95d34e4ebfaae5642f5c9'
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError('duplicate_field')
                  result[key] = value
              return result
          def report_record(output, prefix):
              # Parse only a single bounded closed record after independent scan.
              if len(output) > 4 * 1024 * 1024: return None
              records = []
              for line in output.splitlines():
                  if line.startswith(prefix):
                      if len(line) > 16384: return None
                      try:
                          records.append(json.loads(line[len(prefix):], object_pairs_hook=unique_object))
                      except (ValueError, TypeError): return None
              return records[0] if len(records) == 1 and type(records[0]) is dict else None
          def helper_evidence(output):
              row = report_record(output, 'MORPHEUS_MATRIX_ACCEPTANCE_HELPERS ')
              fields = {'tests_run', 'zero_skips_xfails', 'required_ids_sha256', 'complete',
                  'failed_ids', 'failed_ids_count', 'failed_ids_truncated', 'unmapped_failure'}
              if (row is None or set(row) != fields
                  or type(row.get('tests_run')) is not int or row['tests_run'] != 161
                  or type(row.get('zero_skips_xfails')) is not bool or type(row.get('complete')) is not bool
                  or row.get('required_ids_sha256') != required_ids_sha256
                  or type(row.get('failed_ids')) is not list or len(row['failed_ids']) > 8
                  or any(type(value) is not str or value not in required_names for value in row['failed_ids'])
                  or row['failed_ids'] != sorted(set(row['failed_ids']))
                  or type(row.get('failed_ids_count')) is not int or not 0 <= row['failed_ids_count'] <= 161
                  or len(row['failed_ids']) != min(row['failed_ids_count'], 8)
                  or type(row.get('failed_ids_truncated')) is not bool
                  or row['failed_ids_truncated'] != (row['failed_ids_count'] > 8)
                  or type(row.get('unmapped_failure')) is not bool):
                  return None
              if row['complete'] and (not row['zero_skips_xfails'] or row['failed_ids_count'] or row['unmapped_failure']):
                  return None
              return row
          name = 'matrix_acceptance_helpers'
          if not tracked_intact() or not scanner_intact():
              print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                  'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
              raise SystemExit(1)
          result = bounded([sys.executable, '-I', '-B', '-c', helper_program,
              json.dumps(required_names, separators=(',', ':'))], name, 300)
          if result['reason'] == 'cleanup_failed':
              print(json.dumps({'check': name, 'status': 'failed', 'reason': 'cleanup_failed',
                  'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
              raise SystemExit(1)
          if not tracked_intact() or not scanner_intact():
              print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                  'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
              raise SystemExit(1)
          if not scan_captured(result, name):
