                      thread.join(timeout=2)
                      if thread.is_alive(): reason=reason or 'process_error'
                      child.stdout.close()
              # Validate the persisted limit even when a very fast child has exited.
              if error: reason=reason or 'process_error'
              if log.stat().st_size>limit: reason='output_limit'
