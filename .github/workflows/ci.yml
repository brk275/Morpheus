          print('MORPHEUS_ELEMENT_FOCUSED_RESULT ' + json.dumps(report, sort_keys=True), flush=True)
          raise SystemExit(0 if report.get('complete') is True else 1)
          """
          helper_ids = {
              'test_element_acceptance.EvidenceTests.test_requires_every_fixed_assertion_and_preserves_failure',
              'test_matrix_acceptance.LiveEvidenceTests.test_element_success_requires_all_protocol_facts_without_leaking_child_text',
              'test_matrix_acceptance.ScopedContinuationTests.test_element_setup_deadline_is_fatal_and_only_actual_peer_stages_are_collectible',
          }
          element_keys = {
              'official_image', 'browser_identity', 'browser_presynced', 'browser_roster',
              'browser_video', 'browser_audio', 'browser_leave', 'native_presynced_baseline',
              'native_roster', 'native_audio', 'native_video', 'native_departure',
          }
          step_ids = {
              'unlock-disposable-keyring', 'vault-store', 'vault-read', 'vault-clear',
              'acceptance-process-containment', 'local_matrix_env-up',
              'local_matrix_rtc-up', 'local_matrix_rtc-probe', 'local_matrix_rtc-rtc-fixture',
              'element-call-rc-sticky2025-presynced', 'element-fixture-down',
              'local_matrix_rtc-down', 'local_matrix_env-down',
              'verify-fixture-container-cleanup', 'verify-fixture-network-cleanup',
          }
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result: raise ValueError('duplicate_field')
                  result[key] = value
              return result
          def report_record(output, prefix):
              # Parse only a single bounded closed record after independent scan.
              if len(output) > 4 * 1024 * 1024: return None
              records = []
              for line in output.splitlines():
                  if line.startswith(prefix):
                      if len(line) > 16384: return None
                      try:
                          records.append(json.loads(line[len(prefix):], object_pairs_hook=unique_object))
                      except (ValueError, TypeError): return None
              return records[0] if len(records) == 1 and type(records[0]) is dict else None
          def exact_true_map(value, names):
              return type(value) is dict and set(value) == names and all(item is True for item in value.values())
          def helper_evidence(output):
              row = report_record(output, 'MORPHEUS_ELEMENT_FOCUSED_HELPERS ')
              return (row is not None and set(row) == {'tests_run', 'zero_skips_xfails', 'required_methods', 'complete'}
                  and type(row.get('tests_run')) is int and row['tests_run'] == 3
                  and row.get('zero_skips_xfails') is True and row.get('complete') is True
                  and exact_true_map(row.get('required_methods'), helper_ids))
          def element_evidence(output):
              row = report_record(output, 'MORPHEUS_ELEMENT_FOCUSED_RESULT ')
              return (row is not None and set(row) == {
                      'complete', 'initial_absence_proved', 'ordered_steps', 'shared_cleanup_complete',
                      'element_checks', 'exact_native_test', 'exact_native_test_required', 'full_acceptance'}
                  and row.get('complete') is True and row.get('initial_absence_proved') is True
                  and row.get('shared_cleanup_complete') is True and row.get('full_acceptance') is False
                  and row.get('exact_native_test_required') is True
                  and row.get('exact_native_test') == 'element_call_browser_peer_encrypted_media_and_departure'
                  and exact_true_map(row.get('ordered_steps'), step_ids)
                  and exact_true_map(row.get('element_checks'), element_keys))
          def native_compile_evidence(output):
              # Same existing Element test target, built without executing it.
              # Keep generated paths private and require one actual test artifact.
              if len(output) > 64 * 1024 * 1024: return False
              artifacts = []
              for line in output.splitlines():
                  if not line.startswith('{'): continue
                  if len(line) > 1024 * 1024: return False
                  try: row = json.loads(line, object_pairs_hook=unique_object)
                  except (ValueError, TypeError): return False
                  if type(row) is not dict: continue
                  target = row.get('target'); profile = row.get('profile')
                  if (row.get('reason') != 'compiler-artifact' or type(target) is not dict
                      or target.get('name') != 'element_call_peer' or type(profile) is not dict
                      or profile.get('test') is not True): continue
                  if target.get('kind') != ['test'] or type(row.get('executable')) is not str:
                      return False
                  try:
                      candidate = pathlib.Path(row['executable'])
                      target_root = workspace / 'target'
                      if not candidate.is_absolute() or not candidate.is_relative_to(target_root): return False
                      if any(part in ('.', '..') for part in candidate.relative_to(target_root).parts): return False
                      parent = workspace
                      for component in candidate.relative_to(workspace).parts[:-1]:
                          parent = parent / component
                          info = parent.lstat()
                          if not stat.S_ISDIR(info.st_mode): return False
                      info = candidate.lstat()
                      if not stat.S_ISREG(info.st_mode) or not info.st_mode & stat.S_IXUSR: return False
                      artifacts.append(candidate)
                  except (OSError, ValueError, TypeError): return False
              return len(artifacts) == 1
          # Existing closed inner stage/failure diagnostics; no exception or raw line leaves this process.
          element_stages = {
              'configuration', 'tool_install', 'browser_install', 'native_test_build', 'media_fixture',
              'browser_launch', 'browser_login', 'browser_identity', 'browser_room_sync', 'native_join_wait',
              'browser_join', 'browser_roster', 'browser_receive_video', 'browser_receive_audio',
              'native_media_wait', 'browser_leave', 'element_fixture_root', 'element_configuration',
              'element_image_pull', 'element_image_verify', 'element_container_create',
              'element_container_start', 'element_ready', 'element_cleanup', 'native_test', 'log_scan', 'complete',
          }
          element_failures = {'fixture_operation', 'browser_acceptance', 'native_acceptance', 'deadline', 'evidence', 'log_scan'}
          def failure_evidence(output):
              result = {}
              if len(output) > 4 * 1024 * 1024: return result
              for line in output.splitlines():
                  if not line.startswith('{') or len(line) > 16384: continue
                  try: row = json.loads(line, object_pairs_hook=unique_object)
                  except (ValueError, TypeError): continue
                  if type(row) is not dict or type(row.get('element_diagnostics')) is not dict: continue
                  diagnostics = row['element_diagnostics']
                  stage = diagnostics.get('stage'); failure = diagnostics.get('failure')
                  if type(stage) is str and stage in element_stages: result['stage'] = stage
                  if type(failure) is str and failure in element_failures: result['failure'] = failure
              return result
          checks = [
              ('element_changed_helpers', [sys.executable, '-I', '-B', '-c', helper_program], 300),
              ('element_native_target_compile', ['cargo', 'test', '--locked', '-p', 'morpheus-rtc',
                  '--features', 'native-devices', '--test', 'element_call_peer', '--no-run', '--message-format=json'], 40 * 60),
              ('element_stock_presynced', ['dbus-run-session', '--', sys.executable, '-I', '-B', '-c', focused_program, str(scanner)], 56 * 60),
          ]
          all_passed = True
          for name, args, seconds in checks:
              if not all_passed:
                  print(json.dumps({'check': name, 'status': 'not_run', 'reason': 'dependency_failed',
                      'source': source, 'focused_element_only': True, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  continue
              if not tracked_intact() or not scanner_intact():
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              result = bounded(args, name, seconds)
              if result['reason'] == 'cleanup_failed':
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'cleanup_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              if not tracked_intact() or not scanner_intact():
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'input_or_scanner_integrity_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              if not scan_captured(result, name):
                  print(json.dumps({'check': name, 'status': 'failed', 'reason': 'private_log_scan_failed',
                      'source': source, 'raw_logs_public': False}, sort_keys=True), flush=True)
                  raise SystemExit(1)
              output = result['captured'].decode('utf-8', errors='replace')
              command_ok = result['reason'] is None and result['code'] == 0
              if name == 'element_changed_helpers':
                  complete = helper_evidence(output)
              elif name == 'element_native_target_compile':
                  complete = native_compile_evidence(output)
              else:
                  complete = element_evidence(output)
              passed = command_ok and complete
              record = {
                  'check': name, 'status': 'passed' if passed else 'failed', 'source': source,
                  'reason': result['reason'], 'exit_code': result['code'], 'log_bytes': result['bytes'],
                  'complete': complete, 'focused_element_only': True, 'full_acceptance': False,
                  'raw_logs_public': False, 'real_accounts': False, 'physical_devices': False,
                  'installed_app': False, 'packages_uploaded': False,
              }
              if name == 'element_changed_helpers':
                  record['required_methods'] = {key: passed for key in sorted(helper_ids)}
                  record['tests_required'] = 3
              elif name == 'element_native_target_compile':
                  record['test_target'] = 'element_call_peer'
                  record['features'] = 'native-devices'
                  record['compile_only'] = True
                  record['one_test_artifact'] = complete
              else:
                  record['element_checks'] = {key: passed for key in sorted(element_keys)}
                  record['exact_native_test_required'] = 'element_call_browser_peer_encrypted_media_and_departure'
                  record['bootstrap_and_cleanup'] = {key: passed for key in sorted(step_ids)}
                  if not passed: record['element_diagnostics'] = failure_evidence(output)
              print(json.dumps(record, sort_keys=True), flush=True)
              all_passed = all_passed and passed
          if not all_passed: raise SystemExit(1)
