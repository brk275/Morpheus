name: Focused draft recovery diagnosis (temporary; never merge)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpheus-draft-write-a171a45-ubuntu-24.04
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  SLINT_EMIT_DEBUG_INFO: "1"
  MORPHEUS_PACKAGE_SOURCE_REVISION: a171a45d6599dc9f5c3999dce0f8b4a168010fc5

jobs:
  compile:
    name: Focused Linux draft recovery
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275'
    runs-on: ubuntu-24.04
    # Existing test deadlines stay fixed. Refuse fixture startup if preparation
    # leaves less than the complete 55-minute harness and cleanup allowance.
    timeout-minutes: 120
    steps:
      - name: Start bounded preparation allowance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY_START'
          import os, pathlib, time
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'morpheus-draft-preparation-start'
          with p.open('x') as f:
              f.write(str(time.monotonic()))
          PY_START
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a171a45d6599dc9f5c3999dce0f8b4a168010fc5
          fetch-depth: 0
          persist-credentials: false
      - name: Check out immutable reviewed history scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cf22b32ba422c900a189ba170a1fd19f56382526
          path: trusted
          persist-credentials: false
      - name: Scan committed history before candidate execution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "a171a45d6599dc9f5c3999dce0f8b4a168010fc5"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location             https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz             --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 -I trusted/scripts/scan_history.py             --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks"             --manifest trusted/scripts/public-fixtures.json             --evidence "$RUNNER_TEMP/morpheus-history-scan"
      - name: Check affected controller and evidence helpers
        run: |
          python3 -I -B scripts/package_revision.py --verify-checkout "$GITHUB_WORKSPACE"
          python3 -m unittest scripts.tests.test_matrix_acceptance -v
      - name: Prepare existing Linux native dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev             libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev             libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev             libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev             libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xdotool             dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Prepare pinned owned native PipeWire client
        timeout-minutes: 20
        run: |
          python3 scripts/build_linux_native.py --variant native             --prefix "$RUNNER_TEMP/morpheus-native-pipewire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-env
      - name: Compile affected fixtures before runtime deadlines begin
        timeout-minutes: 40
        run: |
          cargo test --locked -p morpheus-matrix --test drafts_local --test formatted_local --test moderation_local --no-run
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app --no-run
      - name: Check pause-entry failure and held-boundary regressions
        run: |
          cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app --             --exact live::stale_observer_tests::rollback_pause_wait_rejects_an_early_ended_worker             live::stale_observer_tests::rollback_pause_wait_does_not_release_the_reached_write_boundary             --test-threads=1
      - name: Exercise existing draft-recovery suite with disposable accounts
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY_BUDGET'
          import os, pathlib, time
          start = float((pathlib.Path(os.environ['RUNNER_TEMP']) / 'morpheus-draft-preparation-start').read_text())
          elapsed = time.monotonic() - start
          if not 0 <= elapsed < 60 * 60:
              raise SystemExit('Preparation consumed the reserved fixture and cleanup allowance.')
          PY_BUDGET
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py             --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --suite draft-recovery
