      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Format and check reviewed Rust source
        shell: bash
        run: |
          set -euo pipefail
          # Explicit changed Rust leaves include vendored modules; do not rely
          # on cargo-fmt discovering patched Git dependencies as path members.
          rustfmt --edition 2024 \
            crates/morpheus-app/src/account_access_ui_tests.rs \
            crates/morpheus-app/src/appearance.rs \
            crates/morpheus-app/src/call_recovery.rs \
