          args=json.loads(sys.stdin.buffer.readline(65536))
          code=subprocess.Popen(args,stdin=subprocess.DEVNULL,close_fds=True).wait()
          os.write(fd,(str(code)+'\\n').encode('ascii')); os.close(fd)
