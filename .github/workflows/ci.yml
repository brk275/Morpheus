            vendor/matrix-rtc-core/src/encryption/mod.rs \
            vendor/matrix-rtc-core/src/host/backend.rs \
            vendor/matrix-rtc-core/src/session.rs \
            vendor/matrix-rtc-core/src/transport.rs \
            vendor/matrix-rtc-core/tests/key_rotation.rs \
            vendor/matrix-rtc-livekit/src/lib.rs \
            vendor/matrix-rtc-livekit/src/transport_impl.rs \
            vendor/matrix-rtc-transport/src/keys.rs \
            vendor/matrix-rtc-transport/src/livekit/mod.rs \
            vendor/matrix-rtc-transport/src/pool.rs \
            vendor/matrix-rtc-transport/src/pool/tests.rs
