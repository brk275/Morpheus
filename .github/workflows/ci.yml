name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compile:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libpipewire-0.3-dev libssl-dev libudev-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev pkg-config xvfb
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Test configuration, Matrix, and RTC protocol models
        run: cargo test --locked -p morpheus-config -p morpheus-matrix -p morpheus-rtc
      - name: Check desktop and Matrix crates
        run: cargo check --locked -p morpheus-app -p morpheus-matrix
      - name: Build desktop with native call and device adapters
        run: cargo build --locked -p morpheus-app --features native-calls
      - name: Smoke test Linux desktop startup under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 12s xvfb-run -a -s '-screen 0 1280x800x24' target/debug/morpheus-app
          result=$?
          if [ "$result" -ne 124 ]; then
            echo "Morpheus exited before the Linux desktop smoke window (status $result)"
            exit 1
          fi
      - name: Test desktop controller and call guards
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app
      - name: Test native audio mixer
        if: matrix.os == 'macos-15'
        run: cargo test --locked -p morpheus-rtc --features native-devices --lib audio_device::tests
