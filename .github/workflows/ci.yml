# Diagnostic ref only. Never merge this temporary workflow into main.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focus-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  diagnostic:
    name: Bounded font-scale focus diagnostic (windows-2025)
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ricing-focus-diagnostic'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: Run only the reviewed synthetic generated-UI test
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation -- --exact
