          PY_SCANNER
          unset SCANNER_API_TOKEN
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "dcd5d9a2dfafaf50adb63f294eba982778b67dade562def4e0e32bf38941285c  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "f4fb315687debe13e9e44dd4321196406592637b199f7d129a35b62586b052c3  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" --candidate "$PWD" \
            --scanner "$RUNNER_TEMP/gitleaks/gitleaks" --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/focused-ui-source-scan"
