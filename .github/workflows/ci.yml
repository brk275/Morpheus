name: Reviewed Intel App verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-intel-app-c664645da850fecd442d9a5fc45a3d5296ad2385
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  history:
    name: Reviewed source history
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c664645da850fecd442d9a5fc45a3d5296ad2385
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5078f4951c4f6ff6e65ddb560312f655e933e4e2
          path: validation
          persist-credentials: false
      - name: Verify source and reviewed scanner inputs
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c664645da850fecd442d9a5fc45a3d5296ad2385"
          test "$(git rev-parse HEAD^{tree})" = "1119c9514e656504d5ebe21473a51da67fd385f3"
          echo "4acde7ed74259339d9494b5e2d52aff42e1317bbdf23400cc67bf7bf3085caef  $GITHUB_WORKSPACE/validation/scripts/scan_history.py" | sha256sum --check --status
          echo "446f0686722972d33a6a411b83dfc4ab30f14b9022772028491b2bd5e55fa892  $GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" | sha256sum --check --status
      - name: Scan complete committed source history before execution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 -I "$GITHUB_WORKSPACE/validation/scripts/scan_history.py" \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest "$GITHUB_WORKSPACE/validation/scripts/public-fixtures.json" \
            --evidence "$RUNNER_TEMP/reviewed-source-history"

  compile:
    needs: history
    name: Reviewed Intel App suite
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275'
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c664645da850fecd442d9a5fc45a3d5296ad2385
          persist-credentials: false
      - name: Verify immutable reviewed source before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c664645da850fecd442d9a5fc45a3d5296ad2385"
          test "$(git rev-parse HEAD^{tree})" = "1119c9514e656504d5ebe21473a51da67fd385f3"
          echo "dff38516a5f37af9bf4f2b32b3531de7faa09a5ef6b440989b6f68716c469999  crates/morpheus-app/src/account_access_ui_tests.rs" | shasum -a 256 --check --status
          echo "Reviewed App source: c664645da850fecd442d9a5fc45a3d5296ad2385 tree: 1119c9514e656504d5ebe21473a51da67fd385f3"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action; pinned compiler
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Test complete desktop controller and call guards
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app
