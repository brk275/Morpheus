# TEMPORARY focused native offline app checks. NEVER MERGE this workflow.
name: Reviewed settings workspace regression
run-name: Settings target availability diagnosis - d68aa5b
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: settings-target-availability-d68aa5b
  cancel-in-progress: false
jobs:
  contracts:
    name: Test reviewed settings workspace correction
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d68aa5bc63fe4e711e542469a4da7a7d66e551ef
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = d68aa5bc63fe4e711e542469a4da7a7d66e551ef
      - name: Scan source before executing reviewed native tests
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Install native Linux build and isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev libssl-dev \
            libsystemd-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxi6 libxrandr-dev meson ninja-build pkg-config wayland-protocols xvfb xauth \
            dbus-x11 gnome-keyring libsecret-tools libgl1-mesa-dri fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Check new Rust controllers, CLI functions and generated UI together
        timeout-minutes: 105
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TERM_COLOR: never
          SLINT_EMIT_DEBUG_INFO: "1"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import json, math, os, pathlib, re, select, signal, subprocess, tempfile, time
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('ImageOS') == 'ubuntu24'
          names = ('PATH','HOME','LANG','LC_ALL','TMPDIR','CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN',
              'PKG_CONFIG_PATH','LD_LIBRARY_PATH','SSL_CERT_FILE','SSL_CERT_DIR','CARGO_BUILD_JOBS',
              'CARGO_INCREMENTAL','CARGO_PROFILE_DEV_DEBUG','CARGO_PROFILE_TEST_DEBUG','CARGO_TERM_COLOR','SLINT_EMIT_DEBUG_INFO',
              'GITHUB_ACTIONS','RUNNER_ENVIRONMENT','RUNNER_OS','ImageOS','RUNNER_TEMP','RUNNER_TRACKING_ID')
          environment = {name:os.environ[name] for name in names if name in os.environ}
          root = pathlib.Path(tempfile.mkdtemp(prefix='morpheus-offline-app-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          logs = root/'logs'; logs.mkdir(mode=0o700)
          log = logs/'cargo.log'
          reason = None
          code = None
          with log.open('xb') as output:
              child = subprocess.Popen(['cargo','test','--locked','-p','morpheus-app','--features',
                  'native-calls','--bin','morpheus-app',
                  'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation',
                  '--','--exact','--test-threads=1'],
                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  env=environment, start_new_session=True)
              deadline = time.monotonic()+95*60
              size = 0
              try:
                  while True:
                      remaining = deadline-time.monotonic()
                      if remaining<=0:
                          reason='deadline'; break
                      ready,_,_=select.select([child.stdout],[],[],remaining)
                      if not ready:
                          reason='deadline'; break
                      block=os.read(child.stdout.fileno(),65536)
                      if not block: break
                      size+=len(block)
                      if size>50*1024*1024:
                          reason='output_limit'; break
                      output.write(block)
                  if reason is None:
                      code=child.wait(timeout=10)
              except (OSError,subprocess.SubprocessError):
                  reason='process_error'
              finally:
                  # Never signal an already-reaped PID/group. Timeout and
                  # overflow keep our child anchored until after group kill.
                  if child.returncode is None:
                      try: os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError: pass
                      child.wait(timeout=10)
                  child.stdout.close()
          with (root/'scan.log').open('wb') as output:
              scan=subprocess.run([os.environ['RUNNER_TEMP']+'/gitleaks/gitleaks','dir',str(logs),
                  '--redact=100','--ignore-gitleaks-allow','--no-banner','--max-target-megabytes','0',
                  '--config',os.environ['RUNNER_TEMP']+'/default.toml',
                  '--gitleaks-ignore-path',os.environ['RUNNER_TEMP']+'/empty.ignore'],
                  stdout=output,stderr=subprocess.STDOUT,timeout=60)
          if scan.returncode!=0:
              print('OFFLINE_NATIVE_LOG_WITHHELD',flush=True); raise SystemExit(1)
          output=log.read_text(errors='replace')
          seen_list=re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\.',output,re.MULTILINE)
          seen=set(seen_list)
          needed={'account_access::ui_tests::real_slint_account_dialogs_and_detach_clear_private_presentation'}
          summaries=re.findall(r'^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;',output,re.MULTILINE)
          failed=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$',output,re.MULTILINE))
          ignored=set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ignored',output,re.MULTILINE))
          allowed_ignored=set()
          # CLI tests write directly to stdout; require the complete libtest
          # accounting instead of assuming their names and final ok share a line.
          complete=len(summaries)==1 and len(seen_list)==len(seen)
          if complete:
              result,passed_count,failed_count,ignored_count=summaries[0]
              passed_count,failed_count,ignored_count=map(int,(passed_count,failed_count,ignored_count))
              complete=(len(seen)==passed_count+failed_count+ignored_count
                  and len(failed)==failed_count and len(ignored)==ignored_count
                  and failed<=seen and ignored<=seen and not failed&ignored)
          else:
              passed_count=failed_count=ignored_count=None
          ok=seen-failed-ignored if complete else set()
          passed=(reason is None and code==0 and complete and summaries[0][0]=='ok'
              and failed_count==0 and passed_count==1 and needed<=ok and ignored==allowed_ignored)
          clean=re.sub(r'\x1b\[[0-9;]*m','',output)
          binding_loops=re.findall(r'^warning: morpheus-app@[0-9.]+: ([^\r\n]*part of a binding loop[^\r\n]*)',clean,re.MULTILINE)
          passed=passed and not binding_loops
          # Never forward arbitrary marker content. This synthetic-only probe
          # permits finite bounded geometry and booleans, no free-form strings.
          probes=[]
          probe_invalid=False
          expected={'scale','calls','requested','saved','focus_before','focus_after',
              'bounds_before','bounds_after','window','page','config_error_present','presentation','layout'}
          def vector(value,length):
              return isinstance(value,list) and len(value)==length and all(
                  type(x) in (int,float) and math.isfinite(x) and abs(x)<=100000 for x in value)
          for line in output.splitlines():
              if not line.startswith('MORPHEUS_MOTION_FAILURE '): continue
              try:
                  assert len(line)<=8192 and len(probes)<2
                  data=json.loads(line.split(' ',1)[1])
                  assert type(data) is dict and set(data)==expected
                  assert type(data['scale']) is int and data['scale'] in (100,200)
                  assert type(data['calls']) is int and 0<=data['calls']<=1000
                  assert type(data['page']) is int and 0<=data['page']<=20
                  assert all(type(data[k]) is bool for k in ('requested','saved','focus_before',
                      'focus_after','config_error_present','presentation'))
                  assert vector(data['window'],2)
                  assert type(data['layout']) is list and 1<=len(data['layout'])<=17
                  assert all(vector(row,8) for row in data['layout'])
                  assert all(data[k] is None or vector(data[k],4) for k in ('bounds_before','bounds_after'))
                  probes.append(data)
              except (AssertionError,ValueError,TypeError):
                  probe_invalid=True
          target_probes=[]
          for line in output.splitlines():
              if not line.startswith('MORPHEUS_SETTINGS_TARGET_FAILURE '): continue
              match=re.fullmatch(r'MORPHEUS_SETTINGS_TARGET_FAILURE index=([0-9]{1,3}) live=(true|false)',line)
              if match is None or len(target_probes)>=1 or int(match[1])>=34:
                  probe_invalid=True
              else:
                  target_probes.append({'index':int(match[1]),'live':match[2]=='true'})
          passed=passed and not probe_invalid and not probes and not target_probes
          print(json.dumps({'check':'native_settings_workspace_regression','motion_probe':probes,'target_availability_probe':target_probes,'probe_invalid':probe_invalid,'complete_test_accounting':complete,'status':'passed' if passed else 'failed',
              'source':'d68aa5bc63fe4e711e542469a4da7a7d66e551ef','failure':reason,
              'ignored_tests':sorted(ignored),'ui_binding_loop_warnings':binding_loops[:8],
              'tests_passed':passed_count,
              'tests_failed':failed_count,
              'ignored':ignored_count,
              'required_tests':{name:name in ok for name in sorted(needed)},
              'error_codes':sorted(set(re.findall(r'error\[(E[0-9]{4})\]',output))),
              'rust_locations':sorted(set(re.findall(r'(?:crates/[A-Za-z0-9_./-]+\.rs:[0-9]+:[0-9]+)',output))),
              'failed_tests':sorted(set(re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$',output,re.MULTILINE))),
              'raw_logs_public':False,'real_accounts':False,'physical_devices':False,
              'native_installed_app':False},sort_keys=True),flush=True)
          if not passed: raise SystemExit(1)
          PY
      # Media has its own distinct await-diagnostic run; do not duplicate it here.
      # No accounts, physical devices, native packages or artifact uploads.
