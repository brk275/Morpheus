# TEMPORARY focused tool-boundary diagnostic. NEVER MERGE this workflow.
name: AppImage inventory preflight
run-name: AppImage notice path metadata 59c60a1 - no native build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-notice-paths-59c60a1
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only notice path permissions
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 59c60a16758620d320e62140fe4a3c76d41acebc
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 59c60a16758620d320e62140fe4a3c76d41acebc
      - name: Scan history using independent default rules
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" \
            --log-opts=--all .
      - name: Inspect fixed system path properties without importing candidate code
        shell: bash
        run: |
          python3 -I -B - <<'PY_PATHS'
          import json
          import os
          from pathlib import Path
          import stat
          
          known = {Path("/"): "root", Path("/usr"): "usr", Path("/usr/share"): "share",
                   Path("/usr/share/doc"): "doc_root", Path("/usr/share/doc/libc6"): "libc_notice_dir",
                   Path("/usr/share/doc/libc6/copyright"): "libc_copyright",
                   Path("/usr/share/common-licenses"): "common_license_dir",
                   Path("/usr/share/common-licenses/GPL-2"): "gpl2_license"}
          rows = []
          for label, path in (("copyright", Path("/usr/share/doc/libc6/copyright")),
                              ("common_license", Path("/usr/share/common-licenses/GPL-2"))):
              try:
                  resolved = path.resolve(strict=True)
              except (OSError, RuntimeError):
                  rows.append({"family": label, "error": "resolution_failed"})
                  continue
              for phase, candidate in (("input", path), ("resolved", resolved)):
                  chain = (candidate, *candidate.parents)
                  if len(chain) > 16:
                      raise SystemExit("Path chain exceeds fixed bound")
                  for index, item in enumerate(chain):
                      info = item.lstat()
                      kind = ("symlink" if stat.S_ISLNK(info.st_mode) else
                              "directory" if stat.S_ISDIR(info.st_mode) else
                              "regular" if stat.S_ISREG(info.st_mode) else "other")
                      rows.append({"family": label, "phase": phase, "position": index,
                                   "role": known.get(item, "other_system_component"),
                                   "kind": kind, "root_owned": info.st_uid == 0,
                                   "mode": format(stat.S_IMODE(info.st_mode), "04o"),
                                   "group_writable": bool(info.st_mode & 0o020),
                                   "world_writable": bool(info.st_mode & 0o002)})
          if not rows or len(rows) > 64:
              raise SystemExit("Invalid metadata row count")
          print("APPIMAGE_NOTICE_PATHS " + json.dumps({"schema": 1, "rows": rows}, sort_keys=True))
          PY_PATHS
