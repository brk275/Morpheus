# TEMPORARY renderer capability check. NEVER MERGE this workflow into main.
# This probe is not timeline-performance, package or beta release acceptance.
name: Native frame capability preflight
run-name: Native frame capability ef92843 - release gates open

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Reviewed source history scan
    # Hosted validation is disabled while private to prevent unauthorized paid builds.
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ef928438e8dfa75f900e46c722e85bec75e29a70
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Never honor candidate-provided rules or suppression files. No
          # candidate code has executed on this runner before scanning.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --log-opts=--all .
  preflight:
    name: Linux native frame capability and rejection guards
    needs: scope
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: native-ef928438e8dfa75f900e46c722e85bec75e29a70-ubuntu-24.04
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ef928438e8dfa75f900e46c722e85bec75e29a70
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = ef928438e8dfa75f900e46c722e85bec75e29a70
      - name: Install example renderer build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev \
            libssl-dev libsystemd-dev libudev-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev \
            meson ninja-build pkg-config wayland-protocols dbus-x11 \
            libglib2.0-bin libgl1-mesa-dri libegl1 xvfb xauth
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          save-if: "false"
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Require the reviewed renderer feature graph
        shell: bash
        run: |
          python3 - <<'FRAME_FEATURES'
          import os, subprocess
          result = subprocess.run(
              ["cargo", "tree", "--locked", "-p", "morpheus-app", "--edges", "normal,dev",
               "--prefix", "none", "--format", "{p}"],
              env=os.environ | {"CARGO_TERM_COLOR": "never"}, capture_output=True, timeout=120)
          if result.returncode or len(result.stdout) > 2 * 1024 * 1024:
              raise SystemExit("Renderer feature graph unavailable.")
          nodes = {line.split()[0] for line in result.stdout.decode("utf-8").splitlines() if line.strip()}
          if "i-slint-renderer-femtovg" not in nodes or "i-slint-renderer-skia" in nodes:
              raise SystemExit("Unreviewed renderer feature graph.")
          print("MORPHEUS_FRAME_FEATURES femtovg=true skia=false")
          FRAME_FEATURES
      - name: Build only the account-free debug example
        run: cargo build --locked -p morpheus-app --example frame_probe
      - name: Validate native frame callbacks and rejected configurations
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/frame-scanner.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/frame-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/frame-scanner" gitleaks
          export FRAME_PROBE_SCANNER="$RUNNER_TEMP/frame-scanner/gitleaks"
          cat > "$RUNNER_TEMP/frame-validation.py" <<'FRAME_VALIDATION'
          """Owner-authored fresh-hosted validator; never run on the owner's computer."""
          from pathlib import Path
          import hashlib
          import json
          import os
          import resource
          import selectors
          import signal
          import socket
          import subprocess
          import time

          os.umask(0o077)
          if os.environ.get("GITHUB_ACTIONS") != "true" or os.environ.get("RUNNER_OS") != "Linux":
              raise SystemExit("Fresh hosted Linux validation required.")
          root = Path(os.environ["RUNNER_TEMP"]) / (
              "morpheus-frame-probe-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root.mkdir(mode=0o700)
          raw = root / "raw"
          raw.mkdir(mode=0o700)
          binary = Path.cwd() / "target/debug/examples/frame_probe"
          scanner = Path(os.environ["FRAME_PROBE_SCANNER"])
          facts = {}
          positive = None
          failure = None
          active_case = "setup"
          process_exits = {}
          native_errors = {}
          known_errors = {
              "unsupported_platform", "backend_not_winit_femtovg", "software_gl_not_requested",
              "x11_display_missing", "x11_display_not_local", "wayland_display_present",
              "backend_unavailable", "window_unavailable", "window_show_failed", "event_loop_failed",
              "renderer_not_opengl", "notifier_unavailable", "graphics_api_not_native_opengl",
              "lifecycle_invalid", "frame_outside_lifecycle", "unknown_rendering_state",
              "unpaired_frame", "insufficient_frames", "close_failed", "probe_panicked",
              "watchdog_unavailable", "watchdog_failed", "watchdog_expired",
          }


          def require(condition, reason):
              if not condition:
                  raise RuntimeError(reason)


          def no_threads():
              resource.setrlimit(resource.RLIMIT_NPROC, (0, 0))


          def invoke(label, changes, limit_threads=False):
              global active_case
              active_case = label
              env = os.environ.copy()
              for name in ("WAYLAND_DISPLAY", "WAYLAND_SOCKET", "WINIT_UNIX_BACKEND"):
                  env.pop(name, None)
              env.update(SLINT_BACKEND="winit-femtovg", LIBGL_ALWAYS_SOFTWARE="1",
                         MESA_SHADER_CACHE_DISABLE="true", RUST_BACKTRACE="0")
              env.update(changes)
              sizes = {"out": 0, "err": 0}
              deadline = time.monotonic() + 25
              with (raw / (label + ".stdout")).open("wb") as out, (
                  raw / (label + ".stderr")
              ).open("wb") as err:
                  child = subprocess.Popen(
                      [str(binary)], env=env, stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True,
                      preexec_fn=no_threads if limit_threads else None,
                  )
                  selector = selectors.DefaultSelector()
                  selector.register(child.stdout, selectors.EVENT_READ, ("out", out))
                  selector.register(child.stderr, selectors.EVENT_READ, ("err", err))
                  try:
                      while selector.get_map():
                          remaining = deadline - time.monotonic()
                          require(remaining > 0, "child_timeout")
                          events = selector.select(remaining)
                          require(bool(events), "child_timeout")
                          for key, _ in events:
                              block = os.read(key.fd, 16384)
                              if not block:
                                  selector.unregister(key.fileobj)
                                  key.fileobj.close()
                                  continue
                              name, target = key.data
                              sizes[name] += len(block)
                              require(sizes[name] <= 65536, "child_output_limit")
                              target.write(block)
                      code = child.wait(timeout=max(0.1, deadline - time.monotonic()))
                      process_exits[label] = code
                  finally:
                      if child.poll() is None:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait()
                      selector.close()
                      for pipe in (child.stdout, child.stderr):
                          if not pipe.closed:
                              pipe.close()
              data = (raw / (label + ".stdout")).read_bytes()
              require(len(data) <= 4096 and len(data.splitlines()) == 1, "invalid_output_shape")
              result = json.loads(data)
              require(type(result) is dict, "invalid_output_shape")
              if (code in (1, 3) and set(result) == {"probe", "result", "reason"}
                      and result["probe"] == "morpheus_frame_timing" and result["result"] == "error"
                      and type(result["reason"]) is str and result["reason"] in known_errors):
                  native_errors[label] = result["reason"]
              return code, result


          def error_result(code, result, reason):
              return code == 1 and result == {
                  "probe": "morpheus_frame_timing", "result": "error", "reason": reason
              }


          def percentile_shape(value):
              return (type(value) is dict and set(value) == {"p50", "p95", "max"}
                      and all(type(x) is int and 0 <= x <= 20_000_000 for x in value.values())
                      and value["p50"] <= value["p95"] <= value["max"])


          try:
              require(binary.is_file() and not binary.is_symlink(), "binary_unavailable")
              require(os.geteuid() != 0, "nonroot_runner_required")
              code, report = invoke("native", {})
              expected = {
                  "probe", "result", "backend", "graphics_api", "software_gl_requested", "measure",
                  "warmup_frames", "samples", "render_callback_us", "frame_start_interval_us",
                  "teardown_observed",
              }
              require(code == 0 and set(report) == expected, "native_probe_failed")
              require(report["probe"] == "morpheus_frame_timing" and report["result"] == "pass"
                      and report["backend"] == "winit-femtovg" and report["graphics_api"] == "native_opengl"
                      and report["software_gl_requested"] is True
                      and report["measure"] == "cpu_render_callback_before_presentation"
                      and type(report["warmup_frames"]) is int and report["warmup_frames"] == 10
                      and type(report["samples"]) is int and report["samples"] == 120
                      and type(report["teardown_observed"]) is bool
                      and percentile_shape(report["render_callback_us"])
                      and percentile_shape(report["frame_start_interval_us"]), "invalid_native_result")
              positive = report
              facts["native_callback_pairs"] = True
              listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  for display in range(7100, 7116):
                      try:
                          listener.bind(("127.0.0.1", 6000 + display))
                          break
                      except OSError:
                          continue
                  else:
                      raise RuntimeError("remote_listener_unavailable")
                  listener.listen(1)
                  listener.setblocking(False)
                  code, result = invoke("remote-display", {"DISPLAY": f"127.0.0.1:{display}"})
                  require(error_result(code, result, "x11_display_not_local"), "remote_display_not_rejected")
                  try:
                      connection, _ = listener.accept()
                  except BlockingIOError:
                      facts["remote_display_no_connection"] = True
                  else:
                      connection.close()
                      raise RuntimeError("remote_display_contacted")
                  facts["remote_display_rejected"] = True
              finally:
                  listener.close()
              code, result = invoke("wrong-backend", {"SLINT_BACKEND": "winit-software"})
              require(error_result(code, result, "backend_not_winit_femtovg"), "wrong_backend_not_rejected")
              facts["wrong_backend_rejected"] = True
              code, result = invoke("wayland-selector", {"WAYLAND_SOCKET": "0"})
              require(error_result(code, result, "wayland_display_present"), "wayland_selector_not_rejected")
              facts["wayland_selector_rejected"] = True
              code, result = invoke("watchdog-start", {}, limit_threads=True)
              require(error_result(code, result, "watchdog_unavailable"), "watchdog_start_not_controlled")
              facts["watchdog_start_failure_controlled"] = True
          except Exception as error:
              # Do not reflect exception text, child output, paths or environment values.
              failure = "acceptance_check_failed"

          (root / "scanner.toml").write_text("[extend]\nuseDefault = true\n")
          (root / "scanner.ignore").write_text("")
          with (root / "scanner.log").open("wb") as output:
              scan = subprocess.run(
                  [str(scanner), "dir", str(raw), "--config", str(root / "scanner.toml"),
                   "--gitleaks-ignore-path", str(root / "scanner.ignore"), "--ignore-gitleaks-allow",
                   "--redact=100", "--no-banner", "--max-target-megabytes", "0",
                   "--report-format", "json", "--report-path", str(root / "scan.json")],
                  stdout=output, stderr=subprocess.STDOUT, timeout=45,
              )
          require(scan.returncode == 0 and json.loads((root / "scan.json").read_text()) == [],
                  "private_output_scan_failed")
          if failure is not None:
              print(json.dumps({"probe": "native_frame_acceptance", "result": "error",
                                "reason": failure, "case": active_case, "process_exits": process_exits,
                                "native_errors": native_errors, "completed_facts": sorted(facts)}))
              raise SystemExit(1)
          require(len(facts) == 6 and all(facts.values()), "missing_acceptance_facts")
          print(json.dumps({
              "probe": "native_frame_acceptance", "result": "pass", "profile": "debug",
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "facts": facts, "native": positive, "private_output_secret_findings": 0,
          }))
          FRAME_VALIDATION
          dbus-run-session -- env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u WINIT_UNIX_BACKEND \
            xvfb-run -a -s '-screen 0 1280x800x24' python3 -I -B "$RUNNER_TEMP/frame-validation.py"
