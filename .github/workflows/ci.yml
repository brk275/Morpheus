name: Reviewed Intel App verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-intel-app-a8404f8b8d15e14f06c3cf797e3dbb32abdbb211
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compile:
    name: Reviewed Intel App suite
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.actor == 'brk275'
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a8404f8b8d15e14f06c3cf797e3dbb32abdbb211
          persist-credentials: false
      - name: Verify immutable reviewed source before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a8404f8b8d15e14f06c3cf797e3dbb32abdbb211"
          test "$(git rev-parse HEAD^{tree})" = "22652f4df6259c4a2ee7398f0afba1a6be38b769"
          echo "0ef0c19d49248d191b62bb01b0348c27513d1f989f0052a616920adc4635ee0d  crates/morpheus-app/src/account_access_ui_tests.rs" | shasum -a 256 --check --status
          echo "Reviewed App source: a8404f8b8d15e14f06c3cf797e3dbb32abdbb211 tree: 22652f4df6259c4a2ee7398f0afba1a6be38b769"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action; pinned compiler
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Test complete desktop controller and call guards
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app
