# TEMPORARY history-only verification. NEVER MERGE this workflow.
# Exact reviewed source pins. No candidate program executes.
name: Owner reviewed composition history only
run-name: Reviewed composition history d025e00
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-composition-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    name: Reviewed candidate history
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: d025e00cbea30007f02dc5752c84aff15b949971
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f9efc8ea119468dd4e464dc65959d1ae5ce8192f
          path: trusted
          persist-credentials: false
      - name: Scan reviewed source with fixed independent rules and fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = d025e00cbea30007f02dc5752c84aff15b949971
          archive="$RUNNER_TEMP/gitleaks-linux.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-filesize 33554432 --max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/history-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/history-scanner" gitleaks
          python3 -I trusted/scripts/scan_history.py --candidate candidate \
            --scanner "$RUNNER_TEMP/history-scanner/gitleaks" \
            --manifest trusted/scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/reviewed-candidate-history"
