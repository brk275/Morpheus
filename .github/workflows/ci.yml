# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: Sticker fixture compilation diagnostic
run-name: Sticker fixture compile 6d8f09e - no live accounts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sticker-fixture-compile-6d8f09e
  cancel-in-progress: false
jobs:
  contracts:
    name: Compile exact reviewed encrypted-media fixture
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 6d8f09ecc412cb351919aad4f3d3505f5f549ea5
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 6d8f09ecc412cb351919aad4f3d3505f5f549ea5
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Install Matrix compilation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verified-sdk-archives-v1
          save-if: false
      - name: Compile only the exact fixture before any generated accounts exist
        timeout-minutes: 80
        run: cargo test --locked -p morpheus-matrix --test media_local --no-run
