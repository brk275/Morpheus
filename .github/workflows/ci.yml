# TEMPORARY metadata diagnostic. NEVER MERGE into main.
name: Windows hosted guard facts - no build or app launch
run-name: Windows hosted guard facts - no build or app launch
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: windows-hosted-guard-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  facts:
    name: Observe Windows runner guard facts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.ref == 'refs/heads/codex/windows-hosted-guard-probe-20261018' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Observe only fixed boolean environment predicates
        shell: pwsh
        run: |
          @'
          import json, os, sys
          facts = {
              "platform_win32": sys.platform == "win32",
              "github_actions": os.environ.get("GITHUB_ACTIONS") == "true",
              "hosted_runner": os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted",
              "runner_windows": os.environ.get("RUNNER_OS") == "Windows",
              "runner_x64": os.environ.get("RUNNER_ARCH") == "X64",
              "image_win25": os.environ.get("ImageOS") == "win25",
              "image_win25_vs2026": os.environ.get("ImageOS") == "win25-vs2026",
              "image_present": bool(os.environ.get("ImageOS")),
          }
          print(json.dumps({"check": "windows_hosted_python_guard_facts", "facts": facts}, sort_keys=True))
          '@ | python3 -I -
          @{
            check = 'windows_hosted_powershell_guard_facts'
            facts = @{
              image_win25 = ($env:ImageOS -eq 'win25')
              image_win25_vs2026 = ($env:ImageOS -eq 'win25-vs2026')
              user_interactive = [Environment]::UserInteractive
            }
          } | ConvertTo-Json -Compress
