# TEMPORARY focused diagnostic. NEVER MERGE this workflow into main.
# Shared native changes still need all four platforms. Installed/physical UI,
# system Wayland and all other release gates remain open.
name: Live timeline Linux preflight
run-name: Live timeline Linux preflight 3807da8 - release gates open

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Security and change scope
    # Hosted validation is disabled while private to prevent unauthorized paid builds.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.scope.outputs.native }}
      native_matrix: ${{ steps.scope.outputs.native_matrix }}
      config: ${{ steps.scope.outputs.config }}
      wayland: ${{ steps.scope.outputs.wayland }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out reviewed validation inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR input is read as data; classification code comes from its base.
          # Push uses reviewed main; dispatch uses its owner-selected revision.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Scan committed history for credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          # Never honor candidate-provided rules or suppression files. No
          # candidate code has executed on this runner before scanning.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/morpheus-gitleaks-default.toml"
          : > "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner \
            --config "$RUNNER_TEMP/morpheus-gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/morpheus-gitleaks-empty.ignore" \
            --log-opts=--all .
      - name: Select checks from changed inputs using reviewed classifier
        id: scope
        working-directory: candidate
        # Isolated mode excludes the candidate working directory and Python
        # environment hooks from import lookup. The classifier uses stdlib only.
        run: python3 -I ../trusted/scripts/ci_scope.py --github-event

  helpers:
    name: Validation helper tests
    needs: scope
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3807da82fd01b0577ecb9a01f5e4ca7200ae503b
          persist-credentials: false
      - name: Check scope and packaging helpers
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          node --check scripts/element_call_peer.mjs
          node --check scripts/element_call_stock_peer.mjs
          python3 scripts/package.py --check

  preflight:
    name: Linux live timeline ownership and generated model acceptance
    needs: [scope, helpers]
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: native-3807da82fd01b0577ecb9a01f5e4ca7200ae503b-ubuntu-24.04
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3807da82fd01b0577ecb9a01f5e4ca7200ae503b
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 3807da82fd01b0577ecb9a01f5e4ca7200ae503b
      - name: Install native and disposable vault prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libdrm-dev libegl-dev \
            libfontconfig1-dev libgbm-dev libglib2.0-dev libinih-dev libpipewire-0.3-dev \
            libssl-dev libsystemd-dev libudev-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libxi6 libxrandr-dev \
            meson ninja-build pkg-config wayland-protocols dbus-x11 gnome-keyring \
            libsecret-tools libglib2.0-bin
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: verified-sdk-archives-v1
          save-if: "false"
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Test selection-owned snapshot and feed reads
        run: cargo test --locked -p morpheus-matrix --lib history::tests
      - name: Test runtime cancellation ownership
        run: cargo test --locked -p morpheus-app --features native-calls --bin morpheus-app live::timeline_controller_tests::cancelling_runtime_work_aborts_and_drops_the_spawned_future -- --exact
      - name: Run all selected live timeline-read gates
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          dbus-run-session -- python3 scripts/run_matrix_acceptance.py \
            --suite timeline-reads --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
