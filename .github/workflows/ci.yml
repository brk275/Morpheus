                      or str(path) in seen or size>32*1024*1024):return 1
                  total+=size;seen.add(str(path))
                  if len(tracked)>=10000 or total>256*1024*1024:return 1
                  tracked.append((path,mode,blob,size))
              if len(tracked)!=1345:return 1
              pinned_head=regular_bytes(workspace/'.git/HEAD',4096)
              if pinned_head.strip()!=SOURCE.encode('ascii'):return 1
              def intact():
                  try:
                      if regular_bytes(workspace/'.git/HEAD',4096)!=pinned_head:return False
                      for path,mode,blob,size in tracked:
                          parent=workspace
                          for component in path.parts[:-1]:
                              parent=parent/component
                              if not stat.S_ISDIR(parent.lstat().st_mode):return False
                          file=workspace/path;data=regular_bytes(file,size)
                          if len(data)!=size or hashlib.sha1(b'blob '+str(size).encode()+b'\0'+data).hexdigest().encode()!=blob:return False
                          if bool(file.lstat().st_mode&stat.S_IXUSR)!=(mode==b'100755'):return False
                      for path,value in PUBLIC_FILES.items():
                          data=regular_bytes(workspace/path,value['bytes'])
                          if len(data)!=value['bytes'] or hashlib.sha256(data).hexdigest()!=value['sha256']:return False
                      return True
                  except (OSError,ValueError):return False
              if not intact():
                  print(json.dumps({'check':'tracked_input_integrity','status':'failed'}));return 1
              actual_binding={'files':PUBLIC_FILES,'classes':CLASS_COUNTS,'case_ids':sorted(KNOWN_CASES),'source':SOURCE,'tree':TREE}
              if hashlib.sha256(json.dumps(actual_binding,sort_keys=True,separators=(',',':')).encode()).hexdigest()!=INPUT_DIGEST:return 1
              print(json.dumps({'check':'history_reuse','status':'reused','input_sha256':INPUT_DIGEST,**HISTORY},sort_keys=True))
              # Existing owner-generated lifecycle probes; no candidate code has run.
              probe_root=private/'lifecycle-probe'; probe_root.mkdir(mode=0o700)
              ready=probe_root/'ready'; late=probe_root/'late'
              orphan_code="import pathlib,sys,time; pathlib.Path(sys.argv[1]).write_text('ready'); time.sleep(2); pathlib.Path(sys.argv[2]).write_text('escaped'); time.sleep(30)"
              parent_code="""import pathlib,subprocess,sys,time
              child=subprocess.Popen([sys.executable,'-I','-c',sys.argv[1],sys.argv[2],sys.argv[3]],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,close_fds=True)
              until=time.monotonic()+5
              while not pathlib.Path(sys.argv[2]).exists():
                  if time.monotonic()>=until: raise SystemExit(8)
                  time.sleep(0.01)
              sys.stdout.buffer.write(b'ready\\n'); sys.stdout.buffer.flush()
              """
              normal=bounded([sys.executable,'-I','-c',parent_code,orphan_code,str(ready),str(late)],'owner-orphan-probe',15,1024)
              time.sleep(2.2)
              nonzero=bounded([sys.executable,'-I','-c','raise SystemExit(7)'],'owner-exit-probe',10,1024)
              deadline=bounded([sys.executable,'-I','-c','import time; time.sleep(30)'],'owner-deadline-probe',0.2,1024)
              overflow=bounded([sys.executable,'-I','-c',"print('x'*4096,flush=True)"],'owner-output-probe',10,1024)
              probe_ok=(normal['reason'] is None and normal['code']==0 and normal['captured']==b'ready\n'
                  and ready.is_file() and not late.exists() and nonzero['reason'] is None and nonzero['code']==7
                  and deadline['reason']=='deadline' and overflow['reason']=='output_limit')
              print(json.dumps({'check':'owner_process_lifecycle','status':'passed' if probe_ok else 'failed',
                  'candidate_executed':False,'raw_logs_public':False},sort_keys=True),flush=True)
              if not probe_ok: raise SystemExit(1)
              # Same pinned scanner archive and finite bootstrap as the admitted workflow.
              data=bytearray();deadline=time.monotonic()+180
              url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
              with urllib.request.urlopen(url,timeout=30) as response:
                  while True:
                      chunk=response.read(65536)
                      if not chunk:break
                      data.extend(chunk)
                      if len(data)>32*1024*1024 or time.monotonic()>deadline:raise ValueError('scanner_bound')
              if hashlib.sha256(data).hexdigest()!=SCANNER_ARCHIVE:raise ValueError('scanner_digest')
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as packaged:
                  member=packaged.getmember('gitleaks')
                  if not member.isfile() or member.size>64*1024*1024:raise ValueError('scanner_member')
                  scanner_bytes=packaged.extractfile(member).read(64*1024*1024+1)
              if not scanner_bytes or len(scanner_bytes)>64*1024*1024:raise ValueError('scanner_member')
              if hashlib.sha256(scanner_bytes).hexdigest()!=SCANNER_BINARY:raise ValueError('scanner_binary')
              if not intact():return 1
              result=bounded([sys.executable,'-I','-B','-c',HELPER_PROGRAM],'helpers69',300)
              if result['reason']=='cleanup_failed':
                  print(json.dumps({'check':'matrix_acceptance_helpers','status':'failed','reason':'cleanup_failed','raw_logs_public':False}));return 1
              if not intact():
                  print(json.dumps({'check':'tracked_input_integrity','status':'failed','raw_logs_public':False}));return 1
              # Reconstruct controls after candidate cleanup in a fresh owner-only directory.
              with tempfile.TemporaryDirectory(prefix='morpheus-sealed-helper-',dir=os.environ['RUNNER_TEMP']) as folder:
                  sealed=pathlib.Path(folder);sealed.chmod(0o700)
                  binary=sealed/'gitleaks';rules=sealed/'default.toml';ignore=sealed/'empty.ignore'
                  capture=sealed/'output.log';report=sealed/'report.json'
                  for file,content in ((binary,scanner_bytes),(rules,b'[extend]\nuseDefault = true\n'),(ignore,b''),(capture,result['captured'])):
                      with file.open('xb') as stream:stream.write(content)
                      file.chmod(0o500 if file==binary else 0o400)
                  scanned=bounded([str(binary),'dir',str(capture),'--redact=100','--ignore-gitleaks-allow',
                      '--no-banner','--max-target-megabytes','0','--config',str(rules),
                      '--gitleaks-ignore-path',str(ignore),'--report-format','json','--report-path',str(report)],
                      'private-log-scan',60,8*1024*1024,cwd=sealed)
                  clean=(scanned['reason'] is None and scanned['code']==0
                      and regular_bytes(capture,64*1024*1024)==result['captured']
                      and regular_bytes(rules,1024)==b'[extend]\nuseDefault = true\n'
                      and regular_bytes(ignore,0)==b''
                      and hashlib.sha256(regular_bytes(binary,64*1024*1024)).digest()==hashlib.sha256(scanner_bytes).digest()
                      and json.loads(regular_bytes(report,8*1024*1024))==[])
              if not clean:
                  print(json.dumps({'check':'matrix_acceptance_helpers','status':'failed','reason':'private_log_scan_failed','raw_logs_public':False}));return 1
              diagnostics=reduce_failures(result['captured'].decode('utf-8',errors='replace'))
              passed=(result['reason'] is None and result['code']==0 and diagnostics['exact69_summary']
                  and not diagnostics['cases'] and not diagnostics['unmapped_failure_headers'])
              print(json.dumps({'check':'matrix_acceptance_helpers','status':'passed' if passed else 'failed',
                  'source':SOURCE,'expected_cases':69,'exit_code':result['code'],'reason':result['reason'],
                  'log_bytes':result['bytes'],'private_log_default_scan_passed':True,'raw_logs_public':False,
                  'python_version':list(sys.version_info[:3]),'diagnostics':diagnostics},sort_keys=True),flush=True)
              return 0 if passed else 1
          try:
              outcome=main()
          except Exception:
              print(json.dumps({'check':'helper_diagnostic_owner_guard','status':'failed','raw_logs_public':False}),flush=True)
              outcome=1
          raise SystemExit(outcome)
