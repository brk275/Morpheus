name: Windows QA host preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-host-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helpers:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 14d3eafffec83a9148531392d7dc86bcc053b162
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 14d3eafffec83a9148531392d7dc86bcc053b162
      - name: Test pure and mocked helper contracts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m compileall -q scripts
          node --check scripts/element_call_peer.mjs
          node --check scripts/element_call_stock_peer.mjs
          python3 scripts/package.py --check

  windows:
    name: Check actual Windows metadata and parse bridge
    needs: helpers
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 14d3eafffec83a9148531392d7dc86bcc053b162
          persist-credentials: false
      - name: Verify exact reviewed source
        shell: powershell
        run: |
          $observed = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $observed -cne '14d3eafffec83a9148531392d7dc86bcc053b162') {
            throw 'Unexpected source revision'
          }
      - name: Check actual hosted desktop without opening an app
        shell: powershell
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'The hosted desktop is not interactive'
          }
          python3 scripts/windows_package_ui.py --check-host
          if ($LASTEXITCODE -ne 0) { throw 'Windows host preflight failed' }
      - name: Parse bridge without executing it
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $source = Join-Path $PWD 'scripts/windows_package_ui.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'The reviewed bridge did not parse' }
          [ordered]@{ check = 'windows_bridge_parse'; status = 'passed'; errors = 0 } | ConvertTo-Json -Compress
