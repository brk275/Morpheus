# TEMPORARY focused helper contracts. NEVER MERGE this workflow.
name: macOS registration and canonical path checks
run-name: macOS registration checks 9a5affc - no app build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-registration-checks-9a5affc
  cancel-in-progress: false
jobs:
  contracts:
    name: Reviewed macOS attachment contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9a5affce97b5d15bfc71874c66fc0dfc3084b30e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = 9a5affce97b5d15bfc71874c66fc0dfc3084b30e
      - name: Scan source before executing reviewed mocked contracts
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default.toml"
          : > "$RUNNER_TEMP/empty.ignore"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --ignore-gitleaks-allow --no-banner --config "$RUNNER_TEMP/default.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty.ignore" --log-opts=--all .
      - name: Run synthetic macOS driver contracts
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          suite = unittest.TestSuite()
          for name in ('test_macos_package_ui',):
              path = pathlib.Path('scripts/tests', name + '.py').resolve(strict=True)
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 82:
              raise SystemExit('Focused synthetic contracts failed')
          print('MACOS_REGISTRATION_CONTRACTS_PASSED tests=' + str(result.testsRun))
          PY
  bridge:
    name: Compile and refuse unsafe attachment (${{ matrix.os }})
    needs: contracts
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9a5affce97b5d15bfc71874c66fc0dfc3084b30e
          persist-credentials: false
      - name: Compile reviewed bridge and exercise only fixed refusal boundaries
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, pathlib, platform, subprocess, tempfile
          source = pathlib.Path('scripts/macos_package_ui.swift')
          expected = '707ed9fea93acab2a52bd24bdd535150db3c6fdf636aef3f3634122698498072'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == '9a5affce97b5d15bfc71874c66fc0dfc3084b30e'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          with tempfile.TemporaryDirectory(prefix='morpheus-bridge-refusal-') as directory:
              root = pathlib.Path(directory)
              root.chmod(0o700)
              binary = root/'bridge'
              with (root/'private.log').open('wb') as log:
                  result = subprocess.run(['xcrun','swiftc','-O','-module-name','MorpheusAxBridge','-o',str(binary),str(source)],
                      stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, timeout=180)
                  assert result.returncode == 0 and binary.is_file()
                  commands = [{'op':'permissions'}]
                  for pid in (-1, 2147483648, 2147483647):
                      commands.append({'op':'attach','pid':pid,'executable':'/synthetic-unopened','bundle':'io.github.brk275.morpheus.synthetic'})
                  commands.extend([{'op':'windows'},{'op':'exit'}])
                  raw = ('\n'.join(json.dumps(c,separators=(',',':')) for c in commands)+'\n').encode()
                  with (root/'reply.jsonl').open('wb') as reply:
                      result = subprocess.run([str(binary)], input=raw, stdout=reply, stderr=log, timeout=15)
              raw = (root/'reply.jsonl').read_bytes()
              assert result.returncode == 0 and 0 < len(raw) <= 2048
              records = [json.loads(line) for line in raw.splitlines()]
              assert len(records) == 6 and records[0] == {'ok':True,'ready':True}
              permission = records[1]
              assert set(permission) == {'ok','accessibility','post_event'}
              assert all(type(v) is bool for v in permission.values()) and permission['ok']
              assert records[2:4] == [{'ok':False,'error':'invalid_command'}]*2
              assert records[4] == {'ok':False,'error':'attach_application_missing'}
              assert records[5] == {'ok':False,'error':'not_attached'}
              print(json.dumps({'check':'macos_attach_refusal','status':'passed','architecture':platform.machine(),
                  'source_sha256':expected,'invalid_pid_refused':True,'missing_app_refused':True,'target_unavailable_after_refusal':True,
                  'accessibility_trusted':permission['accessibility'],'keyboard_post_allowed':permission['post_event'],
                  'app_launched':False,'tree_read':False,'input_sent':False,'permission_requested':False,'raw_output_public':False},sort_keys=True))
          PY
      - name: Exercise the exact canonical path function on native filesystem aliases
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, pathlib, subprocess, tempfile
          source = pathlib.Path('scripts/macos_package_ui.swift').read_text()
          assert hashlib.sha256(source.encode()).hexdigest() == '707ed9fea93acab2a52bd24bdd535150db3c6fdf636aef3f3634122698498072'
          function = 'func canonicalPath(' + source.split('func canonicalPath(',1)[1].split('\n// One bounded turn',1)[0]
          with tempfile.TemporaryDirectory(prefix='morpheus-path-proof-') as directory:
              root = pathlib.Path(directory).resolve(strict=True)
              assert str(root).startswith(('/private/var/','/private/tmp/'))
              (root/'fixture').write_bytes(b'synthetic-only')
              (root/'alias').symlink_to('fixture')
              (root/'dangling').symlink_to('missing')
              harness = root/'proof.swift'
              harness.write_text('import Foundation\nimport Darwin\n' + function + '''
          let root = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
          let expected = CommandLine.arguments[1] + "/fixture"
          let fixture = URL(fileURLWithPath: expected)
          let aliases = URL(fileURLWithPath: String(expected.dropFirst("/private".count)))
          let checks: [String: Bool] = [
              "canonical_matches": canonicalPath(fixture) == expected,
              "system_alias_matches": canonicalPath(aliases) == expected,
              "relative_symlink_matches": canonicalPath(root.appendingPathComponent("alias")) == expected,
              "dangling_rejected": canonicalPath(root.appendingPathComponent("dangling")) == nil,
              "non_file_rejected": canonicalPath(URL(string: "https://example.invalid/synthetic")!) == nil
          ]
          let value: [String: Any] = ["checks": checks,
              "foundation_path_differs": fixture.standardizedFileURL.resolvingSymlinksInPath().path != expected]
          let data = try JSONSerialization.data(withJSONObject: value, options: [.sortedKeys])
          print(String(data: data, encoding: .utf8)!)
          if !checks.values.allSatisfy({ $0 }) { exit(1) }
          ''')
              binary = root/'proof'
              with (root/'private.log').open('wb') as log:
                  compile = subprocess.run(['xcrun','swiftc','-O','-o',str(binary),str(harness)],
                      stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, timeout=180)
                  assert compile.returncode == 0
                  with (root/'reply.json').open('wb') as reply:
                      run = subprocess.run([str(binary),str(root)], stdin=subprocess.DEVNULL,
                          stdout=reply, stderr=log, timeout=15)
              raw = (root/'reply.json').read_bytes()
              assert run.returncode == 0 and 0 < len(raw) <= 2048
              result = json.loads(raw)
              keys = {'canonical_matches','system_alias_matches','relative_symlink_matches','dangling_rejected','non_file_rejected'}
              assert set(result) == {'checks','foundation_path_differs'} and set(result['checks']) == keys
              assert all(type(v) is bool and v for v in result['checks'].values())
              assert type(result['foundation_path_differs']) is bool
              print(json.dumps({'check':'native_canonical_path','status':'passed','source_sha256':
                  '707ed9fea93acab2a52bd24bdd535150db3c6fdf636aef3f3634122698498072',
                  **result, 'private_paths_public':False,'app_launched':False,'input_sent':False},sort_keys=True))
          PY
