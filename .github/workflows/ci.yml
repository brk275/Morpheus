          head = os.environ["GITHUB_SHA"]
          source = os.environ["REVIEWED_PRODUCT_REVISION"]
          assert re.fullmatch("[0-9a-f]{40}", head) and re.fullmatch("[0-9a-f]{40}", source)
          def git(*args, maximum):
              r = subprocess.run(["git", "-c", "core.hooksPath=/dev/null", "-c", "core.fsmonitor=false", *args],
                                 capture_output=True, timeout=30)
              assert r.returncode == 0 and len(r.stdout) <= maximum and len(r.stderr) <= 65536
              return r.stdout
          assert git("rev-parse", "HEAD", maximum=64).decode().strip() == head
          changed = git("diff", "--no-ext-diff", "--no-textconv", "--name-only", maximum=16384).decode().splitlines()
          assert len(changed) == len(set(changed)) and set(changed) <= set(allowed)
          total = 0
          for name in sorted(changed):
              before = git("show", "HEAD:" + name, maximum=2*1024*1024)
              assert hashlib.sha256(before).hexdigest() == expected_before[name]
              after = Path(name).read_bytes()
              total += len(after)
