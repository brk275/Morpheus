name: Windows owned compiler and private profile fixture (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-owned-production-fixture-b0fc55cd5cd07aa65dacfb4eb6b71a768d5a3a64
  cancel-in-progress: false
env:
  REVIEWED_TINY_SOURCE: b0fc55cd5cd07aa65dacfb4eb6b71a768d5a3a64
  REVIEWED_TINY_TREE: 6d8f751b85df2c8bb5030ccc4a102c3b99ce5216
  MORPHEUS_PACKAGE_SOURCE_REVISION: b0fc55cd5cd07aa65dacfb4eb6b71a768d5a3a64
jobs:
  tiny:
    name: Synthetic protected Windows compiler and cleanup probe
    if: github.repository == 'brk275/Morpheus' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id && github.ref == 'refs/heads/codex/temp-windows-owned-production-fixture-20261105'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_TINY_SOURCE }}
          persist-credentials: false
      - name: Verify exact reviewed source before any candidate imports
        timeout-minutes: 1
        shell: python -I -B {0}
        run: |
          import os, re, subprocess
          source, tree = os.environ['REVIEWED_TINY_SOURCE'], os.environ['REVIEWED_TINY_TREE']
          assert all(re.fullmatch('[0-9a-f]{40}', v) and v != '0'*40 for v in (source,tree))
          for selector, expected in (('HEAD^{commit}',source),('HEAD^{tree}',tree)):
              result = subprocess.run(['git','-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false','rev-parse','--verify',selector],capture_output=True,timeout=20)
              assert result.returncode == 0 and result.stdout in {(expected+'\n').encode(),(expected+'\r\n').encode()} and not result.stderr
      - name: Provision exact existing Rust compiler
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        timeout-minutes: 5
        with:
          toolchain: 1.99.0
      - name: Validate owned compiler and profile cleanup fixtures
        timeout-minutes: 4
        env:
          MORPHEUS_WINDOWS_TINY_MSVC: '1'
        shell: python -I -B {0}
        run: |
          import contextlib, hashlib, io, json, os, platform, re, shutil, struct, sys, unittest, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          source, tree = os.environ['REVIEWED_TINY_SOURCE'], os.environ['REVIEWED_TINY_TREE']
          assert sys.platform == 'win32' and platform.machine() == 'AMD64' and struct.calcsize('P') == 8 and sys.version_info >= (3,12,4)
          sys.path.insert(0,str(Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)))
          from scripts import native_notice_source as N
          class Redirect(urllib.request.HTTPRedirectHandler):
              count = 0
              def redirect_request(self,request,fp,code,message,headers,url):
                  self.count += 1; parsed = urllib.parse.urlsplit(url)
                  assert self.count <= 3 and parsed.scheme == 'https' and not parsed.username and not parsed.password and not parsed.fragment and parsed.port in (None,443)
                  assert parsed.hostname in {'github.com','release-assets.githubusercontent.com','objects.githubusercontent.com'}
                  return super().redirect_request(request,fp,code,message,headers,url)
          class Bounded(io.StringIO):
              def write(self,value):
                  if self.tell()+len(value)>32768: raise ValueError('private test observation bound')
                  return super().write(value)
          scanner_root = None; scanner_identity = None; scanner_cleaned = False
          result = None; observation = None; route_error = False; privacy_names=()
          try:
              security=N.S.windows_security()
              scanner_root=security.create_root(security.path(Path.home().resolve(strict=True),directory=True))
              info=scanner_root.lstat(); scanner_identity=(info.st_dev,info.st_ino)
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),Redirect())
              with opener.open('https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip',timeout=60) as response:
                  data=response.read(32*1024**2+1)
              assert 0<len(data)<=32*1024**2 and hashlib.sha256(data).hexdigest()=='d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  entries=archive.infolist(); chosen=[p for p in entries if p.filename=='gitleaks.exe']
                  assert 0<len(entries)<=16 and sum(p.file_size for p in entries)<=64*1024**2 and len(chosen)==1
                  entry=chosen[0]
                  assert not entry.is_dir() and (entry.external_attr>>16)&0o170000 in (0,0o100000) and 0<entry.file_size<=32*1024**2
                  with archive.open(entry) as stream: binary=stream.read(32*1024**2+1)
                  assert len(binary)==entry.file_size and hashlib.sha256(binary).hexdigest()=='17157e2ee8b76fc8b1d8bee607a250e34b8a8023c8bc81822d4b5ee4d78fcb7c'
              scanner=scanner_root/'gitleaks.exe'; N.write_new(scanner,binary); N.checked(scanner,private=True)
              os.environ['MORPHEUS_TINY_GITLEAKS']=str(scanner)
              # No unittest traceback, exception body or compiler output is public.
              observed, private_errors=Bounded(),Bounded()
              prefix='scripts.tests.test_windows_capture_acceptance.InstalledWindowsUpdateTests.'
              privacy_names=('scripts.tests.test_package.NativeNoticeWindowsOwnershipTests.test_private_child_creation_uses_protected_user_system_acl_and_rejects_existing_writers',
                             prefix+'test_failed_job_drain_latches_cleanup_failure_and_prevents_recovery_launch',
                             prefix+'test_update_owned_readonly_cleanup_wires_outer_authority_and_refuses_foreign_or_changed_inner_root')
              names=privacy_names+(prefix+'test_update_workspace_actual_windows_acl_source_reads_and_cleanup_preserve_actor_parent',)
              class SelectedResults(unittest.TextTestResult):
                  def __init__(self,*args,**kwargs):
                      super().__init__(*args,**kwargs); self.successful_ids=set()
                  def addSuccess(self,test):
                      super().addSuccess(test); self.successful_ids.add(test.id())
              with contextlib.redirect_stdout(observed),contextlib.redirect_stderr(private_errors):
                  selected=[unittest.defaultTestLoader.loadTestsFromName(name) for name in names]
                  assert all(suite.countTestCases()==1 and [case.id() for case in suite]==[name] for suite,name in zip(selected,names))
                  suite=unittest.TestSuite(selected)
                  result=unittest.TextTestRunner(stream=private_errors,verbosity=2,resultclass=SelectedResults).run(suite)
              lines=observed.getvalue().splitlines()
              assert len(lines)==1 and lines[0].startswith('MORPHEUS_WINDOWS_TINY_MSVC ')
              observation=json.loads(lines[0].split(' ',1)[1])
              assert type(observation) is dict and set(observation)=={'schema','check','source_revision','source_tree','phase','build_passed','binary_passed','private_scan_passed','cleanup_passed','cleanup_refusal','job_closed','job_cleanup_failed','readonly_retries','compiler_hint','native_failure_cause_proven','installed_update_qualified'}
              assert observation['schema']==1 and observation['check']=='tiny_owned_windows_msvc' and observation['source_revision']==source and observation['source_tree']==tree
              assert observation['phase'] in {'private_environment','toolchain','fixture','cargo_build','binary'}
              booleans=('build_passed','binary_passed','private_scan_passed','cleanup_passed','job_closed','job_cleanup_failed','native_failure_cause_proven','installed_update_qualified')
              assert all(type(observation[k]) is bool for k in booleans)
              assert observation['native_failure_cause_proven'] is False and observation['installed_update_qualified'] is False
              assert type(observation['readonly_retries']) is int and 0<=observation['readonly_retries']<=300000
              refusal=observation['cleanup_refusal']
              if refusal is not None:
                  assert type(refusal) is dict and set(refusal) in ({'category','errno','winerror'},{'category','errno','winerror','predicate'})
                  assert refusal['category'] in {'os_error','guard','value_error','other'}
                  assert all(refusal[k] is None or type(refusal[k]) is int and 0<=refusal[k]<=65535 for k in ('errno','winerror'))
                  if 'predicate' in refusal: assert refusal['category']=='guard' and refusal['predicate'] in {'root_identity','inventory_limit','inventory_symlink','inventory_reparse','callback_scope','callback_root_identity','inner_removed','workspace_scope','workspace_identity','workspace_empty','workspace_removed'}
              hint=observation['compiler_hint']
              if hint is not None:
                  assert observation['cleanup_passed'] is True and observation['private_scan_passed'] is True
                  assert type(hint) is dict and set(hint)=={'schema','check','status','error_codes','stderr_classes','private_log_scan_passed','passed','distribution_ready'}
                  assert hint['schema']==1 and hint['check']=='windows_update_cargo_failure' and type(hint['status']) is int and 0<hint['status']<=0xffffffff
                  assert hint['private_log_scan_passed'] is True and hint['passed'] is False and hint['distribution_ready'] is False
                  assert type(hint['error_codes']) is list and len(hint['error_codes'])<=16 and all(type(v) is str and re.fullmatch(r'(?:E|C)[0-9]{4}|LNK[0-9]{4}',v) for v in hint['error_codes'])
                  assert type(hint['stderr_classes']) is list and len(hint['stderr_classes'])<=16 and all(v in {'manifest','lockfile','checkout','network','tls','auth','other','native_sdk','linker','toolchain'} for v in hint['stderr_classes'])
          except BaseException:
              route_error=True; observation=None
          finally:
              if scanner_root is not None:
                  try:
                      N.checked(scanner_root,directory=True,private=True)
                      current=scanner_root.lstat(); assert (current.st_dev,current.st_ino)==scanner_identity
                      assert all(p.name=='gitleaks.exe' for p in scanner_root.iterdir())
                      N.checked(scanner_root/'gitleaks.exe',private=True)
                      shutil.rmtree(scanner_root); assert not scanner_root.exists(); scanner_cleaned=True
                  except BaseException: route_error=True; observation=None
          if observation is not None and scanner_cleaned:
              print('MORPHEUS_WINDOWS_TINY_MSVC '+json.dumps(observation,sort_keys=True))
          exact_test=result is not None and result.testsRun==4 and not result.skipped
          production_regressions_passed=bool(result is not None and len(privacy_names)==3 and set(privacy_names)<=result.successful_ids)
          labels=('profile_handle_guards','compiler_job_lifecycle','structural_cleanup_preflight','actual_canary_and_tiny')
          unsuccessful_checks=[label for label,name in zip(labels,privacy_names+(prefix+'test_update_workspace_actual_windows_acl_source_reads_and_cleanup_preserve_actor_parent',)) if result is None or name not in result.successful_ids] if len(privacy_names)==3 else list(labels)
          passed=bool(not route_error and scanner_cleaned and exact_test and production_regressions_passed and result.wasSuccessful() and observation is not None and all(observation[k] is True for k in ('build_passed','binary_passed','private_scan_passed','cleanup_passed','job_closed')) and observation['job_cleanup_failed'] is False and observation['readonly_retries']==2)
          print('MORPHEUS_WINDOWS_TINY_ROUTE '+json.dumps({'schema':1,'source_revision':source,'source_tree':tree,'selected_tests':4,'production_regressions_passed':production_regressions_passed,'unsuccessful_checks':unsuccessful_checks,'tests_run':result.testsRun if result else 0,'skipped':len(result.skipped) if result else 0,'scanner_root_cleanup_passed':scanner_cleaned,'closed_observation_available':observation is not None,'passed':passed,'synthetic_only':True,'installed_update_qualified':False},sort_keys=True))
          raise SystemExit(0 if passed else 1)
