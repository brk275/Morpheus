# Temporary diagnostic ref only. NEVER merge this CI replacement into main.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-bridge-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    name: Compile reviewed AX bridge (${{ matrix.os }})
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/macos-bridge-compile'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and query the exact reviewed bridge only
        env:
          REVIEWED_BRIDGE_SHA256: 43ca6caf5c36a366883ec24ba1ce16d78b43bc3bde5409003f2d733b81c6c868
        run: |
          python3 -I - <<'PY_CHECK'
          import hashlib, json, os, pathlib, platform, subprocess, tempfile
          source = pathlib.Path("scripts/macos_package_ui.swift")
          expected = os.environ["REVIEWED_BRIDGE_SHA256"]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          with tempfile.TemporaryDirectory(prefix="morpheus-bridge-") as directory:
              work = pathlib.Path(directory)
              binary = work / "bridge"
              with (work / "private.log").open("wb") as log:
                  result = subprocess.run(["xcrun", "swiftc", "-O", "-module-name", "MorpheusAxBridge", "-o", str(binary), str(source)], stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, timeout=180)
                  if result.returncode != 0 or not binary.is_file():
                      print(json.dumps({"check":"reviewed_macos_ax_bridge", "compile":False, "app_launched":False, "raw_output_public":False}, sort_keys=True), flush=True)
                      raise SystemExit(1)
                  with (work / "reply.jsonl").open("wb") as reply:
                      result = subprocess.run([str(binary)], input=b'{"op":"permissions"}\n{"op":"exit"}\n', stdout=reply, stderr=log, timeout=15)
              raw = (work / "reply.jsonl").read_bytes()
              assert result.returncode == 0 and 0 < len(raw) <= 1024
              records = [json.loads(line) for line in raw.splitlines()]
              assert records[0] == {"ok":True,"ready":True} and len(records) == 2
              state = records[1]
              assert set(state) == {"ok","accessibility","post_event"}
              assert all(type(state[key]) is bool for key in state) and state["ok"]
              print(json.dumps({"check":"reviewed_macos_ax_bridge", "compile":True, "architecture":platform.machine(), "source_sha256":expected, "binary_sha256":hashlib.sha256(binary.read_bytes()).hexdigest(), "accessibility_trusted":state["accessibility"], "keyboard_post_allowed":state["post_event"], "app_launched":False, "tree_read":False, "input_sent":False, "permission_requested":False, "profile_created":False, "raw_output_public":False}, sort_keys=True), flush=True)
              assert state["accessibility"] and state["post_event"]
          PY_CHECK
