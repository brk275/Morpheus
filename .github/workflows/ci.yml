# Temporary diagnostic ref only. NEVER merge this CI replacement into main.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-process-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  process:
    name: Native process contract (${{ matrix.os }})
    if: github.event.repository.private == false && github.repository == 'brk275/Morpheus' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/macos-process-preflight'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check real Darwin ownership and anchored group cleanup with synthetic processes
        env:
          DRIVER_SHA256: e4554b694c15467247e6c644b22efba60faa19338feaec02abc05b8b547c3f92
          SMOKE_SHA256: 5c43340a70475f0550523f451287daf69857c751801ff71ebc0aec67e5e5b275
        run: python3 -I scripts/macos_process_probe.py
