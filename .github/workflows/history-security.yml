name: History scanner security
run-name: History scanner boundary - ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: History scanner boundary
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed standalone scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan complete history with reviewed fixture provenance
        shell: bash
        run: |
          python3 -I scripts/scan_history.py \
            --candidate "$PWD" --scanner "$RUNNER_TEMP/gitleaks/gitleaks" \
            --manifest scripts/public-fixtures.json \
            --evidence "$RUNNER_TEMP/morpheus-history-scan"
      - name: Exercise actual scanner boundaries and native scope selection
        env:
          MORPHEUS_REVIEWED_GITLEAKS: ${{ runner.temp }}/gitleaks/gitleaks
        run: python3 -m unittest scripts.tests.test_scan_history scripts.tests.test_ci_scope -v
