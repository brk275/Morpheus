name: Native WebRTC Mac source producer
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [mac-arm64, mac-x64]
        required: true
      xcode_app:
        description: Optional exact /Applications Xcode app basename for read-only full host inventory
        type: string
        default: ''
      phase:
        type: choice
        options: [preflight, stage, build]
        default: preflight
        required: true
      plan_sha256:
        description: Independently reviewed exact target pipeline plan SHA256 (stage/build)
        type: string
        default: ''
      publish_handoff:
        description: Save SDK-free source DATA only after free capacity and separate review
        type: boolean
        default: false
      cache_key:
        type: string
        default: ''
      cache_id:
        type: string
        default: ''
      handoff_sha256:
        type: string
        default: ''
      handoff_bytes:
        type: string
        default: ''
      admission_sha256:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: native-webrtc-source-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: ${{ inputs.target == 'mac-arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: ${{ inputs.phase == 'preflight' && 5 || 360 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Selected Mac read-only preflight or admitted producer
        id: producer
        uses: ./scripts/native_webrtc_macos
        with:
          target: ${{ inputs.target }}
          phase: ${{ inputs.phase }}
          xcode_app: ${{ inputs.xcode_app }}
          plan_sha256: ${{ inputs.plan_sha256 }}
          publish_handoff: ${{ inputs.publish_handoff && 'true' || 'false' }}
          cache_key: ${{ inputs.cache_key }}
          cache_id: ${{ inputs.cache_id }}
          handoff_sha256: ${{ inputs.handoff_sha256 }}
          handoff_bytes: ${{ inputs.handoff_bytes }}
          admission_sha256: ${{ inputs.admission_sha256 }}
        env:
          NATIVE_READ_TOKEN: ${{ github.token }}
      - name: Save exact SDK-free source DATA on trusted main
        if: inputs.phase == 'stage' && inputs.publish_handoff && steps.producer.outputs.cache_save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/native-webrtc-handoff/handoff.tar.gz
          key: ${{ steps.producer.outputs.cache_key }}
          enableCrossOsArchive: false
      - name: Bind actual saved cache identity
        if: inputs.phase == 'stage' && inputs.publish_handoff && steps.producer.outputs.cache_save == 'true'
        uses: ./scripts/native_webrtc_macos
        with:
          target: ${{ inputs.target }}
          phase: cache-receipt
          plan_sha256: ${{ inputs.plan_sha256 }}
          cache_key: ${{ steps.producer.outputs.cache_key }}
          handoff_sha256: ${{ steps.producer.outputs.handoff_sha256 }}
          handoff_bytes: ${{ steps.producer.outputs.handoff_bytes }}
        env:
          NATIVE_READ_TOKEN: ${{ github.token }}
