          persist-credentials: false
      - name: Require the exact independently reviewed source
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $expected = 'eb1be90873e3839b19f445871bd1283205c183bb'
