name: RTC device recovery workspace format check (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtc-device-recovery-format-d89a3370976659a4f2927cf0667dcc201a23bfb9
  cancel-in-progress: false
jobs:
  format:
    if: >-
      github.repository == 'brk275/Morpheus' &&
