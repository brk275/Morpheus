# TEMPORARY CHECK ONLY. NEVER MERGE THIS REPLACEMENT WORKFLOW.
name: RTC recovery workspace format check (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtc-recovery-format-only-e200b73d3edffe2db9ab7e50ed64ecbc7754afb5
  cancel-in-progress: false
jobs:
  format:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.ref == 'refs/heads/codex/rtc-recovery-format-only-20261027' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e200b73d3edffe2db9ab7e50ed64ecbc7754afb5
          persist-credentials: false
      - name: Require the exact independently reviewed source
        shell: bash
        run: |
          expected='e200b73d3edffe2db9ab7e50ed64ecbc7754afb5'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false rev-parse --verify HEAD)" = "$expected"
      - name: Install the existing pinned formatter
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Check workspace formatting before native builds
        shell: bash
        run: |
          cargo fmt --all -- --check
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false diff --quiet --exit-code -- Cargo.toml Cargo.lock
