        with:
          ref: d89a3370976659a4f2927cf0667dcc201a23bfb9
          persist-credentials: false
      - name: Require the exact independently reviewed source
        shell: bash
        run: |
          expected='d89a3370976659a4f2927cf0667dcc201a23bfb9'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false rev-parse --verify HEAD)" = "$expected"
