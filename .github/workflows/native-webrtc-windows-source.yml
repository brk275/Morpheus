name: Native WebRTC Windows x64 source producer

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only host preflight, DATA staging, or separately admitted native build
        type: choice
        required: true
        options: [preflight, stage, build]
      plan_sha256:
        description: Independently reviewed Windows pipeline plan SHA256 (stage/build)
        type: string
        default: ''
      bootstrap_python_sha256:
        description: Independently admitted exact hosted python.exe SHA256 (stage/build)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: native-webrtc-source-windows-x64
  cancel-in-progress: false

jobs:
  producer:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.phase == 'preflight' && 5 || 240 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read hosted tool identities without execution
        if: inputs.phase == 'preflight'
        shell: pwsh
        run: ./scripts/native_webrtc/windows_preflight.ps1
      - name: Run only the exact admitted Windows phase
        if: inputs.phase != 'preflight'
        shell: pwsh
        env:
          NATIVE_READ_TOKEN: ${{ github.token }}
          NATIVE_WINDOWS_PHASE: ${{ inputs.phase }}
          NATIVE_WINDOWS_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          NATIVE_WINDOWS_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_python_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $entryFailure = 'input'
          try {
            if ($env:NATIVE_WINDOWS_PHASE -notin @('stage', 'build') -or
                $env:NATIVE_WINDOWS_PLAN_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:NATIVE_WINDOWS_BOOTSTRAP_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'input' }
            $entryFailure = 'python_discovery'
            $commands = @(Get-Command python.exe -CommandType Application -All)
            if ($commands.Count -lt 1) { throw 'python' }
            $python = [IO.Path]::GetFullPath($commands[0].Source)
            $entryFailure = 'python_path'
            if ($python -notmatch '^[A-Za-z]:\\' -or $python.StartsWith('\\')) { throw 'python' }
            $item = Get-Item -LiteralPath $python -Force
            $parent = $item
            while ($null -ne $parent) {
              if ($parent.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'python' }
              $parent = if ($parent -is [IO.DirectoryInfo]) { $parent.Parent } else { $parent.Directory }
            }
            $entryFailure = 'python_identity'
            if ($item.PSIsContainer -or $item.Length -le 0 -or $item.Length -gt 268435456 -or
                (Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                  $env:NATIVE_WINDOWS_BOOTSTRAP_SHA256) { throw 'python' }
            # Fixed script/path/argv. No source hook, cmd /C, interpolated shell
            # command, dependency installation or host tool version probe.
            $entryFailure = 'python_invoke'
            $plan = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'native/webrtc/windows/pipeline-plan.json'
            & $python -I -B scripts/run_native_webrtc_windows.py --phase $env:NATIVE_WINDOWS_PHASE `
              --plan $plan --plan-sha256 $env:NATIVE_WINDOWS_PLAN_SHA256
            $entryFailure = 'python_exit'
            if ($LASTEXITCODE -ne 0) { throw 'phase' }
          } catch {
            $category = if ($entryFailure -cin @('input', 'python_discovery', 'python_path', 'python_identity', 'python_invoke', 'python_exit')) { $entryFailure } else { 'entry' }
            Write-Output ('MORPHEUS_NATIVE_WINDOWS_ENTRY failed category=' + $category)
            exit 1
          }
      # No artifact/install/upload/sign/release step or cache restore. Existing
      # quota and safe DATA cache contracts are unchanged; Windows intake must
      # be independently implemented/admitted before cross-job handoff is used.
