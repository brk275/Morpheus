# TEMPORARY CHECK ONLY. NEVER MERGE THIS REPLACEMENT WORKFLOW.
name: RTC recovery SDK preflight (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rtc-recovery-sdk-smoke-93d8dcce8cd7ab43d4c00f0a08bd444773b07234
  cancel-in-progress: false
jobs:
  sdk:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.ref == 'refs/heads/codex/rtc-recovery-sdk-smoke-20261027' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 93d8dcce8cd7ab43d4c00f0a08bd444773b07234
          persist-credentials: false
      - name: Require the exact independently reviewed source
        shell: bash
        run: |
          expected='93d8dcce8cd7ab43d4c00f0a08bd444773b07234'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false rev-parse --verify HEAD)" = "$expected"
      - name: Install the existing pinned formatter
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Check workspace formatting before native builds
        shell: bash
        run: |
          cargo fmt --all -- --check
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false diff --quiet --exit-code -- Cargo.toml Cargo.lock
      - name: Run the reviewed SDK library cases
        shell: bash
        run: |
          cargo test --locked -p matrix-rtc-call-sdk --lib
