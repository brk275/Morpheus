# Temporary source-review branch only. Never merge this workflow.
name: One-off Windows ancestry regression

on:
  push:
    branches: [codex/windows-ancestry-regression-8f-20261026]

permissions:
  contents: read

concurrency:
  group: oneoff-windows-ancestry-20261026
  cancel-in-progress: false

jobs:
  ancestry:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.ref == 'refs/heads/codex/windows-ancestry-regression-8f-20261026' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        # Preserve the exact authenticated Git blob bytes on Windows.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run exactly the real workflow-fragment ancestry regression
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or $PSVersionTable.PSVersion.ToString() -cne '7.6.7') { throw 'host' }
          # Exact bootstrap previously observed by the separately admitted basic preflight.
          $python = 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
          $checks = @(
            @($python, '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a', 104952),
            @('.github/workflows/native-webrtc-windows-source.yml', '7b2d96ba36375604953e8f3c4c0cb05ee3f592d1b5cb714c3904018976927df7', 4642),
            @('scripts/native_webrtc_macos/entry.cjs', '8b6005d0df82bcc69a0218101b68c3e05422f62e1ea80e91a7389393a365ea41', 12865),
            @('scripts/tests/test_native_webrtc_windows_inputs.py', '4ab35a3333f8c23d66c0637d16ab598d0ba2019e9f6d9ddd7b53066f443efa4d', 42669),
            @('scripts/run_native_webrtc_windows.py', '4468ba03a0c9bbf29465f3a13073d34aec497271f42c0498df639e6b5c5fac42', 43699)
          )
          foreach ($check in $checks) {
            $item = Get-Item -LiteralPath $check[0] -Force
            $parent = $item
            while ($null -ne $parent) {
              if ($parent.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'input' }
              $parent = if ($parent -is [IO.DirectoryInfo]) { $parent.Parent } else { $parent.Directory }
            }
            if ($item.PSIsContainer -or $item.Length -ne $check[2] -or
                (Get-FileHash -LiteralPath $check[0] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $check[1]) { throw 'input' }
          }
          & $python -I -B scripts/tests/test_native_webrtc_windows_inputs.py WindowsNativeInputsTests.test_actual_entry_wrapped_file_and_raw_directory_ancestry -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
