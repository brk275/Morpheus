# Temporary source-review branch only. Never merge this workflow.
name: One-off Windows host reader regression

on:
  push:
    branches: [codex/windows-host-reader-59e-20261026]

permissions:
  contents: read

concurrency:
  group: oneoff-windows-host-reader-20261026
  cancel-in-progress: false

jobs:
  host-reader:
    if: >-
      github.repository == 'brk275/Morpheus' &&
      github.ref == 'refs/heads/codex/windows-host-reader-59e-20261026' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        # Preserve the exact authenticated Git blob bytes on Windows.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run exactly the actual bounded Windows host reader regression
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or $PSVersionTable.PSVersion.ToString() -cne '7.6.7') { throw 'host' }
          # Exact bootstrap previously observed by the separately admitted basic preflight.
          $python = 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
          $checks = @(
            @($python, '4d6f5f81a4bca11191c4c7c6b43632694d0a4ce74e068619d8fdc161d469859a', 104952),
            @('.github/workflows/native-webrtc-windows-source.yml', '1b9d6cb231face182efd178ce482084900795965613e31a4bfe625c2f04fe0ef', 4969),
            @('scripts/native_webrtc/windows_preflight.ps1', '3a63353d4f6aef5a3f1517207997c11c511fbb3b48d0c7a75a312b1dbf7440ef', 21456),
            @('scripts/tests/test_native_webrtc_windows_inputs.py', '0c1152a30e94358addb725becec939883fc906cb9628d1b3d2d5e466db38458c', 57180),
            @('scripts/run_native_webrtc_windows.py', 'f9cfa589dc267bdccb9c4422ec0445098895b90f42db025a42f2e7196157acd6', 47087)
          )
          foreach ($check in $checks) {
            $item = Get-Item -LiteralPath $check[0] -Force
            $parent = $item
            while ($null -ne $parent) {
              if ($parent.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'input' }
              $parent = if ($parent -is [IO.DirectoryInfo]) { $parent.Parent } else { $parent.Directory }
            }
            if ($item.PSIsContainer -or $item.Length -ne $check[2] -or
                (Get-FileHash -LiteralPath $check[0] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $check[1]) { throw 'input' }
          }
          & $python -I -B scripts/tests/test_native_webrtc_windows_inputs.py WindowsNativeInputsTests.test_host_inventory_actual_read_handles_paths_and_limits -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
