name: Package validation

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full reviewed commit ID (blank builds this workflow's main revision)
        type: string
        required: false
        default: ""
      platform:
        description: Platforms affected by this package change (all for release candidates)
        type: choice
        required: true
        default: linux
        options: [linux, windows, macos, all]
      linux_formats:
        description: Linux package formats (Debian deferred until a project email is configured)
        type: choice
        required: true
        default: appimage
        options: [both, appimage, deb]
      appimage_updates:
        description: Run installed signed AppImage update QA instead of ordinary Linux packaging
        type: boolean
        required: true
        default: false

      appimage_capture:
        description: Private installed AppImage fixed-client capture QA (Linux/AppImage only; source gate required)
        type: boolean
        required: true
        default: false

      source_bundle:
        description: Prepare and remove private Rust/workspace source evidence only (Linux/AppImage; no installer)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  # Independent platform requests can run together.
  # Every worker below still holds the exact candidate/OS lock shared with CI.
  group: package-qa-${{ github.ref }}-${{ inputs.platform }}
  # Let an in-flight packaging run finish and populate its cache.
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  scope:
    name: Select package platforms
    if: github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      source_revision: ${{ steps.scope.outputs.source_revision }}
      cache_write: ${{ steps.scope.outputs.cache_write }}
      source_bundle: ${{ steps.scope.outputs.source_bundle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select requested standard runners
        id: scope
        env:
          PACKAGE_SOURCE_REVISION: ${{ inputs.source_revision }}
          PACKAGE_PLATFORM: ${{ inputs.platform }}
          LINUX_FORMATS: ${{ inputs.linux_formats }}
          APPIMAGE_UPDATES: ${{ inputs.appimage_updates }}
          APPIMAGE_CAPTURE: ${{ inputs.appimage_capture }}
          SOURCE_BUNDLE: ${{ inputs.source_bundle }}
        shell: bash
        run: |
          set -euo pipefail
          # AppImage stays explicit; never remap default/all/DEB selections.
          if [[ "$PACKAGE_PLATFORM" == linux || "$PACKAGE_PLATFORM" == all ]]; then
            test "$LINUX_FORMATS" = appimage
          fi
          python3 scripts/package_scope.py
      - name: Check out selected source for independent scanning
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.scope.outputs.source_revision }}
          path: selected-source
          fetch-depth: 0
          persist-credentials: false
      - name: Scan selected source before any package worker executes it
        shell: bash
        env:
          SELECTED_SOURCE: ${{ steps.scope.outputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          candidate="$GITHUB_WORKSPACE/selected-source"
          test "$(git -C "$candidate" rev-parse HEAD)" = "$SELECTED_SOURCE"
          # The reviewed history scanner and its exact fixture manifest come
          # from this immutable workflow revision, never from the candidate;
          # nothing in selected-source is imported or executed.
          trusted="$RUNNER_TEMP/package-history-trusted"
          mkdir "$trusted"
          for input in scan_history.py public-fixtures.json; do
            git -C "$GITHUB_WORKSPACE" show --no-ext-diff --no-textconv \
              "$GITHUB_SHA:scripts/$input" > "$trusted/$input"
          done
          echo "4acde7ed74259339d9494b5e2d52aff42e1317bbdf23400cc67bf7bf3085caef  $trusted/scan_history.py" | sha256sum --check --status
          archive="$RUNNER_TEMP/package-source-gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/package-source-scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/package-source-scanner" gitleaks
          # The scanner verifies this executable and scans a bare mirror of
          # the complete fetched history (--all) with default rules only:
          # --ignore-gitleaks-allow, an empty ignore file and no candidate
          # config. Only reviewed public fixtures are excepted, by exact
          # fingerprint and blob. Its reports stay in the private runner temp
          # directory; the log shows only its closed summary (counts, the
          # scanned source and hashes).
          evidence="$RUNNER_TEMP/package-history-scan"
          /usr/bin/python3 -I -B "$trusted/scan_history.py" \
            --candidate "$candidate" --scanner "$RUNNER_TEMP/package-source-scanner/gitleaks" \
            --manifest "$trusted/public-fixtures.json" --evidence "$evidence"
          # That scan must have covered exactly the selected candidate.
          /usr/bin/python3 -I -B -c '
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          covered = summary.get("source") == sys.argv[2]
          raise SystemExit(0 if covered and summary.get("unexpected_findings") == 0
                           else "The history scan did not cover the selected source.")
          ' "$evidence/summary.json" "$SELECTED_SOURCE"

  package:
    name: Package validation (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.source_bundle != 'true' && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    runs-on: ${{ matrix.os }}
    # CI and packaging for the same platform/candidate share this lock.
    concurrency:
      group: native-${{ needs.scope.outputs.source_revision }}-${{ matrix.os }}
      cancel-in-progress: false
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      MORPHEUS_PACKAGE_SOURCE_REVISION: ${{ needs.scope.outputs.source_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity before host provisioning
        if: runner.os == 'Linux'
        shell: bash
        env:
          REVIEWED_SOURCE: ${{ needs.scope.outputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
      - name: Tighten hosted notice tree permissions before candidate imports
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Bootstrap from this immutable reviewed workflow revision, including
          # when the selected package source predates the provisioning helper.
          git show --no-ext-diff --no-textconv "$GITHUB_SHA:scripts/harden_linux_notice_host.py" |
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,ImageOS /usr/bin/python3 -I -B -
      - name: Verify exact reviewed source checkout
        run: python3 scripts/package_revision.py --verify-checkout .
      - name: Check Windows keyboard host before building
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'Windows keyboard QA requires an interactive hosted desktop'
          }
          python3 scripts/windows_package_ui.py --check-host
      - name: Require reviewed installed capture adapter
        if: runner.os == 'Linux' && !inputs.appimage_updates
        run: python3 packaging/linux/package_appimage.py --check-readiness
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libclang-dev libdbus-1-dev libegl-dev \
            libfontconfig1-dev libfuse2t64 libgbm-dev libglib2.0-dev \
            libpipewire-0.3-dev libssl-dev libsystemd-dev systemd-dev libudev-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxi6 libxrandr-dev pkg-config xvfb
      - name: Linux installed update QA dependencies
        if: runner.os == 'Linux' && inputs.appimage_updates
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl ca-certificates python3-pyatspi python3-gi at-spi2-core dbus-x11
      - name: Linux installed capture QA dependencies
        if: runner.os == 'Linux' && !inputs.appimage_updates
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates python3-pyatspi python3-gi at-spi2-core dbus-x11 \
            gnome-keyring libsecret-tools libglib2.0-bin libdrm-dev libinih-dev \
            libsystemd-dev systemd-dev meson ninja-build wayland-protocols sway swaybg \
            pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-wlr
      - name: Prepare pinned Linux QA scanner
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scanner_root="$(mktemp -d "$RUNNER_TEMP/morpheus-package-scanner.XXXXXXXX")"
          archive="$scanner_root/gitleaks.tar.gz"
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --noproxy '*' --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 33554432 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | /usr/bin/sha256sum --check --status
          /usr/bin/tar -xzf "$archive" -C "$scanner_root" --no-same-owner --no-same-permissions gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $scanner_root/gitleaks" | /usr/bin/sha256sum --check --status
          chmod 500 "$scanner_root/gitleaks"
          printf 'MORPHEUS_QA_GITLEAKS=%s\n' "$scanner_root/gitleaks" >> "$GITHUB_ENV"
      - name: Provision exact reviewed static-runtime host inputs
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # EXIT may run while the failed command group still redirects stdout.
          # Keep a separate descriptor for closed, non-secret status only.
          exec 3>&1
          private="$(mktemp -d "$RUNNER_TEMP/morpheus-runtime-host.XXXXXXXX")"
          mkdir "$private/debs"
          : > "$private/provision.log"
          : > "$private/empty.ignore"
          printf '[extend]\nuseDefault = true\n' > "$private/gitleaks.toml"
          root_cache=''
          stage=inputs
          input=0
          finish() {
            result=$?
            command_result=$result
            trap - EXIT
            if [[ -n "$root_cache" ]]; then
              if ! sudo --non-interactive /usr/bin/rm -rf -- "$root_cache" >> "$private/provision.log" 2>&1; then
                result=1
                stage=cleanup
              fi
            fi
            if ! (cd "$private" && "$MORPHEUS_QA_GITLEAKS" stdin --config "$private/gitleaks.toml" \
                  --gitleaks-ignore-path "$private/empty.ignore" --ignore-gitleaks-allow --redact=100 --no-banner \
                  < "$private/provision.log" > /dev/null 2>&1); then
              result=1
              stage=scan
            fi
            if ! rm -rf -- "$private"; then
              result=1
              stage=cleanup
            fi
            if [[ "$result" == 0 ]]; then
              printf 'MORPHEUS_RUNTIME_HOST_PROVISION {"passed":true,"packages":18,"hashed_inputs":634}\n' >&3
            else
              printf 'MORPHEUS_RUNTIME_HOST_PROVISION {"passed":false,"stage":"%s","input":%s,"exit_code":%s}\n' "$stage" "$input" "$command_result" >&3
            fi
            exit "$result"
          }
          trap finish EXIT
          download_pinned_runtime_deb() {
            local output="$1" bytes="$2" url="$3" attempt result
            # Retry only interrupted transfers. HTTP, certificate, local-write
            # and checksum/size failures must still stop the provisioning gate.
            for attempt in 1 2 3; do
              if /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
                --noproxy '*' --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 \
                --max-filesize "$bytes" "$url" --output "$output"; then
                return 0
              else
                result=$?
              fi
              case "$result" in
                18|28|52|55|56) ;;
                *) return "$result" ;;
              esac
              if [[ "$attempt" == 3 ]]; then
                return "$result"
              fi
              # A retry always begins empty; partial bytes are never resumed.
              /usr/bin/rm -f -- "$output"
              /bin/sleep 2
            done
          }
          {
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            git show --no-ext-diff --no-textconv "$GITHUB_SHA:packaging/linux/runtime-build-host.json" > "$private/runtime-host.json"
            echo "f5a8b93d2d6d670e66c085184fe49135bf7634530838d9fdfed7d7e0390b6656  $private/runtime-host.json" | /usr/bin/sha256sum --check --status
            echo "f5a8b93d2d6d670e66c085184fe49135bf7634530838d9fdfed7d7e0390b6656  packaging/linux/runtime-build-host.json" | /usr/bin/sha256sum --check --status
            stage=download
            while IFS=$'\t' read -r file bytes digest url; do
              input=$((input + 1))
              download_pinned_runtime_deb "$private/debs/$file" "$bytes" "$url"
              test "$(/usr/bin/stat --format='%s' "$private/debs/$file")" = "$bytes"
              printf '%s  %s\n' "$digest" "$private/debs/$file" | /usr/bin/sha256sum --check --status
            done <<'PINNED_RUNTIME_HOST_DEBS'
          01-autoconf.deb	338946	cc3f9f7a1e576173fb59c36652c0a67c6426feae752b352404ba92dfcb1b26c9	https://archive.ubuntu.com/ubuntu/pool/main/a/autoconf/autoconf_2.71-3_all.deb
          02-automake.deb	558172	5ae9a98e73545002cd891f028859941af2a3c760cb6190e635c7ef36953912de	https://archive.ubuntu.com/ubuntu/pool/main/a/automake-1.16/automake_1.16.5-1.3ubuntu1_all.deb
          03-libtool.deb	166404	9d1d707179675d38e024bb13613b1d99e0d33fa6c45e5f3bcba19340781781d3	https://archive.ubuntu.com/ubuntu/pool/main/libt/libtool/libtool_2.4.7-7build1_all.deb
          04-libtool-bin.deb	84062	23959c8be74b4433d635c76e61a6c4bb62f10d3899362598c53173e8e57c0f8a	https://archive.ubuntu.com/ubuntu/pool/main/libt/libtool/libtool-bin_2.4.7-7build1_amd64.deb
          05-m4.deb	243640	30ea715845a1863abd55d11e47ab91513130bf347852d4cdeae69e9d98fa795c	https://archive.ubuntu.com/ubuntu/pool/main/m/m4/m4_1.4.19-4build1_amd64.deb
          06-make.deb	179752	1fe6a815b56c7b6e9ce4086a363f09444bbd0a0d30e230c453d0b78e44b57a99	https://archive.ubuntu.com/ubuntu/pool/main/m/make-dfsg/make_4.3-4.1build2_amd64.deb
          07-meson.deb	603950	5a9ab497255cc51f97866c359fc5cc75a1be4890ad376e471ca45d76bbea4803	https://archive.ubuntu.com/ubuntu/pool/universe/m/meson/meson_1.3.2-1ubuntu1_all.deb
          08-ninja-build.deb	128926	6a17f76a0f75586f1292f6c61a9b07fd0dec963baf6a102b17673f601c6b323a	https://archive.ubuntu.com/ubuntu/pool/universe/n/ninja-build/ninja-build_1.11.1-2_amd64.deb
          09-pkgconf-bin.deb	20730	7a812f05ee1610154b433e2ad54f6e4163fcbb306b9fb31afe959afb2e5e1545	https://archive.ubuntu.com/ubuntu/pool/main/p/pkgconf/pkgconf-bin_1.8.1-2build1_amd64.deb
          10-binutils-x86-64-linux-gnu.deb	2462744	1e510a15f30208d39edcd840e48f26a77bbca7c417805eeccb1e3f7de198ef29	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils-x86-64-linux-gnu_2.42-4ubuntu2.10_amd64.deb
          11-cpp-13-x86-64-linux-gnu.deb	10714542	2ca48bf0c2d6465bc39322899715a85d934b4d7442dd5586a7bebbe3ce0f806b	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/cpp-13-x86-64-linux-gnu_13.3.0-6ubuntu2~24.04.1_amd64.deb
          12-gcc-13-x86-64-linux-gnu.deb	21084546	a134b0319a82d14581b3a14820d2832af4ec9778ed8b9b4ddaeecfb0555ec325	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/gcc-13-x86-64-linux-gnu_13.3.0-6ubuntu2~24.04.1_amd64.deb
          13-libgcc-13-dev.deb	2680642	cd689db2691edaa10f37329307292796bb599e722e0505c79e14caaa1fe9a93a	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/libgcc-13-dev_13.3.0-6ubuntu2~24.04.1_amd64.deb
          14-linux-libc-dev.deb	1595188	fec8e4a308c03cd98dace67370a8d5a8031c36741796065c9f6e3f9548ab0cd2	https://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-libc-dev_6.8.0-147.147_amd64.deb
          15-patch.deb	104048	fb7d78ed25c2788a607802270f3c28ac5ed6857bfb6cce9f73ad2cafac9159b3	https://archive.ubuntu.com/ubuntu/pool/main/p/patch/patch_2.7.6-7build3_amd64.deb
          16-binutils-common.deb	240286	d136073f5e2153f3df11c1d08d66727b9466b28ff483f50085f14bbe3464b5ee	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils-common_2.42-4ubuntu2.10_amd64.deb
          17-gcc-13-base.deb	51616	e859aca26585bb91113a451f1e66bc0e5283cb08797d679aacc1d936ae6dff8e	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/gcc-13-base_13.3.0-6ubuntu2~24.04.1_amd64.deb
          18-libbinutils.deb	576834	064dce00ce94e1fc2d33779cb0071088f4c8aac79e85345f2e78a020f7d14699	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/libbinutils_2.42-4ubuntu2.10_amd64.deb
          PINNED_RUNTIME_HOST_DEBS
            input=0
            stage=install
            # No resolver fallback, --fix-broken or force-depends. Missing exact
            # matching siblings are pinned below; ambient dependencies must pass
            # the no-download consistency check before any build.
            root_cache="$(sudo --non-interactive /usr/bin/mktemp -d /var/tmp/morpheus-runtime-host.XXXXXXXX)"
            [[ "$root_cache" =~ ^/var/tmp/morpheus-runtime-host\.[A-Za-z0-9]{8}$ ]]
            for file in "$private"/debs/*.deb; do
              sudo --non-interactive /usr/bin/install -o 0 -g 0 -m 0600 -- "$file" "$root_cache/$(basename "$file")"
            done
            while IFS=$'\t' read -r file bytes digest url; do
              printf '%s  %s\n' "$digest" "$root_cache/$file" | sudo --non-interactive /usr/bin/sha256sum --check --status
            done <<'PINNED_RUNTIME_HOST_RECHECK'
          01-autoconf.deb	338946	cc3f9f7a1e576173fb59c36652c0a67c6426feae752b352404ba92dfcb1b26c9	https://archive.ubuntu.com/ubuntu/pool/main/a/autoconf/autoconf_2.71-3_all.deb
          02-automake.deb	558172	5ae9a98e73545002cd891f028859941af2a3c760cb6190e635c7ef36953912de	https://archive.ubuntu.com/ubuntu/pool/main/a/automake-1.16/automake_1.16.5-1.3ubuntu1_all.deb
          03-libtool.deb	166404	9d1d707179675d38e024bb13613b1d99e0d33fa6c45e5f3bcba19340781781d3	https://archive.ubuntu.com/ubuntu/pool/main/libt/libtool/libtool_2.4.7-7build1_all.deb
          04-libtool-bin.deb	84062	23959c8be74b4433d635c76e61a6c4bb62f10d3899362598c53173e8e57c0f8a	https://archive.ubuntu.com/ubuntu/pool/main/libt/libtool/libtool-bin_2.4.7-7build1_amd64.deb
          05-m4.deb	243640	30ea715845a1863abd55d11e47ab91513130bf347852d4cdeae69e9d98fa795c	https://archive.ubuntu.com/ubuntu/pool/main/m/m4/m4_1.4.19-4build1_amd64.deb
          06-make.deb	179752	1fe6a815b56c7b6e9ce4086a363f09444bbd0a0d30e230c453d0b78e44b57a99	https://archive.ubuntu.com/ubuntu/pool/main/m/make-dfsg/make_4.3-4.1build2_amd64.deb
          07-meson.deb	603950	5a9ab497255cc51f97866c359fc5cc75a1be4890ad376e471ca45d76bbea4803	https://archive.ubuntu.com/ubuntu/pool/universe/m/meson/meson_1.3.2-1ubuntu1_all.deb
          08-ninja-build.deb	128926	6a17f76a0f75586f1292f6c61a9b07fd0dec963baf6a102b17673f601c6b323a	https://archive.ubuntu.com/ubuntu/pool/universe/n/ninja-build/ninja-build_1.11.1-2_amd64.deb
          09-pkgconf-bin.deb	20730	7a812f05ee1610154b433e2ad54f6e4163fcbb306b9fb31afe959afb2e5e1545	https://archive.ubuntu.com/ubuntu/pool/main/p/pkgconf/pkgconf-bin_1.8.1-2build1_amd64.deb
          10-binutils-x86-64-linux-gnu.deb	2462744	1e510a15f30208d39edcd840e48f26a77bbca7c417805eeccb1e3f7de198ef29	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils-x86-64-linux-gnu_2.42-4ubuntu2.10_amd64.deb
          11-cpp-13-x86-64-linux-gnu.deb	10714542	2ca48bf0c2d6465bc39322899715a85d934b4d7442dd5586a7bebbe3ce0f806b	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/cpp-13-x86-64-linux-gnu_13.3.0-6ubuntu2~24.04.1_amd64.deb
          12-gcc-13-x86-64-linux-gnu.deb	21084546	a134b0319a82d14581b3a14820d2832af4ec9778ed8b9b4ddaeecfb0555ec325	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/gcc-13-x86-64-linux-gnu_13.3.0-6ubuntu2~24.04.1_amd64.deb
          13-libgcc-13-dev.deb	2680642	cd689db2691edaa10f37329307292796bb599e722e0505c79e14caaa1fe9a93a	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/libgcc-13-dev_13.3.0-6ubuntu2~24.04.1_amd64.deb
          14-linux-libc-dev.deb	1595188	fec8e4a308c03cd98dace67370a8d5a8031c36741796065c9f6e3f9548ab0cd2	https://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-libc-dev_6.8.0-147.147_amd64.deb
          15-patch.deb	104048	fb7d78ed25c2788a607802270f3c28ac5ed6857bfb6cce9f73ad2cafac9159b3	https://archive.ubuntu.com/ubuntu/pool/main/p/patch/patch_2.7.6-7build3_amd64.deb
          16-binutils-common.deb	240286	d136073f5e2153f3df11c1d08d66727b9466b28ff483f50085f14bbe3464b5ee	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils-common_2.42-4ubuntu2.10_amd64.deb
          17-gcc-13-base.deb	51616	e859aca26585bb91113a451f1e66bc0e5283cb08797d679aacc1d936ae6dff8e	https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-13/gcc-13-base_13.3.0-6ubuntu2~24.04.1_amd64.deb
          18-libbinutils.deb	576834	064dce00ce94e1fc2d33779cb0071088f4c8aac79e85345f2e78a020f7d14699	https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/libbinutils_2.42-4ubuntu2.10_amd64.deb
          PINNED_RUNTIME_HOST_RECHECK
            stage=install_dpkg
            /usr/bin/timeout --kill-after=10s 300s sudo --non-interactive /bin/bash -c 'exec /usr/bin/dpkg --install -- "$1"/*.deb' _ "$root_cache"
            stage=install_consistency
            /usr/bin/timeout --kill-after=10s 60s sudo --non-interactive /usr/bin/apt-get --no-download check
            stage=verify
            /usr/bin/timeout --kill-after=10s 120s /usr/bin/python3 -I -B - "$private/runtime-host.json" <<'VERIFY_RUNTIME_HOST'
          import hashlib, json, os, pathlib, stat, subprocess, sys
          manifest = pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == "f5a8b93d2d6d670e66c085184fe49135bf7634530838d9fdfed7d7e0390b6656"
          spec = json.loads(manifest)
          assert len(spec["packages"]) == 18 and len(spec["files"]) == 634
          names = [pin["package"] for pin in spec["packages"]]
          query = subprocess.run(["/usr/bin/dpkg-query", "-W", "--showformat=${Package}\t${Version}\t${db:Status-Status}\n", *names],
                                 capture_output=True, timeout=20, check=True, env={"PATH":"/usr/bin:/bin", "LC_ALL":"C"})
          assert not query.stderr
          lines = query.stdout.decode("ascii").splitlines()
          assert len(lines) == len(names) and set(lines) == {pin["package"]+"\t"+pin["version"]+"\tinstalled" for pin in spec["packages"]}
          for name, pin in spec["files"].items():
              path = pathlib.Path(name).resolve(strict=True)
              for part in (path, *path.parents):
                  details = part.stat()
                  assert details.st_uid == 0 and details.st_mode & 0o022 == 0
              info = path.stat()
              assert stat.S_ISREG(info.st_mode) and info.st_size == pin["bytes"]
              with path.open("rb") as stream:
                  assert hashlib.file_digest(stream, "sha256").hexdigest() == pin["sha256"]
          VERIFY_RUNTIME_HOST
          } >> "$private/provision.log" 2>&1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Separate source/dependency cohorts before RustCache fallback keys.
          # In particular, legacy SDK extractions have no verified receipt.
          key: package-inputs-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          # Preserve trusted build dependencies when a later install check fails.
          cache-on-failure: true
          save-if: ${{ needs.scope.outputs.cache_write == 'true' && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
      - name: Install pinned Cargo Packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Prepare verified Windows NSIS tools
        if: runner.os == 'Windows'
        run: python3 scripts/windows_package_tools.py
      - name: Build unsigned QA package
        if: runner.os != 'Linux'
        run: python3 scripts/package.py --formats ${{ matrix.formats }}
      - name: Build and inspect canonical Linux QA AppImage
        if: runner.os == 'Linux' && !inputs.appimage_updates && !inputs.appimage_capture
        run: /usr/bin/python3 scripts/package.py --formats ${{ matrix.formats }} --gitleaks "$MORPHEUS_QA_GITLEAKS"
      - name: Install, inspect, launch and remove unsigned packages
        if: runner.os != 'Linux' || (!inputs.appimage_updates && !inputs.appimage_capture)
        timeout-minutes: 35
        run: python3 scripts/package_smoke.py --target ${{ matrix.label }} --formats ${{ matrix.formats }}
      - name: Test installed AppImage update and rollback
        if: runner.os == 'Linux' && inputs.appimage_updates
        env:
          MORPHEUS_FREE_HOSTED_UPDATE_QA: "1"
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/appimage_update_acceptance.py \
            --source "$GITHUB_WORKSPACE" --target-dir "$GITHUB_WORKSPACE/target" \
            --gitleaks "$MORPHEUS_QA_GITLEAKS" --execute-on-free-hosted-runner
      - name: Test actual installed AppImage capture and imported client bindings
        if: runner.os == 'Linux' && inputs.appimage_capture
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 packaging/linux/package_appimage.py --gitleaks "$MORPHEUS_QA_GITLEAKS"
      # Installers deliberately stay on the ephemeral runner. Public artifact
      # uploads and releases require the separate release acceptance gates.

  source_bundle:
    name: Private corresponding source evidence (Linux)
    needs: scope
    if: needs.scope.outputs.source_bundle == 'true' && github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-24.04
    concurrency:
      group: native-${{ needs.scope.outputs.source_revision }}-ubuntu-24.04
      cancel-in-progress: false
    timeout-minutes: 80
    env:
      MORPHEUS_PACKAGE_SOURCE_REVISION: ${{ needs.scope.outputs.source_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.scope.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source checkout
        run: /usr/bin/python3 -I -B scripts/package_revision.py --verify-checkout .
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
      - name: Prepare pinned source QA scanner
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          scanner_root="$RUNNER_TEMP/morpheus-source-scanner.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          mkdir "$scanner_root"
          printf 'MORPHEUS_SOURCE_SCANNER_ROOT=%s\n' "$scanner_root" >> "$GITHUB_ENV"
          archive="$scanner_root/gitleaks.tar.gz"
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --noproxy '*' --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | /usr/bin/sha256sum --check --status
          /usr/bin/tar -xzf "$archive" -C "$scanner_root" --no-same-owner --no-same-permissions gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $scanner_root/gitleaks" | /usr/bin/sha256sum --check --status
          chmod 500 "$scanner_root/gitleaks"
      - name: Acquire exact locked source inputs without builds
        timeout-minutes: 27
        run: /usr/bin/python3 -I -B packaging/linux/source_bundle_qa.py --prepare
      - name: Run the genuine outer source packaging command
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Acquisition has already stopped its own PID namespace. This is the
          # real outer route, which creates and owns its canonical namespace.
          RUNNER_TEMP="$MORPHEUS_SOURCE_QA_ROOT/canonical-temp" \
            /usr/bin/python3 -I -B scripts/package.py --formats appimage \
            --gitleaks "$MORPHEUS_SOURCE_SCANNER_ROOT/gitleaks" \
            --source-bundle-inputs "$MORPHEUS_SOURCE_QA_ROOT/plan.json" \
            --source-bundle-output "$MORPHEUS_SOURCE_QA_ROOT/output" \
            > "$MORPHEUS_SOURCE_QA_ROOT/logs/package.log" 2>&1
      - name: Verify source identity and remove all private source inputs and output
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MORPHEUS_SOURCE_QA_ROOT:-}" ]]; then
            printf 'MORPHEUS_SOURCE_QA {"passed":false,"stage":"not_prepared","cleanup_passed":true}\n'
            exit 1
          fi
          /usr/bin/python3 -I -B packaging/linux/source_bundle_qa.py \
            --finish "$MORPHEUS_SOURCE_QA_ROOT" --gitleaks "$MORPHEUS_SOURCE_SCANNER_ROOT/gitleaks"
      - name: Remove the private source scanner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'CLEANUP_SCANNER'
          import os, pathlib, shutil, stat
          value = os.environ.get("MORPHEUS_SOURCE_SCANNER_ROOT")
          if value:
              root = pathlib.Path(value)
              expected = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("morpheus-source-scanner." + os.environ["GITHUB_RUN_ID"] + "." + os.environ["GITHUB_RUN_ATTEMPT"])
              assert root == expected and root.resolve(strict=True) == root
              info = root.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid() and info.st_mode & 0o077 == 0
              assert shutil.rmtree.avoids_symlink_attacks
              shutil.rmtree(root)
              assert not root.exists()
          CLEANUP_SCANNER
      # No installer, build cache, source artifact upload or publication. Source
      # content/license compliance and all release gates remain unresolved.
