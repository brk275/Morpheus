name: Temporary rejected zlib input proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-inputs-93b08331aea82ce5358a548b44b82bb37f79b4c1
  cancel-in-progress: false
jobs:
  inputs:
    name: Rejected zlib input (Linux only)
    if: github.repository == 'brk275/Morpheus' && github.ref == 'refs/heads/codex/package-input-probe-93b083-20261022' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.actor == 'brk275' && github.triggering_actor == 'brk275' && github.event.sender.id == github.event.repository.owner.id
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 93b08331aea82ce5358a548b44b82bb37f79b4c1
          path: selected-source
          persist-credentials: false
          fetch-depth: 0
      - name: Independent history scan before candidate imports
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C selected-source rev-parse HEAD)" = 93b08331aea82ce5358a548b44b82bb37f79b4c1
          trusted="$RUNNER_TEMP/input-proof-trusted"
          mkdir "$trusted"
          for file in scan_history.py public-fixtures.json; do
            git show --no-ext-diff --no-textconv eddaade30497866aca6b677fedc9ea7bbd847ee1:scripts/"$file" > "$trusted/$file"
          done
          echo "4acde7ed74259339d9494b5e2d52aff42e1317bbdf23400cc67bf7bf3085caef  $trusted/scan_history.py" | sha256sum --check --status
          archive="$trusted/scanner.tar.gz"
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 3 \
            --noproxy '*' --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 \
            --max-filesize 33554432 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          /usr/bin/tar -xzf "$archive" -C "$trusted" --no-same-owner --no-same-permissions gitleaks
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $trusted/gitleaks" | sha256sum --check --status
          chmod 500 "$trusted/gitleaks"
          /usr/bin/python3 -I -B "$trusted/scan_history.py" --candidate "$GITHUB_WORKSPACE/selected-source" \
            --scanner "$trusted/gitleaks" --manifest "$trusted/public-fixtures.json" --evidence "$RUNNER_TEMP/input-history-proof"
          /usr/bin/python3 -I -B -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["source"]==sys.argv[2] and v["unexpected_findings"]==0' "$RUNNER_TEMP/input-history-proof/summary.json" 93b08331aea82ce5358a548b44b82bb37f79b4c1
      - name: Retrieve original pinned bytes without executing them
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          driver="$RUNNER_TEMP/package_input_probe.py"
          git show --no-ext-diff --no-textconv "$GITHUB_SHA:.github/probes/package_input_probe.py" > "$driver"
          echo "d6aee3586077411cae161863cfd38549db4cb6358922e22abdba6658fbc8a8b1  $driver" | sha256sum --check --status
          /usr/bin/python3 -I -B "$driver" parent "$GITHUB_WORKSPACE/selected-source" "$RUNNER_TEMP/input-proof-trusted/gitleaks"
