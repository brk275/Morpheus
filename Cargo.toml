[workspace]
resolver = "3"
# Keep vendored library development feature sets outside the application workspace.
exclude = ["vendor/image-webp", "vendor/cpal", "vendor/alsa", "vendor/matrix-sdk-crypto", "vendor/winit", "vendor/notify-rust", "vendor/mac-notification-sys", "vendor/tauri-winrt-notification", "vendor/i-slint-backend-winit", "vendor/matrix-rtc-call-sdk", "vendor/matrix-rtc-matrix-sdk", "vendor/libwebrtc", "vendor/livekit"]
members = [
    "crates/morpheus-app",
    "crates/morpheus-config",
    "crates/morpheus-matrix",
    "crates/morpheus-rtc",
    "crates/morpheus-ui-check",
    "vendor/lru",
    "vendor/livekit-api",
    "vendor/matrix-rtc-livekit",
    "vendor/matrix-rtc-transport",
    "vendor/matrix-rtc-core",
    "vendor/cargo-packager-updater",
    "vendor/matrix-sdk",
    "vendor/matrix-sdk-base",
    "vendor/matrix-sdk-search",
    "vendor/matrix-sdk-ui",
    "vendor/webrtc-sys-build",
]
default-members = [
    "crates/morpheus-app",
    "crates/morpheus-config",
    "crates/morpheus-matrix",
    "crates/morpheus-rtc",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/brk275/Morpheus"

[patch.crates-io]
# Same-version awaited remote settings send/queue admission.
livekit = { path = "vendor/livekit" }
# Same-version video warm-up retains only weak source ownership while waiting.
libwebrtc = { path = "vendor/libwebrtc" }
# Same-version OpenGL config preference; complete upstream source retained.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
# Same-version owned native notification operations; originals preserved.
notify-rust = { path = "vendor/notify-rust" }
mac-notification-sys = { path = "vendor/mac-notification-sys" }
tauri-winrt-notification = { path = "vendor/tauri-winrt-notification" }
# Same-version existing-delegate owned macOS termination; originals preserved.
winit = { path = "vendor/winit" }
# Same-version CPAL: retained, fallible macOS native shutdown.
cpal = { path = "vendor/cpal" }
# Same-version ALSA wrapper exposes consuming checked PCM close without a Drop retry.
alsa = { path = "vendor/alsa" }
# Bound lossless WebP entropy-tree amplification before allocating groups.
image-webp = { path = "vendor/image-webp" }
# Isolate pinned WebRTC PipeWire stubs from the system PipeWire API on Linux.
webrtc-sys = { path = "vendor/webrtc-sys" }
# Verify pinned SDK archives before unpacking without unsafe ZIP extraction.
webrtc-sys-build = { path = "vendor/webrtc-sys-build" }
cargo-packager-updater = { path = "vendor/cargo-packager-updater" }
lru = { path = "vendor/lru" }
# Enforce secure signaling URLs and prohibit authenticated redirects.
livekit-api = { path = "vendor/livekit-api" }
# Required by the pinned MatrixRTC SDK revision until its upstream dependency
# pin is released on crates.io.
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }
# The pinned Nokhwa AVFoundation path mislabels 8-bit NV12 as YUYV and blocks
# forever when a camera supplies no frame. Keep the two small upstream crates
# pinned locally until those fixes are available in a tested release.
nokhwa = { path = "vendor/nokhwa" }
nokhwa-bindings-macos = { path = "vendor/nokhwa-bindings-macos" }

[patch."https://github.com/element-hq/matrix-rust-rtc"]
# Preserve original stable slot authority before one canonical slot write.
matrix-rtc-matrix-sdk = { path = "vendor/matrix-rtc-matrix-sdk" }
# Retain the original bounded attachment stream for the first facade subscriber.
matrix-rtc-call-sdk = { path = "vendor/matrix-rtc-call-sdk" }
# Validate every local/remote focus before exchanging Matrix OpenID credentials.
matrix-rtc-livekit = { path = "vendor/matrix-rtc-livekit" }
matrix-rtc-transport = { path = "vendor/matrix-rtc-transport" }
# Renew encrypted call membership for a newly observed peer using normal room sends.
matrix-rtc-core = { path = "vendor/matrix-rtc-core" }

[patch."https://github.com/matrix-org/matrix-rust-sdk"]
# Preserve decrypted keyless sticky receipts without altering the keyed map.
matrix-sdk-base = { path = "vendor/matrix-sdk-base" }
# Keep locally consumed custom room state available through native sliding sync.
matrix-sdk-ui = { path = "vendor/matrix-sdk-ui" }

# Typed local search restrictions and normalized replacement indexing.
# Dependency resolution and compatibility remain subject to hosted verification.
matrix-sdk = { path = "vendor/matrix-sdk" }
matrix-sdk-search = { path = "vendor/matrix-sdk-search" }

# Same-revision bounded encrypted room-key preparation; upstream tests preserved.
matrix-sdk-crypto = { path = "vendor/matrix-sdk-crypto" }
