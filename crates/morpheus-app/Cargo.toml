[package]
name = "morpheus-app"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native desktop shell for the Morpheus Matrix client"
build = "build.rs"

[features]
default = []
native-calls = ["dep:morpheus-rtc"]

[dependencies]
slint = "=1.18.1"
morpheus-config = { path = "../morpheus-config" }
morpheus-matrix = { path = "../morpheus-matrix" }
morpheus-rtc = { path = "../morpheus-rtc", features = ["native-devices"], optional = true }
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
notify-rust = "=4.18.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "=3.6.1", default-features = false }
cargo-packager-updater = "=0.2.3"
directories = "6"
futures-util = "0.3"
mime_guess = "=2.0.5"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
url = "2"
webbrowser = "=1.2.4"
zeroize = "=1.9.1"

[build-dependencies]
slint-build = "=1.18.1"
