[package]
name = "morpheus-app"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native desktop shell for the Morpheus Matrix client"
build = "build.rs"

[features]
default = []
native-calls = ["dep:morpheus-rtc", "dep:symphonia-core", "dep:symphonia-bundle-mp3"]

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-fontique-011"] }
morpheus-config = { path = "../morpheus-config" }
morpheus-matrix = { path = "../morpheus-matrix" }
morpheus-rtc = { path = "../morpheus-rtc", features = ["native-devices"], optional = true }
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
notify-rust = "=4.18.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "=3.6.1", default-features = false }
cargo-packager-updater = "=0.2.3"
directories = "6"
emojis = { version = "=0.9.0", default-features = false }
futures-util = "0.3"
mime_guess = "=2.0.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
url = "2"
webbrowser = "=1.2.4"
zeroize = "=1.9.1"
# Only the direct MP3 reader/decoder: no metadata, artwork, RIFF or other codec.
symphonia-core = { version = "=0.6.1", default-features = false, optional = true }
symphonia-bundle-mp3 = { version = "=0.6.1", default-features = false, features = ["mp3"], optional = true }

[build-dependencies]
slint-build = "=1.18.1"
sha2 = "=0.10.9"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
