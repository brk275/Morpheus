[package]
name = "morpheus-matrix"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Matrix accounts, sync, rooms, and timelines for Morpheus"

[dependencies]
# MatrixRTC's native adapter is pinned to this Matrix SDK commit. Keep both
# crates at the same revision so their Client/Room types are identical.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["sqlite", "e2e-encryption", "experimental-search", "experimental-send-custom-to-device", "unstable-msc4354"] }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["unstable-msc4354"] }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
ruma = { version = "=0.17.0", features = ["markdown", "html"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
mime = "0.3"
eyeball-im = "0.9"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# Matrix's SQLite dependency otherwise links against a system sqlite3.lib,
# which is not provided by the standard Windows runner or a clean desktop.
libsqlite3-sys = { version = "=0.38.2", features = ["bundled-windows"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
