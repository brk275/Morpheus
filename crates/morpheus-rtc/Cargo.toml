[package]
name = "morpheus-rtc"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Native MatrixRTC integration boundary for Morpheus"

[features]
default = []
# This enables Element's native LiveKit/libwebrtc transport and its Matrix SDK
# adapter. The app must also drive matrix-sdk-ui's SyncService with MSC4354
# sticky events enabled; see README.md.
native-rtc = [
    "dep:matrix-rtc-call-sdk",
    "dep:matrix-rtc-core",
    "dep:matrix-rtc-transport",
    "dep:matrix-sdk",
    "dep:rustls",
    "dep:tokio",
]
# Native OS device backends are independent so packaging can enable the
# backends that have been verified for a target platform.
device-audio = ["native-rtc", "dep:cpal", "dep:tokio", "dep:futures-util"]
device-camera = ["native-rtc", "dep:nokhwa"]
device-screen = ["native-rtc", "dep:xcap", "dep:tokio", "dep:futures-util", "dep:zbus", "dep:pipewire", "dep:uuid"]
native-devices = ["device-audio", "device-camera", "device-screen"]

[dependencies]
serde_json = "1"
thiserror = "2"
url = "2"

# All three git dependencies must resolve to the same upstream revisions.
# matrix-rtc-call-sdk is not published on crates.io at this tag.
matrix-rtc-call-sdk = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0-rc.2", features = ["matrix-sdk"], optional = true }
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0-rc.2", optional = true }
matrix-rtc-transport = { git = "https://github.com/element-hq/matrix-rust-rtc", tag = "v0.5.0-rc.2", optional = true }
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", optional = true, features = ["experimental-send-custom-to-device", "unstable-msc4354"] }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
cpal = { version = "0.18.2", optional = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
nokhwa = { version = "0.10.11", default-features = true, features = ["input-native"], optional = true }
xcap = { version = "0.9.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", optional = true }
pipewire = { version = "0.10.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
futures-util = "0.3"
livekit = "=0.7.48"
morpheus-matrix = { path = "../morpheus-matrix" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
sha2 = "0.10"
webrtc-sys-build = "=0.3.18"

[target.'cfg(target_os = "linux")'.build-dependencies]
sha2 = "=0.10.9"
