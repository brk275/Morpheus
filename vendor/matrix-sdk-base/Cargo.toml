# Normalized from upstream c6ad52ecc09eaa36601f55effb0a48a533eb87dd; see MORPHEUS_PATCH.md.

[package]
authors = ["Damir Jeli\u0107 <poljar@termina.org.uk>"]
description = "The base component to build a Matrix client library."
edition = "2024"
keywords = ["matrix", "chat", "messaging", "ruma", "nio"]
license = "Apache-2.0"
name = "matrix-sdk-base"
repository = "https://github.com/matrix-org/matrix-rust-sdk"
rust-version = "1.96"
version = "0.19.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[features]
default = []
e2e-encryption = ["dep:matrix-sdk-crypto"]
js = ["matrix-sdk-common/js", "matrix-sdk-crypto?/js", "ruma/js", "matrix-sdk-store-encryption/js"]
qrcode = ["matrix-sdk-crypto?/qrcode"]
automatic-room-key-forwarding = ["matrix-sdk-crypto?/automatic-room-key-forwarding"]
experimental-send-custom-to-device = ["matrix-sdk-crypto?/experimental-send-custom-to-device"]
experimental-encrypted-state-events = ["e2e-encryption", "ruma/unstable-msc4362", "matrix-sdk-crypto?/experimental-encrypted-state-events"]
experimental-push-secrets = ["e2e-encryption", "matrix-sdk-crypto?/experimental-push-secrets"]
uniffi = ["dep:uniffi", "matrix-sdk-crypto?/uniffi", "matrix-sdk-common/uniffi"]
test-send-sync = ["matrix-sdk-common/test-send-sync", "matrix-sdk-crypto?/test-send-sync"]
testing = ["dep:assert_matches", "dep:http", "dep:matrix-sdk-test", "dep:strass", "matrix-sdk-crypto?/testing"]
unstable-msc4274 = []
unstable-msc4354 = ["ruma/unstable-msc4480"]
unstable-msc4426 = ["ruma/unstable-msc4426"]
experimental-element-recent-emojis = []
experimental-x509-identity-verification = ["e2e-encryption", "matrix-sdk-crypto/experimental-x509-identity-verification"]

[dependencies]
as_variant = { version = "1.3.0", default-features = false }
assert_matches = { version = "1.5.0", default-features = false, optional = true }
async-trait = { version = "0.1.92", default-features = false }
bitflags = { version = "2.13.2", default-features = false, features = ["serde"] }
decancer = { version = "3.3.3", default-features = false }
eyeball = { version = "0.8.8", default-features = false, features = ["tracing", "async-lock"] }
eyeball-im = { version = "0.9.1", default-features = false, features = ["tracing"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
growable-bloom-filter = { version = "2.1.1", default-features = false }
http = { version = "1.5.0", default-features = false, optional = true }
matrix-sdk-common = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-sdk-crypto = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", optional = true }
matrix-sdk-store-encryption = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-sdk-test = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
ruma = { version = "0.17.0", features = ["client-api-c", "compat-unset-avatar", "compat-upload-signatures", "compat-arbitrary-length-ids", "compat-tag-info", "compat-encrypted-stickers", "compat-lax-room-create-deser", "compat-lax-room-topic-deser", "unstable-msc1763", "unstable-msc3230", "unstable-msc3401", "unstable-msc3417", "unstable-msc3488", "unstable-msc3489", "unstable-msc4075", "unstable-msc4140", "unstable-msc4143", "unstable-msc4171", "unstable-msc4195", "unstable-msc4278", "unstable-msc4286", "unstable-msc4306", "unstable-msc4308", "unstable-msc4310", "unstable-msc4388", "unstable-msc2867", "unstable-msc3381", "unstable-msc4186", "unstable-msc4262", "rand"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "rc", "derive"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
strass = { version = "0.2.0", optional = true }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unicode-normalization = { version = "0.1.25", default-features = false }
uniffi = { version = "0.32.1", default-features = false, features = ["cargo-metadata"], optional = true }

[dev-dependencies]
anyhow = { version = "1.0.104", default-features = false }
assert_matches = { version = "1.5.0", default-features = false }
assign = "1.1.1"
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
http = { version = "1.5.0", default-features = false }
matrix-sdk-test = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-sdk-test-utils = { version = "0.19.1", git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
similar-asserts = { version = "2.0.0", default-features = false }
strass = { version = "0.2.0" }
stream_assert = { version = "0.1.1", default-features = false }

[target."cfg(not(target_family = \"wasm\"))".dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["sync", "rt-multi-thread", "macros"] }

[target."cfg(target_family = \"wasm\")".dev-dependencies]
wasm-bindgen-test = { version = "0.3.78", default-features = false, features = ["std"] }
getrandom3 = { version = "0.3.4", package = "getrandom", default-features = false, features = ["wasm_js"] }
gloo-timers = { version = "0.4.0", default-features = false, features = ["futures"] }

[lints.rust]
rust_2018_idioms = "warn"
semicolon_in_expressions_from_macros = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)", "cfg(ruma_unstable_exhaustive_types)"] }
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
assigning_clones = "allow"
box_default = "allow"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
inefficient_to_string = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
mut_mut = "warn"
needless_borrow = "warn"
nonstandard_macro_braces = "warn"
redundant_clone = "warn"
single_range_in_vec_init = "allow"
str_to_string = "warn"
todo = "warn"
unnecessary_semicolon = "warn"
unused_async = "warn"
