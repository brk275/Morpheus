# Normalized from upstream c6ad52ecc09eaa36601f55effb0a48a533eb87dd; see MORPHEUS_PATCH.md.

["package"]
"name" = "matrix-sdk-ui"
"description" = "GUI-centric utilities on top of matrix-rust-sdk (experimental)."
"version" = "0.19.1"
"edition" = "2024"
"repository" = "https://github.com/matrix-org/matrix-rust-sdk"
"license" = "Apache-2.0"
"rust-version" = "1.96"

["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"rustdoc-args" = ["--generate-link-to-definition"]

["features"]
"default" = ["rustls-aws-lc-rs"]
"js" = ["matrix-sdk/js"]
"uniffi" = ["dep:uniffi", "matrix-sdk/uniffi", "matrix-sdk-base/uniffi"]
"rustls-aws-lc-rs" = ["matrix-sdk/rustls-aws-lc-rs"]
"unstable-msc3956" = ["ruma/unstable-msc3956"]
"unstable-msc4274" = ["matrix-sdk/unstable-msc4274"]
"unstable-msc4354" = ["matrix-sdk/unstable-msc4354"]
"unstable-msc4426" = ["matrix-sdk/unstable-msc4426"]
"experimental-search" = ["matrix-sdk/experimental-search"]
"experimental-encrypted-state-events" = ["matrix-sdk-base/experimental-encrypted-state-events", "ruma/unstable-msc4362"]

["dependencies"]
"as_variant" = { "version" = "1.3.0", "default-features" = false }
"async-rx" = { "version" = "0.2.1", "default-features" = false, "features" = ["alloc"] }
"async-stream" = { "version" = "0.3.6", "default-features" = false }
"async_cell" = { "version" = "0.2.3", "default-features" = false }
"bitflags" = { "version" = "2.13.2", "default-features" = false }
"chrono" = { "version" = "0.4.45", "default-features" = false, "features" = ["clock", "std", "oldtime", "wasmbind"] }
"emojis" = { "version" = "0.9.0", "default-features" = false }
"eyeball" = { "version" = "0.8.8", "default-features" = false, "features" = ["tracing"] }
"eyeball-im" = { "version" = "0.9.1", "default-features" = false, "features" = ["tracing"] }
"eyeball-im-util" = { "version" = "0.11.0", "default-features" = false }
"futures-core" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"futures-util" = { "version" = "0.3.34", "default-features" = false, "features" = ["std"] }
"fuzzy-matcher" = { "version" = "0.3.7", "default-features" = false }
"growable-bloom-filter" = { "version" = "2.1.1", "default-features" = false }
"imbl" = { "version" = "7.0.2", "default-features" = false, "features" = ["serde"] }
"indexmap" = { "version" = "2.14.2", "default-features" = false }
"itertools" = { "version" = "0.15.0", "default-features" = false, "features" = ["use_std"] }
"matrix-sdk" = { "version" = "0.19.1", "default-features" = false, "features" = ["e2e-encryption"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"matrix-sdk-base" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"matrix-sdk-common" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"mime" = { "version" = "0.3.17", "default-features" = false }
"pin-project-lite" = { "version" = "0.2.17", "default-features" = false }
"ruma" = { "version" = "0.17.0", "features" = ["client-api-c", "compat-unset-avatar", "compat-upload-signatures", "compat-arbitrary-length-ids", "compat-tag-info", "compat-encrypted-stickers", "compat-lax-room-create-deser", "compat-lax-room-topic-deser", "unstable-msc1763", "unstable-msc3230", "unstable-msc3401", "unstable-msc3417", "unstable-msc3488", "unstable-msc3489", "unstable-msc4075", "unstable-msc4140", "unstable-msc4143", "unstable-msc4171", "unstable-msc4195", "unstable-msc4278", "unstable-msc4286", "unstable-msc4306", "unstable-msc4308", "unstable-msc4310", "unstable-msc4388", "html", "unstable-msc3381"] }
"serde" = { "version" = "1.0.229", "default-features" = false, "features" = ["std", "rc", "derive"] }
"serde_json" = { "version" = "1.0.151", "default-features" = false, "features" = ["std"] }
"thiserror" = { "version" = "2.0.20", "default-features" = false }
"tokio" = { "version" = "1.53.1", "default-features" = false, "features" = ["sync"] }
"tokio-stream" = { "version" = "0.1.19", "default-features" = false, "features" = ["sync"] }
"tracing" = { "version" = "0.1.44", "default-features" = false, "features" = ["std", "attributes"] }
"unicode-normalization" = { "version" = "0.1.25", "default-features" = false }
"unicode-segmentation" = { "version" = "1.13.3", "default-features" = false }
"uniffi" = { "version" = "0.32.1", "default-features" = false, "features" = ["cargo-metadata"], "optional" = true }

["dev-dependencies"]
"anyhow" = { "version" = "1.0.104", "default-features" = false }
"assert-json-diff" = { "version" = "2.0.2", "default-features" = false }
"assert_matches" = { "version" = "1.5.0", "default-features" = false }
"eyeball-im-util" = { "version" = "0.11.0", "default-features" = false }
"matrix-sdk" = { "version" = "0.19.1", "default-features" = false, "features" = ["testing", "sqlite", "rustls-aws-lc-rs"], "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"matrix-sdk-test" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"matrix-sdk-test-utils" = { "version" = "0.19.1", "git" = "https://github.com/matrix-org/matrix-rust-sdk", "rev" = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
"proptest" = { "version" = "1.11.0", "default-features" = false, "features" = ["std"] }
"strass" = { "version" = "0.2.0" }
"stream_assert" = { "version" = "0.1.1", "default-features" = false }
"tempfile" = { "version" = "3.27.0", "default-features" = false }
"url" = { "version" = "2.5.8", "default-features" = false }
"wiremock" = { "version" = "0.6.5", "default-features" = false }

["lints"]

["lints"."rust"]
"rust_2018_idioms" = "warn"
"semicolon_in_expressions_from_macros" = "warn"
"unused_extern_crates" = "warn"
"unused_import_braces" = "warn"
"unused_qualifications" = "warn"
"trivial_casts" = "warn"
"trivial_numeric_casts" = "warn"

["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(tarpaulin_include)", "cfg(ruma_unstable_exhaustive_types)"]

["lints"."clippy"]
"assigning_clones" = "allow"
"box_default" = "allow"
"cloned_instead_of_copied" = "warn"
"dbg_macro" = "warn"
"inefficient_to_string" = "warn"
"macro_use_imports" = "warn"
"manual_let_else" = "warn"
"mut_mut" = "warn"
"needless_borrow" = "warn"
"nonstandard_macro_braces" = "warn"
"redundant_clone" = "warn"
"single_range_in_vec_init" = "allow"
"str_to_string" = "warn"
"todo" = "warn"
"unnecessary_semicolon" = "warn"
"unused_async" = "warn"
